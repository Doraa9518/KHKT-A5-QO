  <style>
    :root {
      --ui-bg-1: #f4f7fb;
      --ui-bg-2: #e8eef7;
      --ui-card: rgba(255, 255, 255, 0.86);
      --ui-panel: rgba(15, 23, 42, 0.05);
      --ui-line: rgba(15, 23, 42, 0.12);
      --ui-text: #172033;
      --ui-muted: #5b6678;
      --ui-accent: #5b7cff;
      --ui-bot-bg: rgba(255,255,255,0.82);
      --ui-bot-text: #172033;
      --ui-shadow: 0 20px 48px rgba(15, 23, 42, 0.14);
    }

    body.dark-theme {
      --ui-bg-1: #121417;
      --ui-bg-2: #0f172a;
      --ui-card: rgba(24, 29, 36, 0.8);
      --ui-panel: rgba(255,255,255,0.04);
      --ui-line: rgba(255,255,255,0.08);
      --ui-text: #f0f2f5;
      --ui-muted: #b0b3b8;
      --ui-bot-bg: rgba(255,255,255,0.06);
      --ui-bot-text: #f1f5f9;
      --ui-shadow: 0 22px 55px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--ui-accent) 16%, transparent), var(--ui-bg-1) 58%);
      margin: 0;
      padding: 20px;
      min-height: 100dvh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--ui-text);
      transition: background 0.35s ease, color 0.25s ease;
    }

    .chat-card {
      position: relative;
      width: min(100%, 1400px);
      height: min(90dvh, calc(var(--vvh, 100dvh) - 40px));
      background: rgba(7, 11, 18, 0.52);
      border: 1px solid var(--ui-line);
      border-radius: 28px;
      box-shadow: var(--ui-shadow);
      display: flex;
      flex-direction: column;
      padding: 14px 18px 18px;
      animation: cardEnter 0.55s cubic-bezier(.2,.8,.2,1) both;
      backdrop-filter: blur(4px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--ui-line);
      padding: 8px 10px 14px;
      margin-bottom: 12px;
      gap: 14px;
    }
    .header-left { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; flex: 1; }
    .header h3 {
      margin: 0;
      color: var(--ui-text);
      font-size: 1.04rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .header h3::first-letter { color: var(--ui-accent); }

    .mode-select, .thinking-select, .detail-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--ui-line);
      background: rgba(255,255,255,0.04);
      font-weight: 600;
      color: var(--ui-text);
      outline: none;
      cursor: pointer;
      font-size: 12px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .mode-select option, .thinking-select option, .detail-select option {
      background: #ffffff;
      color: #172033;
    }
    body.dark-theme .mode-select,
    body.dark-theme .thinking-select,
    body.dark-theme .detail-select {
      background: #1b2028;
      color: #f0f2f5;
      color-scheme: dark;
    }
    body.dark-theme .mode-select option,
    body.dark-theme .thinking-select option,
    body.dark-theme .detail-select option {
      background: #1b2028;
      color: #f0f2f5;
    }
    .mode-select:hover, .thinking-select:hover, .detail-select:hover { border-color: var(--ui-accent); transform: translateY(-1px); }

    .clear-btn {
      background: rgba(91,124,255,0.2);
      color: var(--ui-text);
      border: none;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .clear-btn:hover { background: rgba(217, 54, 62, 0.9); }

    .ui-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .layout-btn {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .gear-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .gear-btn:hover {
      transform: rotate(90deg) scale(1.04);
      box-shadow: 0 8px 18px rgba(91, 124, 255, 0.12);
    }

    .settings-panel {
      position: absolute;
      top: 76px;
      right: 18px;
      display: flex;
      gap: 10px;
      flex-direction: column;
      align-items: stretch;
      width: min(360px, calc(100% - 32px));
      padding: 16px;
      border: 1px solid var(--ui-line);
      border-radius: 20px;
      background: color-mix(in srgb, var(--ui-bg-1) 94%, transparent);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.4);
      opacity: 0;
      transform: translateY(-10px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 20;
      color: var(--ui-text);
      font-size: 12px;
    }
    .settings-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      animation: panelEnter 0.22s ease both;
    }
    .settings-close-btn {
      align-self: flex-end;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--ui-line);
      border-radius: 50%;
      background: var(--ui-panel);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .settings-close-btn:hover { background: color-mix(in srgb, var(--ui-accent) 18%, transparent); }
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--ui-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .theme-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .theme-btn, .accent-btn {
      border: 1px solid var(--ui-line);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
      color: var(--ui-text);
      font-size: 12px;
    }
    .accent-btn { width: 22px; height: 22px; padding: 0; border-radius: 50%; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      border-radius: 22px;
      padding: 18px 18px 20px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--ui-line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    .msg-container { max-width: 1280px; margin: 0 auto; width: 100%; }
    .msg {
      width: fit-content;
      margin: 6px 0;
      padding: 15px 18px;
      border-radius: 20px;
      max-width: 88%;
      line-height: 1.6;
      word-wrap: break-word;
      font-size: 15px;
      animation: messageEnter 0.3s cubic-bezier(.2,.8,.2,1) both;
    }
    .user {
      background: linear-gradient(135deg, var(--ui-accent), color-mix(in srgb, var(--ui-accent) 72%, #172554 28%));
      color: white;
      margin-left: auto;
      margin-right: 0;
      border-bottom-right-radius: 8px;
      box-shadow: 0 7px 18px color-mix(in srgb, var(--ui-accent) 20%, transparent);
    }
    .user img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-bottom: 8px; display: block; }
    .bot {
      background: var(--ui-bot-bg);
      color: var(--ui-bot-text);
      margin-right: auto;
      border-bottom-left-radius: 8px;
      border: 1px solid var(--ui-line);
      box-shadow: 0 5px 16px rgba(15,23,42,0.06);
    }
    .typing-message { display: inline-flex; align-items: center; gap: 9px; min-width: 112px; }
    .typing-dots { display: inline-flex; align-items: center; gap: 4px; height: 14px; }
    .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ui-accent); animation: typingBounce 1.15s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    .typing-label { color: var(--ui-muted); font-size: 12px; font-style: italic; }
    .bot h1, .bot h2, .bot h3, .bot h4 { margin-top: 10px; margin-bottom: 6px; color: #7db6ff; }
    .bot p { margin: 6px 0; }
    .bot ul, .bot ol { margin: 6px 0; padding-left: 20px; }
    .bot hr { border: 0; height: 1px; background: var(--ui-line); margin: 12px 0; }

    .response-group { width: 100%; }
    .response-meta { width: 90%; display: flex; flex-direction: column; gap: 8px; margin: -2px 0 8px; padding: 10px 18px 0; border-top: 1px dashed var(--ui-line); }
    .engine-badge { display: inline-block; width: fit-content; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .engine-gemini { background: #e8f0fe; color: #1a73e8; }

    .feedback-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .feedback-btn { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--ui-line); background: rgba(255,255,255,0.04); color: var(--ui-text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .feedback-btn.understand:hover { background: #e6f4ea; color: #137333; border-color: #137333; }
    .feedback-btn.confused:hover { background: #fce8e6; color: #c5221f; border-color: #c5221f; }
    .feedback-status { font-size: 12px; font-weight: 600; }
    .feedback-status.understood { color: #137333; }
    .feedback-status.retrying { color: #c5221f; }
    .speech-toggle-btn { padding: 5px 9px; border-radius: 12px; border: 1px solid var(--ui-line); background: rgba(255,255,255,0.04); color: var(--ui-text); font-size: 12px; cursor: pointer; }
    .illustration-btn { padding: 5px 10px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--ui-accent) 45%, var(--ui-line)); background: color-mix(in srgb, var(--ui-accent) 10%, transparent); color: var(--ui-text); font-size: 12px; cursor: pointer; }
    .illustration-btn:hover { background: color-mix(in srgb, var(--ui-accent) 22%, transparent); }
    .illustration-btn:disabled { opacity: 0.65; cursor: wait; }
    .anim-stage { position: relative; width: 100%; max-width: 720px; margin: 0 auto; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 28% 18%, #17233f 0%, #0b1120 72%); box-shadow: inset 0 0 0 1px rgba(148,163,184,0.16); }
    .anim-canvas { display: block; width: 100%; height: 100%; }
    .anim-labels { position: absolute; inset: 0; pointer-events: none; font-size: 15px; }
    .anim-label { position: absolute; left: 50%; top: 30px; opacity: 0; white-space: nowrap; color: #e8eefb; text-shadow: 0 2px 10px rgba(0,0,0,0.6); will-change: transform, opacity; }
    .anim-label mjx-container { color: #e8eefb; }
    .anim-replay { position: absolute; right: 10px; bottom: 10px; padding: 5px 11px; border-radius: 999px; border: 1px solid rgba(226,232,240,0.32); background: rgba(15,23,42,0.62); color: #e2e8f0; font-size: 12px; font-weight: 600; cursor: pointer; }
    .anim-replay:hover { background: rgba(15,23,42,0.85); }
    body.phone-mode .anim-labels { font-size: 12px; }
    .illustration-panel { margin-top: 14px; padding: 14px; border: 1px solid var(--ui-line); border-radius: 18px; background: color-mix(in srgb, var(--ui-panel) 82%, transparent); overflow: hidden; animation: illustrationEnter 0.45s cubic-bezier(.2,.8,.2,1) both; }
    .illustration-panel svg { display: block; width: min(100%, 620px); max-height: 420px; margin: 0 auto; filter: drop-shadow(0 12px 18px rgba(15,23,42,0.14)); }
    .illustration-code-frame { display: block; width: min(100%, 720px); height: 440px; margin: 0 auto; border: 0; border-radius: 12px; background: var(--ui-bg-1); }
    .animation-container { width: 100%; height: 320px; margin: 10px 0; overflow: hidden; border: 1px solid var(--ui-line); border-radius: 12px; background: #0f172a; }
    .animation-container iframe { display: block; width: 100%; height: 100%; border: 0; }
    .manim-video { display: block; width: min(100%, 720px); max-height: 440px; margin: 0 auto; border-radius: 12px; background: #0f172a; }
    .diagram-svg { color: var(--ui-text); background: color-mix(in srgb, var(--ui-bg-1) 72%, transparent); border-radius: 12px; }
    .diagram-line { stroke: var(--ui-accent); stroke-width: 3; fill: none; stroke-linecap: round; }
    .sine-curve { stroke: #f23f9b; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .diagram-arrow { stroke: #ef6c4f; }
    .diagram-axis { stroke: var(--ui-muted); stroke-width: 2; fill: none; }
    .diagram-grid { stroke: var(--ui-line); stroke-width: 1; stroke-dasharray: 3 5; }
    .diagram-point { fill: var(--ui-accent); stroke: var(--ui-bg-1); stroke-width: 2; }
    .diagram-circle { stroke: var(--ui-accent); stroke-width: 3; fill: color-mix(in srgb, var(--ui-accent) 10%, transparent); }
    .diagram-title { fill: var(--ui-text); font-size: 18px; font-weight: 700; }
    .diagram-label, .diagram-note { fill: var(--ui-text); font-size: 14px; }
    .diagram-tick-label { font-size: 12px; }
    .diagram-note { fill: var(--ui-muted); font-size: 12px; }
    .diagram-svg .diagram-animated { transform-box: fill-box; transform-origin: center; }
    .manim-code { width: 100%; max-height: 420px; overflow: auto; margin: 10px 0 0; padding: 14px; border: 1px solid var(--ui-line); border-radius: 12px; background: var(--ui-bg-1); color: var(--ui-text); font: 12px/1.5 Consolas, "Courier New", monospace; text-align: left; white-space: pre-wrap; }
    .illustration-note { color: var(--ui-muted); font-size: 11px; margin-top: 8px; text-align: center; }
    .learning-tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .learning-tool-btn { border: 1px solid var(--ui-line); border-radius: 12px; padding: 8px 11px; background: rgba(255,255,255,0.04); color: var(--ui-text); cursor: pointer; font-size: 12px; font-weight: 700; }
    .learning-tool-btn.active { background: rgba(91,124,255,0.18); border-color: rgba(91,124,255,0.5); color: #dfe9ff; }
    .english-tools { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
    body.english-mode .english-tools { display: flex; }
    body.english-mode .learning-tools, body.english-mode .mode-ribbon { display: none; }
    body.english-mode .upload-btn,
    body.english-mode .image-preview-container { display: none !important; }
    .english-level { width: auto; min-width: 150px; padding: 8px 11px; border: 1px solid var(--ui-line); border-radius: 12px; background: var(--ui-panel); color: var(--ui-text); font-size: 12px; font-weight: 700; }
    .voice-status { color: var(--ui-muted); font-size: 12px; font-style: italic; }
    .english-mode-btn, .voice-btn { border: 1px solid var(--ui-line); border-radius: 999px; padding: 9px 13px; background: var(--ui-panel); color: var(--ui-text); cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .english-mode-btn.active, .voice-btn.active { background: color-mix(in srgb, var(--ui-accent) 20%, transparent); border-color: var(--ui-accent); color: var(--ui-accent); }
    .voice-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 19px; flex: 0 0 44px; }

    .input-wrapper { margin: 0 auto; width: min(100%, 1280px); display: flex; flex-direction: column; gap: 8px; }
    .image-preview-container { display: none; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 12px; width: fit-content; }
    .image-preview-container img { height: 45px; border-radius: 6px; object-fit: cover; }
    .remove-img-btn { background: #ff4d4f; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .input-row { display: flex; gap: 12px; width: 100%; align-items: center; }
    .upload-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; color: white; }
    input[type="text"] {
      flex: 1;
      padding: 16px 18px;
      border: 1px solid var(--ui-line);
      border-radius: 26px;
      outline: none;
      font-size: 15px;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 56px;
    }
    input[type="text"]:focus { border-color: rgba(91,124,255,0.8); box-shadow: 0 0 0 4px rgba(91,124,255,0.18); }
    button.send-btn { min-height:56px; padding:0 26px; border:none; background: var(--ui-accent); color:white; border-radius:26px; cursor:pointer; font-weight:600; font-size:15px; box-shadow: 0 8px 20px color-mix(in srgb, var(--ui-accent) 24%, transparent); flex: 0 0 auto; }
    button, .upload-btn, .clear-btn, .layout-btn, .gear-btn { transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease; }
    @media (hover: hover) and (pointer: fine) {
      button:hover, .upload-btn:hover, .clear-btn:hover, .layout-btn:hover, .gear-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }
    }
    button:active, .upload-btn:active { transform: translateY(1px) scale(0.985); }
    @media (hover: none), (pointer: coarse) {
      .mode-select:hover, .thinking-select:hover, .detail-select:hover, .glass-select-trigger:hover { transform: none; }
      input[type="text"] { font-size: 16px; }
    }
    button, .upload-btn, .learning-tool-btn, .feedback-btn, .glass-select-trigger { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    .btn-ico { display: none; }
    .btn-ico + .btn-txt { margin-left: 6px; }
    .layout-btn .btn-ico, .clear-btn .btn-ico, .english-mode-btn .btn-ico { display: inline; }
    .send-btn.busy { opacity: 0.55; cursor: progress; }
    .mode-ribbon { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; width: min(100%, 980px); margin: 0 auto; padding: 9px 12px; border: 1px solid color-mix(in srgb, var(--ui-accent) 32%, var(--glass-border)); border-radius: 18px; background: color-mix(in srgb, var(--ui-accent) 10%, var(--ui-panel)); color: var(--ui-text); font-size: 12.5px; font-weight: 600; }
    .mode-ribbon[hidden] { display: none; }
    .mode-ribbon .ribbon-hint { color: var(--ui-muted); font-weight: 600; }
    .mode-ribbon .ribbon-spacer { flex: 1 1 auto; }
    .mode-ribbon .ribbon-chip { padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.18); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .mode-ribbon .ribbon-btn { border: 1px solid var(--glass-border); border-radius: 999px; padding: 7px 12px; min-height: 34px; background: rgba(255,255,255,0.16); color: var(--ui-text); font: inherit; cursor: pointer; white-space: nowrap; }
    .mode-ribbon .ribbon-btn.primary { background: var(--ui-accent); border-color: transparent; color: #fff; }
    .mode-ribbon select.ribbon-select { border: 1px solid var(--glass-border); border-radius: 12px; padding: 6px 9px; background: rgba(255,255,255,0.18); color: var(--ui-text); font: inherit; }
    .upload-btn.pulse { animation: uploadPulse 1.3s ease-in-out 3; }
    @keyframes uploadPulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--ui-accent) 55%, transparent); } 45% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--ui-accent) 0%, transparent); } }

<script>
  // KHÔI PHỤC 4 GEMINI KEYS XOAY VÒNG
  const GEMINI_KEYS = window.APP_CONFIG?.geminiKeys || [];
  let currentGeminiIndex = 0;
  function getNextGeminiKey() {
    if (GEMINI_KEYS.length === 0) return "";
    const key = atob(GEMINI_KEYS[currentGeminiIndex]);
    currentGeminiIndex = (currentGeminiIndex + 1) % GEMINI_KEYS.length;
    return key;
  }

  const GEMINI_TALKING_MODELS = ["gemini-3.6-flash", "gemini-3.7-flash", "gemini-3.8-flash", "gemini-3.5-flash", "gemini-flash-latest"];

  const DIAGRAM_SYSTEM_PROMPT = `

  // SYSTEM PROMPT BẮT BỤC DÙNG DẤU $ CHO CÔNG THỨC TOÁN
  const PROMPT_STUDENT = `

  2. Trả lời thân thiện, thoải mái nhưng lịch sự, tinh tế, gần gũi và lễ phép, giải thích thì phải đầy đủ và dễ hiểu. Câu hỏi đơn giản thì trả lời gọn; bài tập cần giải thì không được trả lời cụt lủn.

${DIAGRAM_SYSTEM_PROMPT}

  const PROMPT_TEACHER = `

  const PROMPT_TALKSHOW = `

  function setupGlassSelects() {
    document.querySelectorAll(".glass-select").forEach(shell => {
      const select = shell.querySelector("select");
      const menu = shell.querySelector(".glass-select-menu");
      const trigger = shell.querySelector(".glass-select-trigger");
      if (!select || !menu || !trigger) return;

      [...select.options].forEach(option => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "glass-select-option";
        item.dataset.value = option.value;
        item.setAttribute("role", "option");
        item.textContent = option.textContent;
        item.addEventListener("click", () => {
          select.value = option.value;
          select.dispatchEvent(new Event("change", { bubbles: true }));
          updateGlassSelectLabel(select.id);
          closeGlassSelects();
        });
        menu.appendChild(item);
      });

      trigger.addEventListener("click", () => {
        const shouldOpen = !shell.classList.contains("open");
        closeGlassSelects();
        if (shouldOpen) {
          shell.classList.add("open");
          trigger.setAttribute("aria-expanded", "true");
        }
      });
      updateGlassSelectLabel(select.id);
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".glass-select")) closeGlassSelects();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeGlassSelects();
    });
  }

  function updateGlassSelectLabel(selectId) {
    const select = document.getElementById(selectId);
    const shell = select?.closest(".glass-select");
    if (!select || !shell) return;
    const selectedOption = select.options[select.selectedIndex];
    const trigger = shell.querySelector(".glass-select-trigger");
    const label = trigger?.querySelector(".glass-select-label");
    if (label && selectedOption) label.textContent = selectedOption.textContent;
    shell.querySelectorAll(".glass-select-option").forEach(option => {
      const selected = option.dataset.value === select.value;
      option.classList.toggle("selected", selected);
      option.setAttribute("aria-selected", String(selected));
    });
  }

  function closeGlassSelects() {
    document.querySelectorAll(".glass-select.open").forEach(shell => {
      shell.classList.remove("open");
      shell.querySelector(".glass-select-trigger")?.setAttribute("aria-expanded", "false");
    });
  }

  function setupImageDropAndPaste() {
    const inputRow = document.getElementById("inputRow");
    if (!inputRow) return;

    ["dragenter", "dragover"].forEach(eventName => inputRow.addEventListener(eventName, event => {
      if ([...(event.dataTransfer?.types || [])].includes("Files")) {
        event.preventDefault();
        inputRow.classList.add("image-drop-active");
      }
    }));
    ["dragleave", "drop"].forEach(eventName => inputRow.addEventListener(eventName, event => {
      if (eventName === "drop") event.preventDefault();
      inputRow.classList.remove("image-drop-active");
    }));
    inputRow.addEventListener("drop", event => {
      const image = [...(event.dataTransfer?.files || [])].find(file => file.type.startsWith("image/"));
      if (image) loadImageFile(image);
    });
    document.addEventListener("paste", event => {
      const imageItem = [...(event.clipboardData?.items || [])].find(item => item.type.startsWith("image/"));
      const image = imageItem?.getAsFile();
      if (!image) return;
      event.preventDefault();
      loadImageFile(image);
    });
  }

  // HÀM CHUYỂN ĐỔI CHUẨN HÓA LATEX
  function fixLatexFormat(text) {
    if (!text) return "";
    let cleaned = text
      .replace(/\\\[/g, "$$")
      .replace(/\\\]/g, "$$")
      .replace(/\\\(/g, "$")
      .replace(/\\\)/g, "$");

    // Chuẩn hóa riêng phần công thức, không đụng vào dấu câu của văn bản thường.
    cleaned = cleaned.replace(/(\$\$[\s\S]*?\$\$|\$(?!\$)[\s\S]*?\$(?!\$))/g, mathBlock => {
      const isDisplayMath = mathBlock.startsWith("$$");
      const delimiter = isDisplayMath ? "$$" : "$";
      const innerMath = mathBlock.slice(delimiter.length, -delimiter.length)
        .replace(/;/g, " ")
        .replace(/(\d+)\.(\d+)/g, "$1{,}$2")
        .replace(/\s+,/g, ",")
        .replace(/[ \t]{2,}/g, " ")
        .trim();
      return delimiter + innerMath + delimiter;
    });

    return cleaned;
  }

  const ARENA_SUBJECTS = ["Toán", "Vật lí", "Hóa học"];
  const ARENA_LEVELS = ["Vận dụng", "Vận dụng cao", "HSG vòng tỉnh", "HSG vòng quốc gia"];
  let arenaSession = { subject: "Toán", level: "Vận dụng cao", startedAt: 0, seconds: 0, timerId: null, problems: 0, scores: [] };

  function ribbonNode(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function formatArenaTime(totalSeconds) {
    const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, "0");
    const seconds = String(totalSeconds % 60).padStart(2, "0");
    return `${minutes}:${seconds}`;
  }

  function stopArenaTimer() {
    if (arenaSession.timerId) window.clearInterval(arenaSession.timerId);
    arenaSession.timerId = null;
  }

  function startArenaTimer() {
    stopArenaTimer();
    arenaSession.startedAt = Date.now();
    arenaSession.seconds = 0;
    arenaSession.timerId = window.setInterval(() => {
      arenaSession.seconds = Math.round((Date.now() - arenaSession.startedAt) / 1000);
      const chip = document.getElementById("arenaTimerChip");
      if (chip) chip.textContent = `⏱ ${formatArenaTime(arenaSession.seconds)}`;
    }, 1000);
  }

  function arenaAverageLabel() {
    if (!arenaSession.scores.length) return "Điểm: chưa có checkpoint";
    const avg = arenaSession.scores.reduce((sum, value) => sum + value, 0) / arenaSession.scores.length;
    return `Điểm TB: ${avg.toFixed(1)}/10 · ${arenaSession.scores.length} checkpoint`;
  }

  function renderModeRibbon() {
    const ribbon = document.getElementById("modeRibbon");
    if (!ribbon) return;
    ribbon.replaceChildren();
    if (learningMode === "normal") { ribbon.hidden = true; return; }
    ribbon.hidden = false;

    if (learningMode === "diagnose") {
      ribbon.append(ribbonNode("strong", null, "🩺 Chẩn đoán lỗi bài làm"));
      ribbon.append(ribbonNode("span", "ribbon-hint", selectedImageBase64
        ? "Tớ sẽ đọc từng bước cậu đã làm, chỉ ra bước sai đầu tiên và vì sao sai — chưa đưa lời giải đầy đủ."
        : "Gắn ảnh bài làm (chép rõ từng bước) hoặc gõ lại các bước cậu đã làm. Không có bài làm thì tớ chỉ nêu lỗi thường gặp."));
      ribbon.append(ribbonNode("span", "ribbon-spacer"));
      const pick = ribbonNode("button", "ribbon-btn primary", "📷 Chọn ảnh bài làm");
      pick.type = "button";
      pick.onclick = () => document.getElementById("imageInput").click();
      ribbon.append(pick);
      const off = ribbonNode("button", "ribbon-btn", "Tắt");
      off.type = "button";
      off.onclick = () => setLearningMode("normal");
      ribbon.append(off);
      return;
    }

    ribbon.append(ribbonNode("strong", null, "🏆 Luyện thi HSG"));
    const subject = ribbonNode("select", "ribbon-select");
    subject.setAttribute("aria-label", "Môn luyện");
    ARENA_SUBJECTS.forEach((name) => {
      const opt = ribbonNode("option", null, name);
      opt.value = name;
      opt.selected = name === arenaSession.subject;
      subject.append(opt);
    });
    subject.onchange = () => { arenaSession.subject = subject.value; };
    ribbon.append(subject);

    const level = ribbonNode("select", "ribbon-select");
    level.setAttribute("aria-label", "Độ khó");
    ARENA_LEVELS.forEach((name) => {
      const opt = ribbonNode("option", null, name);
      opt.value = name;
      opt.selected = name === arenaSession.level;
      level.append(opt);
    });
    level.onchange = () => { arenaSession.level = level.value; };
    ribbon.append(level);

    const timerChip = ribbonNode("span", "ribbon-chip", `⏱ ${formatArenaTime(arenaSession.seconds)}`);
    timerChip.id = "arenaTimerChip";
    ribbon.append(timerChip);
    ribbon.append(ribbonNode("span", "ribbon-chip", arenaAverageLabel()));
    ribbon.append(ribbonNode("span", "ribbon-spacer"));

    const deal = ribbonNode("button", "ribbon-btn primary", arenaSession.problems ? "🎲 Đề mới" : "🎲 Ra đề");
    deal.type = "button";
    deal.onclick = requestArenaProblem;
    ribbon.append(deal);

    const hint = ribbonNode("button", "ribbon-btn", "💡 Gợi ý");
    hint.type = "button";
    hint.disabled = !arenaSession.timerId;
    hint.onclick = requestArenaHint;
    ribbon.append(hint);

    const reveal = ribbonNode("button", "ribbon-btn", "✅ Xem lời giải");
    reveal.type = "button";
    reveal.disabled = !arenaSession.timerId;
    reveal.onclick = requestArenaReveal;
    ribbon.append(reveal);

    const off = ribbonNode("button", "ribbon-btn", "Tắt");
    off.type = "button";
    off.onclick = () => setLearningMode("normal");
    ribbon.append(off);
  }

  function setLearningMode(mode) {
    if (learningMode === "arena" && mode !== "arena") {
      stopArenaTimer();
      arenaSession.seconds = 0;
      arenaSession.problems = 0;
      arenaSession.scores = [];
    }
    learningMode = mode;
    document.getElementById("diagnoseBtn").classList.toggle("active", mode === "diagnose");
    document.getElementById("arenaBtn").classList.toggle("active", mode === "arena");
    document.getElementById("userInput").placeholder = mode === "diagnose"
      ? "Dán lại từng bước cậu đã làm hoặc gắn ảnh bài làm..."
      : mode === "arena"
        ? "Bấm 🎲 Ra đề, hoặc gõ bài cậu muốn tự giải..."
        : "Nhập câu hỏi...";
    renderModeRibbon();
  }

  function requestArenaProblem() {
    if (isSendingMessage) { nudgeComposer(); return; }
    arenaSession.problems += 1;
    startArenaTimer();
    renderModeRibbon();
    sendMessage(`[Luyện thi HSG · đề ${arenaSession.problems}] Ra cho tớ ĐÚNG một bài ${arenaSession.subject} bồi dưỡng học sinh giỏi cấp THPT, độ khó "${arenaSession.level}". Chỉ ghi đề bài cùng dữ kiện, chưa gợi ý, chưa lời giải, chưa đáp số. Cuối đề thêm dòng "Thời gian tự làm gợi ý: ... phút" và câu hỏi "Điểm then chốt của bài này nằm ở đâu?".`);
  }

  function requestArenaHint() {
    if (isSendingMessage) { nudgeComposer(); return; }
    sendMessage("Tớ đang bí ở đề hiện tại. Cho tớ ĐÚNG một gợi ý: nêu hướng khai thác (chiến lược, đối tượng cần đặt ẩn/bất biến) nhưng KHÔNG biến đổi tiếp, KHÔNG đưa đáp số. Kết thúc bằng câu hỏi buộc tớ tự viết bước tiếp theo.");
  }

  function requestArenaReveal() {
    if (isSendingMessage) { nudgeComposer(); return; }
    stopArenaTimer();
    const spent = formatArenaTime(arenaSession.seconds);
    renderModeRibbon();
    sendMessage(`Tớ xin xem lời giải đề hiện tại (tớ đã tự làm ${spent}). Hãy: (1) trình bày lời giải đầy đủ, (2) chỉ rõ bước quyết định mà tớ có thể đã bỏ sót, (3) chốt 2 kỹ năng tớ cần luyện từ bài này, (4) ra 1 bài tương tự nhưng nhẹ hơn để tớ tự làm lại.`);
  }

    if (learningMode === "diagnose") { setLearningMode("normal"); return; }
    saveLearnerProfile("diagnosis", "Người học muốn tìm bước sai và nguyên nhân tư duy.");
    setLearningMode("diagnose");
    if (selectedImageBase64) {
      sendMessage("Mình sai ở đâu trong bài làm này? Đọc lại từng bước tớ đã viết, chỉ ra bước sai đầu tiên và vì sao sai về bản chất, chưa đưa lời giải đầy đủ.");
      return;
    }
    const upload = document.querySelector(".upload-btn");
    if (upload) {
      upload.classList.remove("pulse");
