  <style>
    :root {
      --ui-bg-1: #f4f7fb;
      --ui-bg-2: #e8eef7;
      --ui-card: rgba(255, 255, 255, 0.86);
      --ui-panel: rgba(15, 23, 42, 0.05);
      --ui-line: rgba(15, 23, 42, 0.12);
      --ui-text: #172033;
      --ui-muted: #5b6678;
      --ui-accent: #5b7cff;
      --ui-bot-bg: rgba(255,255,255,0.82);
      --ui-bot-text: #172033;
      --ui-shadow: 0 20px 48px rgba(15, 23, 42, 0.14);
    }

    body.dark-theme {
      --ui-bg-1: #121417;
      --ui-bg-2: #0f172a;
      --ui-card: rgba(24, 29, 36, 0.8);
      --ui-panel: rgba(255,255,255,0.04);
      --ui-line: rgba(255,255,255,0.08);
      --ui-text: #f0f2f5;
      --ui-muted: #b0b3b8;
      --ui-bot-bg: rgba(255,255,255,0.06);
      --ui-bot-text: #f1f5f9;
      --ui-shadow: 0 22px 55px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--ui-accent) 16%, transparent), var(--ui-bg-1) 58%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--ui-text);
      transition: background 0.35s ease, color 0.25s ease;
    }

    .chat-card {
      position: relative;
      width: min(100%, 1400px);
      height: 90vh;
      background: rgba(7, 11, 18, 0.52);
      border: 1px solid var(--ui-line);
      border-radius: 28px;
      box-shadow: var(--ui-shadow);
      display: flex;
      flex-direction: column;
      padding: 14px 18px 18px;
      animation: cardEnter 0.55s cubic-bezier(.2,.8,.2,1) both;
      backdrop-filter: blur(4px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--ui-line);
      padding: 8px 10px 14px;
      margin-bottom: 12px;
      gap: 14px;
    }
    .header-left { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; flex: 1; }
    .header h3 {
      margin: 0;
      color: var(--ui-text);
      font-size: 1.04rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .header h3::first-letter { color: var(--ui-accent); }

    .mode-select, .thinking-select, .detail-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--ui-line);
      background: rgba(255,255,255,0.04);
      font-weight: 600;
      color: var(--ui-text);
      outline: none;
      cursor: pointer;
      font-size: 12px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .mode-select option, .thinking-select option, .detail-select option {
      background: #ffffff;
      color: #172033;
    }
    body.dark-theme .mode-select,
    body.dark-theme .thinking-select,
    body.dark-theme .detail-select {
      background: #1b2028;
      color: #f0f2f5;
      color-scheme: dark;
    }
    body.dark-theme .mode-select option,
    body.dark-theme .thinking-select option,
    body.dark-theme .detail-select option {
      background: #1b2028;
      color: #f0f2f5;
    }
    .mode-select:hover, .thinking-select:hover, .detail-select:hover { border-color: var(--ui-accent); transform: translateY(-1px); }

    .clear-btn {
      background: rgba(91,124,255,0.2);
      color: var(--ui-text);
      border: none;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .clear-btn:hover { background: rgba(217, 54, 62, 0.9); }

    .ui-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .layout-btn {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .gear-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .gear-btn:hover {
      transform: rotate(90deg) scale(1.04);
      box-shadow: 0 8px 18px rgba(91, 124, 255, 0.12);
    }

    .settings-panel {
      position: absolute;
      top: 76px;
      right: 18px;
      display: flex;
      gap: 10px;
      flex-direction: column;
      align-items: stretch;
      width: min(360px, calc(100% - 32px));
      padding: 16px;
      border: 1px solid var(--ui-line);
      border-radius: 20px;
      background: color-mix(in srgb, var(--ui-bg-1) 94%, transparent);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.4);
      opacity: 0;
      transform: translateY(-10px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 20;
      color: var(--ui-text);
      font-size: 12px;
    }
    .settings-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      animation: panelEnter 0.22s ease both;
    }
    .settings-close-btn {
      align-self: flex-end;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--ui-line);
      border-radius: 50%;
      background: var(--ui-panel);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .settings-close-btn:hover { background: color-mix(in srgb, var(--ui-accent) 18%, transparent); }
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--ui-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .theme-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .theme-btn, .accent-btn {
      border: 1px solid var(--ui-line);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
      color: var(--ui-text);
      font-size: 12px;
    }
    .accent-btn { width: 22px; height: 22px; padding: 0; border-radius: 50%; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      border-radius: 22px;
      padding: 18px 18px 20px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--ui-line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    .msg-container { max-width: 1280px; margin: 0 auto; width: 100%; }
    .msg {
      width: fit-content;
      margin: 6px 0;
      padding: 15px 18px;
      border-radius: 20px;
      max-width: 88%;
      line-height: 1.6;
      word-wrap: break-word;
      font-size: 15px;
      animation: messageEnter 0.3s cubic-bezier(.2,.8,.2,1) both;
    }
    .user {
      background: linear-gradient(135deg, var(--ui-accent), color-mix(in srgb, var(--ui-accent) 72%, #172554 28%));
      color: white;
      margin-left: auto;
      margin-right: 0;
      border-bottom-right-radius: 8px;
      box-shadow: 0 7px 18px color-mix(in srgb, var(--ui-accent) 20%, transparent);
    }
    .user img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-bottom: 8px; display: block; }
    .bot {
      background: var(--ui-bot-bg);
      color: var(--ui-bot-text);
      margin-right: auto;
      border-bottom-left-radius: 8px;
      border: 1px solid var(--ui-line);
      box-shadow: 0 5px 16px rgba(15,23,42,0.06);
    }
    .typing-message { display: inline-flex; align-items: center; gap: 9px; min-width: 112px; }
    .typing-dots { display: inline-flex; align-items: center; gap: 4px; height: 14px; }
    .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ui-accent); animation: typingBounce 1.15s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    .typing-label { color: var(--ui-muted); font-size: 12px; font-style: italic; }
    .bot h1, .bot h2, .bot h3, .bot h4 { margin-top: 10px; margin-bottom: 6px; color: #7db6ff; }
    .bot p { margin: 6px 0; }
    .bot ul, .bot ol { margin: 6px 0; padding-left: 20px; }
    .bot hr { border: 0; height: 1px; background: var(--ui-line); margin: 12px 0; }

    .response-group { width: 100%; }
    .response-meta { width: 90%; display: flex; flex-direction: column; gap: 8px; margin: -2px 0 8px; padding: 10px 18px 0; border-top: 1px dashed var(--ui-line); }
    .engine-badge { display: inline-block; width: fit-content; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .engine-gemini { background: #e8f0fe; color: #1a73e8; }

    .feedback-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .feedback-btn { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--ui-line); background: rgba(255,255,255,0.04); color: var(--ui-text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .feedback-btn.understand:hover { background: #e6f4ea; color: #137333; border-color: #137333; }
    .feedback-btn.confused:hover { background: #fce8e6; color: #c5221f; border-color: #c5221f; }
    .feedback-status { font-size: 12px; font-weight: 600; }
    .feedback-status.understood { color: #137333; }
    .feedback-status.retrying { color: #c5221f; }
    .speech-toggle-btn { padding: 5px 9px; border-radius: 12px; border: 1px solid var(--ui-line); background: rgba(255,255,255,0.04); color: var(--ui-text); font-size: 12px; cursor: pointer; }
    .illustration-btn { padding: 5px 10px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--ui-accent) 45%, var(--ui-line)); background: color-mix(in srgb, var(--ui-accent) 10%, transparent); color: var(--ui-text); font-size: 12px; cursor: pointer; }
    .illustration-btn:hover { background: color-mix(in srgb, var(--ui-accent) 22%, transparent); }
    .illustration-btn:disabled { opacity: 0.65; cursor: wait; }
    .illustration-panel { margin-top: 14px; padding: 14px; border: 1px solid var(--ui-line); border-radius: 18px; background: color-mix(in srgb, var(--ui-panel) 82%, transparent); overflow: hidden; animation: illustrationEnter 0.45s cubic-bezier(.2,.8,.2,1) both; }
    .illustration-panel svg { display: block; width: min(100%, 620px); max-height: 420px; margin: 0 auto; filter: drop-shadow(0 12px 18px rgba(15,23,42,0.14)); }
    .illustration-code-frame { display: block; width: min(100%, 720px); height: 440px; margin: 0 auto; border: 0; border-radius: 12px; background: var(--ui-bg-1); }
    .animation-container { width: 100%; height: 320px; margin: 10px 0; overflow: hidden; border: 1px solid var(--ui-line); border-radius: 12px; background: #0f172a; }
    .animation-container iframe { display: block; width: 100%; height: 100%; border: 0; }
    .manim-video { display: block; width: min(100%, 720px); max-height: 440px; margin: 0 auto; border-radius: 12px; background: #0f172a; }
    .diagram-svg { color: var(--ui-text); background: color-mix(in srgb, var(--ui-bg-1) 72%, transparent); border-radius: 12px; }
    .diagram-line { stroke: var(--ui-accent); stroke-width: 3; fill: none; stroke-linecap: round; }
    .sine-curve { stroke: #f23f9b; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .diagram-arrow { stroke: #ef6c4f; }
    .diagram-axis { stroke: var(--ui-muted); stroke-width: 2; fill: none; }
    .diagram-grid { stroke: var(--ui-line); stroke-width: 1; stroke-dasharray: 3 5; }
    .diagram-point { fill: var(--ui-accent); stroke: var(--ui-bg-1); stroke-width: 2; }
    .diagram-circle { stroke: var(--ui-accent); stroke-width: 3; fill: color-mix(in srgb, var(--ui-accent) 10%, transparent); }
    .diagram-title { fill: var(--ui-text); font-size: 18px; font-weight: 700; }
    .diagram-label, .diagram-note { fill: var(--ui-text); font-size: 14px; }
    .diagram-tick-label { font-size: 12px; }
    .diagram-note { fill: var(--ui-muted); font-size: 12px; }
    .diagram-svg .diagram-animated { transform-box: fill-box; transform-origin: center; }
    .manim-code { width: 100%; max-height: 420px; overflow: auto; margin: 10px 0 0; padding: 14px; border: 1px solid var(--ui-line); border-radius: 12px; background: var(--ui-bg-1); color: var(--ui-text); font: 12px/1.5 Consolas, "Courier New", monospace; text-align: left; white-space: pre-wrap; }
    .illustration-note { color: var(--ui-muted); font-size: 11px; margin-top: 8px; text-align: center; }
    .learning-tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .learning-tool-btn { border: 1px solid var(--ui-line); border-radius: 12px; padding: 8px 11px; background: rgba(255,255,255,0.04); color: var(--ui-text); cursor: pointer; font-size: 12px; font-weight: 700; }
    .learning-tool-btn.active { background: rgba(91,124,255,0.18); border-color: rgba(91,124,255,0.5); color: #dfe9ff; }
    .english-tools { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
    body.english-mode .english-tools { display: flex; }
    body.english-mode .learning-tools { display: none; }
    body.english-mode .upload-btn,
    body.english-mode .image-preview-container { display: none !important; }
    .english-level { width: auto; min-width: 150px; padding: 8px 11px; border: 1px solid var(--ui-line); border-radius: 12px; background: var(--ui-panel); color: var(--ui-text); font-size: 12px; font-weight: 700; }
    .voice-status { color: var(--ui-muted); font-size: 12px; font-style: italic; }
    .english-mode-btn, .voice-btn { border: 1px solid var(--ui-line); border-radius: 999px; padding: 9px 13px; background: var(--ui-panel); color: var(--ui-text); cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .english-mode-btn.active, .voice-btn.active { background: color-mix(in srgb, var(--ui-accent) 20%, transparent); border-color: var(--ui-accent); color: var(--ui-accent); }
    .voice-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 19px; flex: 0 0 44px; }

    .input-wrapper { margin: 0 auto; width: min(100%, 1280px); display: flex; flex-direction: column; gap: 8px; }
    .image-preview-container { display: none; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 12px; width: fit-content; }
    .image-preview-container img { height: 45px; border-radius: 6px; object-fit: cover; }
    .remove-img-btn { background: #ff4d4f; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .input-row { display: flex; gap: 12px; width: 100%; align-items: center; }
    .upload-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; color: white; }
    input[type="text"] {
      flex: 1;
      padding: 16px 18px;
      border: 1px solid var(--ui-line);
      border-radius: 26px;
      outline: none;
      font-size: 15px;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 56px;
    }
    input[type="text"]:focus { border-color: rgba(91,124,255,0.8); box-shadow: 0 0 0 4px rgba(91,124,255,0.18); }
    button.send-btn { min-height:56px; padding:0 26px; border:none; background: var(--ui-accent); color:white; border-radius:26px; cursor:pointer; font-weight:600; font-size:15px; box-shadow: 0 8px 20px color-mix(in srgb, var(--ui-accent) 24%, transparent); }
    button, .upload-btn, .clear-btn, .layout-btn, .gear-btn { transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease; }
    button:hover, .upload-btn:hover, .clear-btn:hover, .layout-btn:hover, .gear-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

    body.phone-mode { padding: 14px; }
    body.phone-mode .chat-card { width: min(100%, 430px); height: 92vh; padding: 12px; }
    body.phone-mode .header { align-items: flex-start; flex-direction: column; }
    body.phone-mode .header-left { width: 100%; gap: 6px; }
    body.phone-mode .header h3 { width: 100%; }
    body.phone-mode .ui-tools { width: 100%; justify-content: flex-end; }
    body.phone-mode .chat-box { padding: 11px; }
    body.phone-mode .msg { max-width: 92%; }
    body.phone-mode .response-meta { width: 92%; }
    body.phone-mode .input-row { gap: 7px; }
    body.phone-mode .upload-btn { width: 44px; height: 44px; }
    body.phone-mode button.send-btn { padding: 0 17px; }

    /* Chống tràn ngang: công thức MathJax / bảng / code dài cuộn trong bong bóng */
    .msg, .bot-text, .response-group { min-width: 0; }
    .msg { overflow-wrap: anywhere; }
    .bot-text mjx-container[display="true"] {
      max-width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 2px 0 6px;
      scrollbar-width: thin;
    }
    .msg pre, .msg table, .msg img, .msg video { max-width: 100%; overflow-x: auto; }
    body.phone-mode .chat-box { overflow-x: hidden; }
    body.phone-mode .bot-text mjx-container[display="true"] { font-size: 0.92em; }

    @keyframes cardEnter { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes messageEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes panelEnter { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.35; } 30% { transform: translateY(-4px); opacity: 1; } }
    @keyframes illustrationEnter { from { opacity: 0; transform: translateY(10px) scale(0.985); filter: blur(5px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .chat-card { height: 92vh; padding: 12px; }
      .header { align-items: flex-start; }
      .header-left { gap: 6px; }
      .header h3 { width: 100%; }
      .msg { max-width: 88%; }
    }

    /* Gemini-inspired spacing layer: keeps the existing controls and behavior intact. */
    body {
      padding: 0;
      align-items: stretch;
      background: var(--ui-bg-1);
    }
    .chat-card {
      width: 100%;
      height: 100vh;
      max-width: none;
      padding: 16px 24px 22px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }
    .header {
      width: min(100%, 1180px);
      margin: 0 auto 8px;
      padding: 4px 0 12px;
      border-bottom: 0;
    }
    .chat-box {
      width: min(100%, 980px);
      margin: 0 auto 18px;
      padding: 22px 10px 28px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .msg-container { max-width: 900px; }
    .msg {
      max-width: min(86%, 760px);
      padding: 14px 18px;
    }
    .bot {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding-left: 0;
    }
    .input-wrapper {
      width: min(100%, 980px);
      gap: 10px;
    }
    .learning-tools { padding-left: 4px; }
    .input-row {
      gap: 8px;

    .glass-select { position: relative; width: 100%; z-index: 1; }

    .glass-select-menu {
      position: absolute;

  function setGlassStrength(value) {
    const strength = Math.max(0, Math.min(100, Number(value) || 0));
    document.documentElement.style.setProperty("--glass-strength", (strength / 100).toFixed(2));
    const slider = document.getElementById("glassStrength");

    localStorage.setItem("ai-glass-strength", String(strength));

  function setupGlassSelects() {
    document.querySelectorAll(".glass-select").forEach(shell => {
      const select = shell.querySelector("select");
      const menu = shell.querySelector(".glass-select-menu");
      const trigger = shell.querySelector(".glass-select-trigger");
      if (!select || !menu || !trigger) return;

      [...select.options].forEach(option => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "glass-select-option";
        item.dataset.value = option.value;
        item.setAttribute("role", "option");
        item.textContent = option.textContent;
        item.addEventListener("click", () => {
          select.value = option.value;
          select.dispatchEvent(new Event("change", { bubbles: true }));
          updateGlassSelectLabel(select.id);
          closeGlassSelects();
        });
        menu.appendChild(item);
      });

      trigger.addEventListener("click", () => {
        const shouldOpen = !shell.classList.contains("open");
        closeGlassSelects();
        if (shouldOpen) {
          shell.classList.add("open");
          trigger.setAttribute("aria-expanded", "true");
        }
      });
      updateGlassSelectLabel(select.id);
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".glass-select")) closeGlassSelects();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeGlassSelects();
    });
  }

  function updateGlassSelectLabel(selectId) {
    const select = document.getElementById(selectId);
    const shell = select?.closest(".glass-select");
    if (!select || !shell) return;
    const selectedOption = select.options[select.selectedIndex];
    const trigger = shell.querySelector(".glass-select-trigger");
    const label = trigger?.querySelector(".glass-select-label");
    if (label && selectedOption) label.textContent = selectedOption.textContent;
    shell.querySelectorAll(".glass-select-option").forEach(option => {
      const selected = option.dataset.value === select.value;
      option.classList.toggle("selected", selected);
      option.setAttribute("aria-selected", String(selected));
    });
  }

  function closeGlassSelects() {
    document.querySelectorAll(".glass-select.open").forEach(shell => {
      shell.classList.remove("open");
      shell.querySelector(".glass-select-trigger")?.setAttribute("aria-expanded", "false");
    });
  }

  function setupImageDropAndPaste() {
    const inputRow = document.getElementById("inputRow");
    if (!inputRow) return;

    ["dragenter", "dragover"].forEach(eventName => inputRow.addEventListener(eventName, event => {
      if ([...(event.dataTransfer?.types || [])].includes("Files")) {
        event.preventDefault();
        inputRow.classList.add("image-drop-active");
      }
    }));
    ["dragleave", "drop"].forEach(eventName => inputRow.addEventListener(eventName, event => {
      if (eventName === "drop") event.preventDefault();
      inputRow.classList.remove("image-drop-active");
    }));
    inputRow.addEventListener("drop", event => {
      const image = [...(event.dataTransfer?.files || [])].find(file => file.type.startsWith("image/"));
      if (image) loadImageFile(image);
    });
    document.addEventListener("paste", event => {
      const imageItem = [...(event.clipboardData?.items || [])].find(item => item.type.startsWith("image/"));
      const image = imageItem?.getAsFile();
      if (!image) return;
      event.preventDefault();
      loadImageFile(image);
    });
  }

  function saveLearnerProfile(signal, detail = "") {

  // HÀM CHUYỂN ĐỔI CHUẨN HÓA LATEX
  function fixLatexFormat(text) {
    if (!text) return "";
    let cleaned = text
      .replace(/\\\[/g, "$$")
      .replace(/\\\]/g, "$$")
      .replace(/\\\(/g, "$")
      .replace(/\\\)/g, "$");

    // Chuẩn hóa riêng phần công thức, không đụng vào dấu câu của văn bản thường.
    cleaned = cleaned.replace(/(\$\$[\s\S]*?\$\$|\$(?!\$)[\s\S]*?\$(?!\$))/g, mathBlock => {
      const isDisplayMath = mathBlock.startsWith("$$");
      const delimiter = isDisplayMath ? "$$" : "$";
      const innerMath = mathBlock.slice(delimiter.length, -delimiter.length)
        .replace(/;/g, " ")
        .replace(/(\d+)\.(\d+)/g, "$1{,}$2")
        .replace(/\s+,/g, ",")
        .replace(/[ \t]{2,}/g, " ")
        .trim();
      return delimiter + innerMath + delimiter;
    });

    return cleaned;
  }

  async function sendMessage(overrideText = null) {
    const inputField = document.getElementById("userInput");
    const msgContainer = document.getElementById("msgContainer");
    const chatBox = document.getElementById("chatBox");
    
    if (isSendingMessage) return;

    const text = overrideText ? overrideText : inputField.value.trim();
    if (!text && !selectedImageBase64) return;
    isSendingMessage = true;

    const userParts = [];
    let userMsgHtml = "";

    if (selectedImageBase64) {
      userParts.push({ inline_data: { mime_type: selectedImageMimeType, data: selectedImageBase64 } });
      userMsgHtml += `<img src="data:${selectedImageMimeType};base64,${selectedImageBase64}">`;
    }

    const textPrompt = text || "Giải bài tập trong ảnh giúp tớ nhé!";
    userParts.push({ text: textPrompt });
    userMsgHtml += `<div>${escapeHtml(textPrompt)}</div>`;

    msgContainer.innerHTML += `<div class="msg user">${userMsgHtml}</div>`;
    const hasImage = selectedImageBase64 !== null;
    inputField.value = "";
    removeSelectedImage();
    chatBox.scrollTop = chatBox.scrollHeight;

    chatHistory.push({ role: "user", parts: userParts });
    saveLearnerProfile("question", textPrompt);

    const mode = document.getElementById("aiMode").value;
    const thinkingLevel = document.getElementById("thinkingMode").value;
    const activePrompt = buildActivePrompt();

    const selectedGeminiModel = thinkingLevel === "talking"
      ? GEMINI_TALKING_MODEL
      : GEMINI_STUDY_MODEL;
    const selectedTemperature = learningMode === "arena"
      ? 0.3
      : mode === "talkshow"
      ? 0.65
      : mode === "english"
        ? 0.45
        : thinkingLevel === "talking" ? 0.25 : 0.2;
    const loadingId = "loading-" + Date.now();

    const engineLabel = "Gemini 3.6 Flash";
    msgContainer.innerHTML += `<div class="msg bot typing-message" id="${loadingId}"><span class="typing-dots" aria-label="AI đang soạn trả lời"><span></span><span></span><span></span></span><span class="typing-label">AI đang suy nghĩ...</span></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const engineName = learningMode === "arena"
        ? "Gemini Flash · HSG"
        : hasImage ? "Gemini Flash (ảnh)" : engineLabel;
      const replySuccess = await callGeminiApi(loadingId, activePrompt, selectedGeminiModel, engineName, selectedTemperature);

      if (!replySuccess) {
        document.getElementById(loadingId).innerHTML = "⚠️ Gemini đang bận hoặc các API key đều không khả dụng. Cậu thử lại sau vài giây nhé!";
        chatHistory.pop();
        saveActiveChatHistory();
      }
    } finally {
      isSendingMessage = false;
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // GỌI GEMINI API - TỰ CHUYỂN ĐỔI CHUẨN GEMINI FORMAT
  async function callGeminiApi(loadingId, activePrompt, modelName, engineLabel, temperature) {
    if (!GEMINI_KEYS || GEMINI_KEYS.length === 0) return false;

    const modelCandidates = modelName.includes("lite") ? GEMINI_TALKING_MODELS : GEMINI_STUDY_MODELS;
    let attempts = 0;
    while (attempts < GEMINI_KEYS.length) {
      attempts++;
      const apiKey = getNextGeminiKey();
      if (!apiKey) continue;

      for (const candidateModel of modelCandidates) try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${candidateModel}:generateContent?key=${apiKey}`;

        // TẠO MẢNG CONTENTS RIÊNG CHUẨN GEMINI
        const currentMode = document.getElementById("aiMode").value;
        const historyLimit = currentMode === "english" ? 8 : 10;
        const maxOutputTokens = currentMode === "english"
          ? 700
          : candidateModel.includes("lite") ? 1800 : 5000;

        const geminiContents = chatHistory.slice(-historyLimit).map(msg => {
          const role = (msg.role === "user") ? "user" : "model";
          let parts = [];

          if (Array.isArray(msg.parts)) {
            parts = msg.parts;
          } else if (typeof msg.content === "string") {
            parts = [{ text: msg.content }];
          } else {
            parts = [{ text: "" }];
          }

          const validParts = parts.filter(part =>
            (typeof part.text === "string" && part.text.trim())
            || (part.inline_data?.data && part.inline_data?.mime_type)
          );
          return validParts.length > 0 ? { role, parts: validParts } : null;
        }).filter(Boolean);

        // Gemini yêu cầu lượt hội thoại hợp lệ và không nhận hai lượt model liên tiếp.
        const normalizedContents = [];
        geminiContents.forEach(message => {
          const previous = normalizedContents[normalizedContents.length - 1];
          if (previous && previous.role === message.role) {
            previous.parts.push(...message.parts);
          } else {
            normalizedContents.push({ role: message.role, parts: [...message.parts] });
          }
        });
        if (normalizedContents[0]?.role !== "user") normalizedContents.shift();
        if (!normalizedContents.length) continue;

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: activePrompt }] },
            contents: normalizedContents,
            generationConfig: {
              temperature: temperature,
              maxOutputTokens,
              thinkingConfig: { thinkingBudget: 0 }
            }
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) {
          const status = response.status || 0;
          console.warn(`Gemini lỗi HTTP ${status}:`, data.error?.message || data.error?.status || "");
          // 429/5xx (gồm 503 "quá tải") là lỗi tạm thời: nghỉ ngắn rồi thử model/key khác.
          if (status === 429 || status >= 500) await sleep(400);
          continue;
        }

        const responseParts = data.candidates?.[0]?.content?.parts || [];
        const botReply = responseParts
          .map(part => typeof part.text === "string" ? part.text : "")
          .join("")
          .trim();
        if (botReply) {
          renderBotResponse(loadingId, botReply, engineLabel, "engine-gemini");
          return true;
        }
      } catch (err) {
        console.error(`Lỗi kết nối Gemini lượt ${attempts}:`, err);
      }
    }
    return false;
  }

  // HÀM RENDER ĐÃ ĐƯỢC FIX LỖI LATEX VÀ TRÌNH BÀY
  function renderBotResponse(elemId, replyText, engineName, badgeClass) {
    const botMsgElem = document.getElementById(elemId);
    const responseTarget = document.getElementById(`${elemId}-group`)
      || botMsgElem.closest(".response-group")
      || botMsgElem;
    
    const drawMarkerFound = /\[\[DRAW_DIAGRAM\]\]/i.test(replyText);
    const visibleReplyText = stripManimCode(replyText.replace(/\s*\[\[DRAW_DIAGRAM\]\]\s*/gi, "\n")).trim();

    // 1. CHUẨN HÓA LATEX VỀ DẠNG $ VÀ $$
    const cleanedText = fixLatexFormat(visibleReplyText);

    // 2. CHUYỂN DỔI MARKDOWN THÀNH HTML
    const renderedContent = renderAnimationInChat(marked.parse(cleanedText));

    // 3. THÊM NÚT FEEDBACK
    const speechButtonMarkup = activeSpace === "english"
      ? `<button class="speech-toggle-btn" onclick="toggleSpeechOutput(this)" aria-label="${speechOutputEnabled ? "Tắt đọc câu trả lời" : "Bật đọc câu trả lời"}">${speechOutputEnabled ? "🔊 Đang đọc" : "🔇 Chỉ chữ"}</button>`
      : "";
    const feedbackButtons = `
      <div class="feedback-actions">
        ${speechButtonMarkup}
        ${activeSpace !== "english" ? `<button class="illustration-btn" onclick="requestIllustration('${elemId}-group')" title="Chỉ tạo hình khi cậu cần hình dung">🖼 Vẽ hình minh họa</button>` : ""}
        <button class="feedback-btn understand" onclick="handleFeedback(this, 'understand')">👍 Đã hiểu</button>
        <button class="feedback-btn confused" onclick="handleFeedback(this, 'confused')">❓ Chưa hiểu lắm</button>
      </div>
    `;

    // GHÉP GIAO DIỆN
    responseTarget.outerHTML = `<div class="response-group" id="${elemId}-group"><div class="msg bot" id="${elemId}"><div class="bot-text">${renderedContent}</div></div><div class="response-meta"><span class="engine-badge ${badgeClass}">Engine: ${engineName}</span>${feedbackButtons}</div></div>`;

  function buildSafeManimFallback() {
    return `from manim import *

class DynamicScene(Scene):
    def construct(self):
        formula = MathTex(r"f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}", font_size=32)
        formula.to_edge(UP)
        axes = Axes(x_range=[-3, 3, 1], y_range=[-2, 3, 1], color=GREY)
        curve = axes.plot(lambda x: 0.4 * x ** 2 - 0.5, color=BLUE)
        point = Dot(color=YELLOW)
        self.play(Create(axes), run_time=1.5)
        self.play(Create(curve), run_time=2)
        self.play(Write(formula), run_time=1.6)
        self.play(MoveAlongPath(point, curve), run_time=3)
        self.play(Indicate(formula), run_time=1.2)
        self.wait(1.2)
`;
  }

  function extractManimCode(rawText) {
    const source = String(rawText || "")
      .replace(/&lt;/gi, "<")
      .replace(/&gt;/gi, ">")
      .replace(/&amp;/gi, "&")
      .replace(/\r/g, "")
      .trim();
    const taggedMatch = source.match(/<manim_code\s*>\s*([\s\S]*?)(?:<\/manim_code\s*>|$)/i);
    const fencedMatch = source.match(/```(?:python|py)?\s*([\s\S]*?)```/i);
    const rawCandidate = taggedMatch?.[1] || fencedMatch?.[1] || source;
    const codeStart = rawCandidate.search(/(?:^|\n)\s*from\s+manim\s+import\s+.+/m);
    const candidate = codeStart >= 0 ? rawCandidate.slice(codeStart) : rawCandidate;
    const code = candidate
      .replace(/^\s*```(?:python|py)?\s*/i, "")
      .replace(/\s*```\s*$/i, "")
      .trim();
    return /^\s*from\s+manim\s+import\s+.+/m.test(code)
      && /^\s*class\s+DynamicScene\s*\(\s*Scene\s*\)\s*:/m.test(code)
      && /^\s*def\s+construct\s*\(\s*self\s*\)\s*:/m.test(code)
      ? code
      : "";
  }

  function renderSineGraph() {
    const left = 82;
    const top = 62;
    const width = 590;
    const height = 286;
    const xMin = 0;
    const xMax = Math.PI * 4;
    const yMin = -1.35;
    const yMax = 1.35;
    const mapX = x => left + ((x - xMin) / (xMax - xMin)) * width;
    const mapY = y => top + ((yMax - y) / (yMax - yMin)) * height;
    const sampleCount = 180;
    const curve = Array.from({ length: sampleCount + 1 }, (_, index) => {
      const x = xMin + ((xMax - xMin) * index) / sampleCount;
      return `${index === 0 ? "M" : "L"}${mapX(x).toFixed(2)},${mapY(Math.sin(x)).toFixed(2)}`;
    }).join(" ");
    const yZero = mapY(0);
    const xTicks = [0, Math.PI / 2, Math.PI, Math.PI * 1.5, Math.PI * 2, Math.PI * 2.5, Math.PI * 3, Math.PI * 3.5, Math.PI * 4];
    const xLabels = ["0", "π/2", "π", "3π/2", "2π", "5π/2", "3π", "7π/2", "4π"];
    const tickMarkup = xTicks.map((value, index) => {
      const x = mapX(value);
      return `<line class="diagram-grid" x1="${x}" y1="${top}" x2="${x}" y2="${top + height}"/><text class="diagram-label diagram-tick-label" x="${x}" y="${yZero + 24}" text-anchor="middle">${xLabels[index]}</text>`;
    }).join("");
    const yMarkup = [-1, 0, 1].map(value => {
      const y = mapY(value);
      return `<line class="diagram-grid" x1="${left}" y1="${y}" x2="${left + width}" y2="${y}"/><text class="diagram-label" x="${left - 14}" y="${y + 5}" text-anchor="end">${value}</text>`;
    }).join("");
    return `<svg class="diagram-svg" viewBox="0 0 720 440" role="img" aria-label="Đồ thị hàm số y bằng sin x">
      <defs><marker id="sine-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker></defs>
      <text class="diagram-title" x="40" y="32">Do thi ham so y = sin(x)</text>
      ${tickMarkup}${yMarkup}
      <line class="diagram-axis" x1="${left}" y1="${top - 8}" x2="${left}" y2="${top + height + 12}" marker-end="url(#sine-arrow)"/>
      <line class="diagram-axis" x1="${left - 8}" y1="${yZero}" x2="${left + width + 12}" y2="${yZero}" marker-end="url(#sine-arrow)"/>
      <path class="sine-curve" d="${curve}"/>
      <text class="diagram-label" x="${left + width + 18}" y="${yZero + 5}">x</text>
      <text class="diagram-label" x="${left - 8}" y="${top - 18}">y</text>
      <text class="diagram-note" x="40" y="414">Duong cong duoc tinh tu nhieu diem mau cua ham sin(x)</text>
    </svg>`;

  function renderKnownIllustrationFallback(isHarmonicMotion, isSineGraph) {
    if (isHarmonicMotion) return renderHarmonicMotionDiagram();
    if (isSineGraph) return renderSineGraph();
    return "";
  }

  async function renderPythonDiagram(rawCode, requiresAnimation = false, allowGenericAnimation = true) {
    const pythonCode = extractPythonCode(rawCode);
    if (!pythonCode || !/\bresult\s*=/.test(pythonCode)) return "";
    const token = `python-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    const frameId = `diagram-${token}`;
    const srcdoc = `<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net blob:; style-src 'unsafe-inline'; img-src data:; font-src data:; worker-src blob:;"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}svg,canvas{display:block;width:100%;height:100%;max-width:720px;margin:auto}*{box-sizing:border-box}</style></head><body><div id="status">Python đang dựng hình...</div><script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"><\/script><script>
      const token = ${JSON.stringify(token)};
      const pythonCode = ${JSON.stringify(pythonCode)};
      const send = (ok, output) => parent.postMessage({ type: "python-diagram", token, ok, output }, "*");
      (async () => {
        try {
          const pyodide = await loadPyodide({ indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.2/full/" });
          const output = await pyodide.runPythonAsync(pythonCode + "\\nresult");
          const outputText = output?.toJs ? output.toJs({ dict_converter: Object.fromEntries }) : String(output || "");
          output?.destroy?.();
          send(true, String(outputText || ""));
        } catch (error) {
          send(false, String(error));
        }
      })();
    <\/script></body></html>`;
    return await new Promise(resolve => {
      const frame = document.createElement("iframe");
      frame.id = frameId;
      frame.className = "illustration-code-frame";
      frame.setAttribute("sandbox", "allow-scripts");
      frame.setAttribute("referrerpolicy", "no-referrer");
      frame.title = "Hình minh họa Python do AI dựng";
      const timer = window.setTimeout(() => { cleanup(); resolve(""); }, 30000);
      const cleanup = () => { window.clearTimeout(timer); window.removeEventListener("message", onMessage); frame.remove(); };
      const onMessage = event => {
        if (event.source !== frame.contentWindow || event.data?.type !== "python-diagram" || event.data.token !== token) return;
        const output = event.data.ok ? event.data.output : "";
        cleanup();
        const hasSvg = output && /<svg[\s\S]*<\/svg>/i.test(output);
        if (!hasSvg) {
          resolve("");
          return;
        }
        const animatedSvg = ensureAnimatedSvg(output, requiresAnimation, allowGenericAnimation);
        resolve(animatedSvg ? renderDiagramCode(animatedSvg) : "");
      };
      window.addEventListener("message", onMessage);
      frame.srcdoc = srcdoc;
      document.body.appendChild(frame);
    });
  }

  function extractPythonCode(rawCode) {
    if (typeof rawCode !== "string") return "";
    const fencedMatch = rawCode.match(/```(?:python|py)?\s*([\s\S]*?)```/i);
    const code = (fencedMatch ? fencedMatch[1] : rawCode)
      .replace(/^\s*python\s*:\s*/i, "")
      .trim();
    if (!code || /(^|\n)\s*<(!doctype|html|svg)\b/i.test(code)) return "";
    return code;
  }

  function ensureAnimatedSvg(rawSvg, requiresAnimation, allowGenericAnimation) {
    const svgMatch = String(rawSvg || "").match(/<svg\b[\s\S]*?<\/svg>/i);
    if (!svgMatch) return "";
    if (!requiresAnimation || /<(?:animate|animateMotion|animateTransform)\b/i.test(svgMatch[0])) return svgMatch[0];
    if (!allowGenericAnimation) return "";
    const viewBoxMatch = svgMatch[0].match(/\bviewBox\s*=\s*["']\s*[-\d.]+\s+[-\d.]+\s+([-\d.]+)\s+([-\d.]+)\s*["']/i);
    const width = Number(viewBoxMatch?.[1]) || 720;
    const height = Number(viewBoxMatch?.[2]) || 440;
    const startX = Math.max(24, width * 0.14);
    const endX = Math.max(startX + 40, width * 0.86);
    const centerY = height * 0.5;
    const marker = `<circle cx="${startX}" cy="${centerY}" r="7" fill="#f97316" aria-label="Điểm đang chuyển động"><animateMotion dur="3s" repeatCount="indefinite" path="M 0,0 L ${endX - startX},0 L 0,0"/></circle>`;
    return svgMatch[0].replace(/<\/svg>\s*$/i, `${marker}</svg>`);
  }

  function renderDiagramCode(rawCode) {
    if (!rawCode) return "";
    const code = rawCode.replace(/^```(?:html|svg|javascript|js)?\s*/i, "").replace(/\s*```$/i, "").trim();
    if (!/<(svg|canvas|html|div|main|body)\b/i.test(code)) return "";
    const srcdoc = `<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}svg,canvas{display:block;width:100%;height:100%;max-width:720px;margin:auto}*{box-sizing:border-box}</style></head><body>${code}</body></html>`;
    return `<iframe class="illustration-code-frame" sandbox="allow-scripts" referrerpolicy="no-referrer" title="Hình minh họa do AI dựng" srcdoc="${escapeAttribute(srcdoc)}"></iframe>`;
  }

  function escapeAttribute(value) {
    return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function parseDiagramSpec(rawText) {
    if (!rawText) return null;
    const jsonText = rawText.replace(/^```(?:json)?\s*/i, "").replace(/\s*```$/i, "").trim();
    try {
      const parsed = JSON.parse(jsonText);
      if (!parsed || typeof parsed !== "object") return null;
      return {
        title: typeof parsed.title === "string" ? parsed.title.slice(0, 100) : "Hình minh họa",
        points: Array.isArray(parsed.points) ? parsed.points : [],
        segments: Array.isArray(parsed.segments) ? parsed.segments : [],
        circles: Array.isArray(parsed.circles) ? parsed.circles : [],
        arrows: Array.isArray(parsed.arrows) ? parsed.arrows : [],
        labels: Array.isArray(parsed.labels) ? parsed.labels : [],
        axes: parsed.axes && typeof parsed.axes === "object" ? parsed.axes : {},
        animation: parsed.animation && typeof parsed.animation === "object" ? parsed.animation : { type: "none" },
        note: typeof parsed.note === "string" ? parsed.note.slice(0, 180) : ""
      };
    } catch (error) {
      console.warn("Không đọc được cấu trúc hình minh họa:", error);
      return null;
    }
  }

  function renderDiagramSpec(spec) {
    if (!spec) return "";
    const escapeXml = value => String(value ?? "").replace(/[<>&'"]/g, character => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;", "'": "&apos;", '"': "&quot;" }[character]));
    const pointMap = new Map(spec.points.filter(point => point && typeof point.id === "string").map(point => [point.id, point]));
    const coordinate = point => Number.isFinite(Number(point?.x)) && Number.isFinite(Number(point?.y))
      ? { x: Math.max(24, Math.min(696, Number(point.x))), y: Math.max(34, Math.min(400, Number(point.y))) }
      : null;
    const line = (from, to, className = "diagram-line", marker = "") => {
      const start = coordinate(pointMap.get(from));
      const end = coordinate(pointMap.get(to));
      if (!start || !end) return "";
      return `<line class="${className}" x1="${start.x}" y1="${start.y}" x2="${end.x}" y2="${end.y}"${marker ? ` marker-end="url(#${marker})"` : ""}/>`;
    };
    const pointMarkup = spec.points.map(point => {
      const position = coordinate(point);
      if (!position) return "";
      const isAnimated = spec.animation.type === "pulse-point" && spec.animation.point === point.id;
      const pulse = isAnimated ? `<animate attributeName="r" values="4;7;4" dur="${Math.max(700, Math.min(4000, Number(spec.animation.duration) || 1600))}ms" repeatCount="indefinite"/>` : "";
      return `<circle class="diagram-point${isAnimated ? " diagram-animated" : ""}" cx="${position.x}" cy="${position.y}" r="4">${pulse}</circle><text class="diagram-label" x="${position.x + 8}" y="${position.y - 8}">${escapeXml(point.id)}</text>`;
    }).join("");
    const segments = spec.segments.map(segment => `${line(segment.from, segment.to)}${segment.label ? `<text class="diagram-label" x="${coordinate(pointMap.get(segment.from))?.x || 0}" y="${(coordinate(pointMap.get(segment.from))?.y || 0) - 10}">${escapeXml(segment.label)}</text>` : ""}`).join("");
    const arrows = spec.arrows.map(arrow => line(arrow.from, arrow.to, "diagram-line diagram-arrow", "arrowhead")).join("");
    const circles = spec.circles.map(circle => {
      const cx = Math.max(30, Math.min(690, Number(circle.cx)));
      const cy = Math.max(40, Math.min(390, Number(circle.cy)));
      const radius = Math.max(8, Math.min(180, Number(circle.r)));
      if (![cx, cy, radius].every(Number.isFinite)) return "";
      return `<circle class="diagram-circle" cx="${cx}" cy="${cy}" r="${radius}"/>${circle.label ? `<text class="diagram-label" x="${cx + 8}" y="${cy - radius - 8}">${escapeXml(circle.label)}</text>` : ""}`;
    }).join("");
    const labels = spec.labels.map(label => {
      const position = coordinate(label);
      return position && label.text ? `<text class="diagram-label" x="${position.x}" y="${position.y}">${escapeXml(label.text)}</text>` : "";
    }).join("");
    const axes = spec.axes.x || spec.axes.y
      ? `<line class="diagram-axis" x1="60" y1="360" x2="660" y2="360"${spec.axes.x ? " marker-end=\"url(#arrowhead)\"" : ""}/><line class="diagram-axis" x1="60" y1="360" x2="60" y2="60"${spec.axes.y ? " marker-end=\"url(#arrowhead)\"" : ""}/>`
      : "";
    const animation = spec.animation || { type: "none" };
    const fromPoint = coordinate(pointMap.get(animation.from));
    const toPoint = coordinate(pointMap.get(animation.to));
    const movingPoint = coordinate(pointMap.get(animation.point));
    const moveAnimation = animation.type === "move-point" && fromPoint && toPoint && movingPoint
      ? `<circle class="diagram-point diagram-animated" cx="${movingPoint.x}" cy="${movingPoint.y}" r="6"><animateMotion dur="${Math.max(700, Math.min(5000, Number(animation.duration) || 1800))}ms" repeatCount="indefinite" path="M ${fromPoint.x - movingPoint.x} ${fromPoint.y - movingPoint.y} L ${toPoint.x - movingPoint.x} ${toPoint.y - movingPoint.y}"/></circle>`
      : "";
    return `<svg class="diagram-svg" viewBox="0 0 720 440" role="img" aria-label="${escapeXml(spec.title)}"><defs><marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker></defs><text class="diagram-title" x="40" y="30">${escapeXml(spec.title)}</text>${axes}${circles}${segments}${arrows}${pointMarkup}${moveAnimation}${labels}${spec.note ? `<text class="diagram-note" x="40" y="420">${escapeXml(spec.note)}</text>` : ""}</svg>`;
  }

  function sanitizeIllustration(rawSvg) {
    const match = rawSvg.match(/<svg[\s\S]*?<\/svg>/i);
    if (!match) return "";
    const parsed = new DOMParser().parseFromString(match[0], "image/svg+xml");
    const svg = parsed.documentElement;
    if (!svg || svg.nodeName.toLowerCase() !== "svg" || parsed.querySelector("parsererror")) return "";
    svg.querySelectorAll("script, foreignObject, iframe, object, image, animate, set").forEach(node => node.remove());
    svg.querySelectorAll("*").forEach(node => [...node.attributes].forEach(attribute => {
      if (/^on/i.test(attribute.name) || /javascript:/i.test(attribute.value)) node.removeAttribute(attribute.name);
    }));
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Hình minh họa mô phỏng");
    return svg.outerHTML;
  }

  async function callGeminiIllustration(prompt) {
    const modelCandidates = GEMINI_STUDY_MODELS;
    let attempts = 0;
    while (attempts < GEMINI_KEYS.length) {
      attempts += 1;
      const apiKey = getNextGeminiKey();
      if (!apiKey) continue;
      for (const candidateModel of modelCandidates) try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${candidateModel}:generateContent?key=${apiKey}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: prompt }] },
            contents: [{ role: "user", parts: [{ text: "Người học đã yêu cầu vẽ. Hãy trả về đúng một khối <manim_code> chứa mã Manim Community hợp lệ với class DynamicScene." }] }],
            generationConfig: { temperature: 0.15, maxOutputTokens: 5000, thinkingConfig: { thinkingBudget: 0 } }
          })
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) {
          const status = response.status || 0;
          const message = data.error?.message || data.error?.status || `HTTP ${status}`;
          console.warn("Gemini không tạo được mã Manim:", message);
          if (status === 429 || status >= 500) await sleep(400);
          continue;
        }
        const result = (data.candidates?.[0]?.content?.parts || [])
          .map(part => typeof part.text === "string" ? part.text : "").join("").trim();
        if (!result) throw new Error("Gemini trả về phản hồi rỗng.");
        return result;
      } catch (error) {
        console.error("Lỗi dựng hình minh họa:", error);
      }
    }
    return "";
  }

  function toggleSpeechOutput(button) {
    speechOutputEnabled = !speechOutputEnabled;
    speechOutputToken += 1;
    if (!speechOutputEnabled && "speechSynthesis" in window) window.speechSynthesis.cancel();
    document.querySelectorAll(".speech-toggle-btn").forEach(item => {
      item.textContent = speechOutputEnabled ? "🔊 Đang đọc" : "🔇 Chỉ chữ";
      item.setAttribute("aria-label", speechOutputEnabled ? "Tắt đọc câu trả lời" : "Bật đọc câu trả lời");

  function toggleVoiceMode() {
    if (activeSpace !== "english") {
      document.getElementById("voiceStatus").textContent = "Hãy bật Mode English trước để dùng micro luyện nói.";
      return;
    }
    if (!("webkitSpeechRecognition" in window || "SpeechRecognition" in window)) {
      document.getElementById("voiceStatus").textContent = "Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge.";
      return;
    }

    voiceModeEnabled = !voiceModeEnabled;
    const button = document.getElementById("voiceModeBtn");
    button.classList.toggle("active", voiceModeEnabled);
    button.setAttribute("aria-label", voiceModeEnabled ? "Tắt micro" : "Bật micro");
    document.getElementById("voiceStatus").textContent = voiceModeEnabled
      ? "Đang xin quyền microphone..."
      : "Nhắn tin hoặc bật voice mode để luyện nói.";

    if (voiceModeEnabled) {
      if (voiceRestartTimer) clearTimeout(voiceRestartTimer);
      requestMicrophoneAndListen();
    } else {
      if (speechRecognition) {
        try { speechRecognition.stop(); } catch (error) {}
      }
      if (voiceRestartTimer) clearTimeout(voiceRestartTimer);
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      speechRecognition = null;
    }
  }

  async function requestMicrophoneAndListen() {
    if (microphonePermissionStatus === "denied") {
      document.getElementById("voiceStatus").textContent = "Micro đang bị từ chối. Hãy bật lại quyền microphone trong cài đặt trình duyệt.";
      voiceModeEnabled = false;
      document.getElementById("voiceModeBtn").classList.remove("active");
      return;
    }
    startVoiceInput();
  }

  function startVoiceInput() {
    if (!voiceModeEnabled) return;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      document.getElementById("voiceStatus").textContent = "Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge.";
      return;
    }

    if (speechRecognition) {
      try { speechRecognition.stop(); } catch (error) {}
    }

    speechRecognition = new Recognition();
    speechRecognition.lang = "en-US";
    speechRecognition.interimResults = false;
    // Một lần bấm chỉ nhận một lượt nói; quyền đã cấp vẫn được trình duyệt giữ.
    speechRecognition.continuous = false;
    speechRecognition.maxAlternatives = 3;
    speechRecognition.onstart = () => {
      microphonePermissionStatus = "granted";
      localStorage.setItem("english-microphone-permission", microphonePermissionStatus);
      document.getElementById("voiceStatus").textContent = "Đang nghe... Hãy nói bằng tiếng Anh.";
    };
    speechRecognition.onresult = event => {
      const transcript = Array.from(event.results)
        .slice(event.resultIndex)
        .map(result => result[0]?.transcript || "")
        .join(" ")
        .trim();
      if (transcript) {
        voiceModeEnabled = false;
        document.getElementById("voiceModeBtn").classList.remove("active");
        try { speechRecognition.stop(); } catch (error) {}
        document.getElementById("userInput").value = transcript;
        sendMessage();
      }
    };
    speechRecognition.onerror = event => {
      speechRecognition.__hasError = true;
      if (["not-allowed", "service-not-allowed"].includes(event.error)) {
        microphonePermissionStatus = "denied";
        localStorage.setItem("english-microphone-permission", microphonePermissionStatus);
      }
      const errorMessages = {
        "not-allowed": "Micro bị từ chối. Ứng dụng sẽ không hỏi lại; hãy bật quyền trong cài đặt trình duyệt nếu muốn dùng.",
        "service-not-allowed": "Dịch vụ nhận giọng nói bị chặn. Ứng dụng sẽ không hỏi lại; hãy kiểm tra quyền trong trình duyệt.",
        "audio-capture": "Không tìm thấy microphone. Hãy kiểm tra tai nghe hoặc thiết bị âm thanh.",
        "network": "Nhận giọng nói cần kết nối mạng ổn định.",
        "no-speech": "Mình chưa nghe thấy tiếng nói. Hãy bấm micro và nói rõ bằng tiếng Anh."
      };
      document.getElementById("voiceStatus").textContent = errorMessages[event.error] || "Micro chưa hoạt động. Hãy thử lại nhé.";
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(event.error)) {
        voiceModeEnabled = false;
        document.getElementById("voiceModeBtn").classList.remove("active");
      }
    };
    speechRecognition.onend = () => {
      if (voiceModeEnabled && !speechRecognition?.__hasError) {
        document.getElementById("voiceStatus").textContent = "Micro đã dừng. Bấm mic để nói tiếp.";
      }
      speechRecognition = null;
    };
    try {
      speechRecognition.__hasError = false;
      speechRecognition.start();
    } catch (error) {
      document.getElementById("voiceStatus").textContent = "Micro đang bận. Hãy chờ một chút rồi thử lại.";
      voiceModeEnabled = false;
      document.getElementById("voiceModeBtn").classList.remove("active");
    }
  }

  function speakEnglishReply(text) {
    if (!("speechSynthesis" in window)) return;
    if (!speechOutputEnabled || activeSpace !== "english") return;
    window.speechSynthesis.cancel();
    const currentSpeechToken = ++speechOutputToken;
    const spokenText = text
      .replace(/```[\s\S]*?```/g, "")
      .replace(/[*_#`$]/g, "")
      .replace(/\[(.*?)\]\(.*?\)/g, "$1")
      .replace(/\n+/g, ". ")
      .replace(/\s{2,}/g, " ")
      .trim();
    if (!spokenText) return;

    const chunks = spokenText.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [spokenText];
    chunks.reduce((promise, chunk) => promise.then(() => queueSpeechChunk(chunk.trim(), currentSpeechToken)), Promise.resolve());
  }

  function loadEnglishVoices() {
    if (!("speechSynthesis" in window)) return;
    const updateVoices = () => {
      availableEnglishVoices = window.speechSynthesis.getVoices()
        .filter(voice => /^en(-|_)/i.test(voice.lang))
        .sort((first, second) => {
          const firstPreferred = /Google|Microsoft|Samantha|Daniel/i.test(first.name);
          const secondPreferred = /Google|Microsoft|Samantha|Daniel/i.test(second.name);
          return Number(secondPreferred) - Number(firstPreferred);
        });
    };
    updateVoices();
    window.speechSynthesis.addEventListener("voiceschanged", updateVoices);
  }

  function queueSpeechChunk(text, currentSpeechToken) {
    return new Promise(resolve => {
      if (!text || activeSpace !== "english" || !speechOutputEnabled || currentSpeechToken !== speechOutputToken) {
        resolve();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      const femaleVoice = availableEnglishVoices.find(voice => /female|samantha|zira|aria|jenny|eva|susan|karen|moira|google us english/i.test(voice.name))
        || availableEnglishVoices.find(voice => /en-US/i.test(voice.lang) && /google|microsoft/i.test(voice.name));
      const selectedVoice = femaleVoice
        || availableEnglishVoices.find(voice => /en-US/i.test(voice.lang))
        || availableEnglishVoices[0];
      if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
      } else {
        utterance.lang = "en-US";
      }
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      utterance.onend = resolve;
      utterance.onerror = resolve;
      window.speechSynthesis.speak(utterance);
    });
  }

  async function handleFeedback(btnElement, type) {
    const parentContainer = btnElement.parentElement;
    const responseGroup = parentContainer.closest(".response-group");
    const responseElement = responseGroup ? responseGroup.querySelector(".msg.bot") : null;
    if (type === 'understand') {
      const detailLevel = document.getElementById("detailMode").value;
      learningPreferences.detail = detailLevel === "detailed"
        ? "Hãy tiếp tục ưu tiên cách giải từng bước, giải thích bản chất và lý do của mỗi bước."
        : "Hãy ưu tiên cách giải ngắn gọn, rõ ý và đi thẳng vào trọng tâm.";
      localStorage.setItem("ai-learning-preferences", JSON.stringify(learningPreferences));
      saveLearnerProfile("understood", learningPreferences.detail);
      parentContainer.innerHTML = `<span class="feedback-status understood">Đã ghi nhận cách giải này cho các câu hỏi sau.</span>`;
    } else if (type === 'confused') {
      if (!responseElement || !responseGroup) return;
      saveLearnerProfile("confused", "Người học chưa nắm được cách giải ở lượt gần nhất.");
      const lastModelIndex = chatHistory.map(item => item.role).lastIndexOf("model");
      if (lastModelIndex >= 0) chatHistory.splice(lastModelIndex, 1);
      responseElement.innerHTML = `<span class="typing-dots" aria-label="AI đang viết lại"><span></span><span></span><span></span></span><span class="typing-label">AI đang viết lại...</span>`;
      const retryPrompt = buildActivePrompt() + `
    [PHẢN HỒI ÂM THẦM]: Câu trả lời vừa rồi chưa giúp người dùng hiểu. Hãy viết lại từ đầu bằng một cách giải thích khác hẳn, không lặp lại cấu trúc và câu chữ cũ. Bắt buộc dùng ít nhất một ví dụ thực tế, phép so sánh trực quan hoặc phản ví dụ phù hợp; sau đó kiểm tra lại bằng một câu hỏi ngắn để biết người học đã nắm ý chưa. Không nhắc đến phản hồi nội bộ này.`;
      const thinkingLevel = document.getElementById("thinkingMode").value;
      const modelName = thinkingLevel === "talking" ? GEMINI_TALKING_MODEL : GEMINI_STUDY_MODEL;
      const currentMode = document.getElementById("aiMode").value;
      const temperature = learningMode === "arena"
        ? 0.3
        : currentMode === "talkshow"
          ? 0.65
          : currentMode === "english"
            ? 0.45
            : thinkingLevel === "talking" ? 0.25 : 0.2;
      const engineName = learningMode === "arena" ? "Gemini Flash · HSG" : "Gemini 3.6 Flash";
      const success = await callGeminiApi(responseElement.id, retryPrompt, modelName, engineName, temperature);
      if (!success) responseElement.innerHTML = "⚠️ Chưa thể viết lại lúc này. Cậu thử bấm gửi lại câu hỏi sau nhé!";
    }
  }

  function loadImageFile(file) {
    if (!file?.type?.startsWith("image/")) return false;
    selectedImageMimeType = file.type;
    const reader = new FileReader();
    reader.onload = function(evt) {
      selectedImageBase64 = evt.target.result.split(",")[1];
      document.getElementById("imagePreview").src = evt.target.result;
      document.getElementById("imageName").innerText = file.name || "Ảnh đã dán";
      document.getElementById("imagePreviewContainer").style.display = "flex";
    };
    reader.readAsDataURL(file);
    return true;
  }

  function handleImageSelect(e) {
    loadImageFile(e.target.files[0]);
  }

  function removeSelectedImage() {
    selectedImageBase64 = null;
    selectedImageMimeType = null;
    document.getElementById("imageInput").value = "";
    document.getElementById("imagePreviewContainer").style.display = "none";
  }

  function clearChat() {
    if (confirm("Xóa toàn bộ lịch sử trò chuyện?")) {
      chatHistory = [];
      saveActiveChatHistory();
      const welcomeText = activeSpace === "english"
        ? "Your English practice history is clear. Ready for a new conversation? 😊"
        : "Lịch sử trò chuyện đã được làm sạch! 😊";
      document.getElementById("msgContainer").innerHTML = `<div class="msg bot" id="welcomeMsg">${welcomeText}</div>`;
    }
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
