  function toggleArenaMode() {
    setLearningMode(learningMode === "arena" ? "normal" : "arena");
    if (learningMode === "arena") saveLearnerProfile("arena", "Người học bật chế độ luyện thi HSG.");
  }

  function setSendBusy(busy) {
    const btn = document.getElementById("sendBtn");
    if (!btn) return;
    btn.classList.toggle("busy", busy);
    btn.setAttribute("aria-busy", busy ? "true" : "false");
  }

  function nudgeComposer() {
    const row = document.getElementById("inputRow");
    if (!row) return;
    row.classList.remove("nudge");
    void row.offsetWidth;
    row.classList.add("nudge");
    window.setTimeout(() => row.classList.remove("nudge"), 420);
  }

  // Enter trên điện thoại / bộ gõ tiếng Việt: chỉ gửi khi đã hoàn tất tổ hợp phím
  function handleComposerKey(event) {
    if (event.key !== "Enter") return;
    if (event.isComposing || event.keyCode === 229) return;
    event.preventDefault();
    sendMessage();
  }

  async function sendMessage(overrideText = null) {
    const inputField = document.getElementById("userInput");
    const msgContainer = document.getElementById("msgContainer");
    const chatBox = document.getElementById("chatBox");
    
    if (isSendingMessage) { nudgeComposer(); return; }

    const text = overrideText ? overrideText : inputField.value.trim();
    if (!text && !selectedImageBase64) { nudgeComposer(); inputField.focus(); return; }
    isSendingMessage = true;
    setSendBusy(true);

    const userParts = [];
    let userMsgHtml = "";

    if (selectedImageBase64) {
      userParts.push({ inline_data: { mime_type: selectedImageMimeType, data: selectedImageBase64 } });
      userMsgHtml += `<img src="data:${selectedImageMimeType};base64,${selectedImageBase64}">`;
    }

    const textPrompt = text || "Giải bài tập trong ảnh giúp tớ nhé!";
    userParts.push({ text: textPrompt });
    userMsgHtml += `<div>${escapeHtml(textPrompt)}</div>`;

    msgContainer.innerHTML += `<div class="msg user">${userMsgHtml}</div>`;
    const hasImage = selectedImageBase64 !== null;
    inputField.value = "";
    removeSelectedImage();
    chatBox.scrollTop = chatBox.scrollHeight;

    chatHistory.push({ role: "user", parts: userParts });
    saveLearnerProfile("question", textPrompt);

    const mode = document.getElementById("aiMode").value;
    const thinkingLevel = document.getElementById("thinkingMode").value;
    const activePrompt = buildActivePrompt();

    const selectedGeminiModel = thinkingLevel === "talking"
      ? GEMINI_TALKING_MODEL
      : GEMINI_STUDY_MODEL;
    const selectedTemperature = learningMode === "arena"
      ? 0.3
      : mode === "talkshow"
      ? 0.65
      : mode === "english"
        ? 0.45
        : thinkingLevel === "talking" ? 0.25 : 0.2;
    const loadingId = "loading-" + Date.now();

    const engineLabel = "Gemini 3.6 Flash";
    msgContainer.innerHTML += `<div class="msg bot typing-message" id="${loadingId}"><span class="typing-dots" aria-label="AI đang soạn trả lời"><span></span><span></span><span></span></span><span class="typing-label">AI đang suy nghĩ...</span></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    try {
      const engineName = learningMode === "arena"
        ? "Gemini Flash · HSG"
        : hasImage ? "Gemini Flash (ảnh)" : engineLabel;
      const replySuccess = await callGeminiApi(loadingId, activePrompt, selectedGeminiModel, engineName, selectedTemperature);

      if (!replySuccess) {
        document.getElementById(loadingId).innerHTML = "⚠️ Gemini đang bận hoặc các API key đều không khả dụng. Cậu thử lại sau vài giây nhé!";
        chatHistory.pop();
        saveActiveChatHistory();
      }
    } finally {
      isSendingMessage = false;
      setSendBusy(false);
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  // GỌI GEMINI API - TỰ CHUYỂN ĐỔI CHUẨN GEMINI FORMAT
  async function callGeminiApi(loadingId, activePrompt, modelName, engineLabel, temperature) {
    if (!GEMINI_KEYS || GEMINI_KEYS.length === 0) return false;

    const modelCandidates = modelName.includes("lite") ? GEMINI_TALKING_MODELS : GEMINI_STUDY_MODELS;
    let attempts = 0;
    while (attempts < GEMINI_KEYS.length) {
      attempts++;
      const apiKey = getNextGeminiKey();
      if (!apiKey) continue;

      for (const candidateModel of modelCandidates) try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${candidateModel}:generateContent?key=${apiKey}`;

        // TẠO MẢNG CONTENTS RIÊNG CHUẨN GEMINI
        const currentMode = document.getElementById("aiMode").value;
        const historyLimit = currentMode === "english" ? 8 : 10;
        const maxOutputTokens = currentMode === "english"
          ? 700
          : candidateModel.includes("lite") ? 1800 : 5000;

        const geminiContents = chatHistory.slice(-historyLimit).map(msg => {
          const role = (msg.role === "user") ? "user" : "model";
          let parts = [];

          if (Array.isArray(msg.parts)) {
            parts = msg.parts;
          } else if (typeof msg.content === "string") {
            parts = [{ text: msg.content }];
          } else {
            parts = [{ text: "" }];
          }

          const validParts = parts.filter(part =>
            (typeof part.text === "string" && part.text.trim())
            || (part.inline_data?.data && part.inline_data?.mime_type)
          );
          return validParts.length > 0 ? { role, parts: validParts } : null;
        }).filter(Boolean);

        // Gemini yêu cầu lượt hội thoại hợp lệ và không nhận hai lượt model liên tiếp.
        const normalizedContents = [];
        geminiContents.forEach(message => {
          const previous = normalizedContents[normalizedContents.length - 1];
          if (previous && previous.role === message.role) {
            previous.parts.push(...message.parts);
          } else {
            normalizedContents.push({ role: message.role, parts: [...message.parts] });
          }
        });
        if (normalizedContents[0]?.role !== "user") normalizedContents.shift();
        if (!normalizedContents.length) continue;

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: activePrompt }] },
            contents: normalizedContents,
            generationConfig: {
              temperature: temperature,
              maxOutputTokens,
              thinkingConfig: { thinkingBudget: 0 }
            }
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) {
          const status = response.status || 0;
          console.warn(`Gemini lỗi HTTP ${status}:`, data.error?.message || data.error?.status || "");
          // 429/5xx (gồm 503 "quá tải") là lỗi tạm thời: nghỉ ngắn rồi thử model/key khác.
          if (status === 429 || status >= 500) await sleep(400);
          continue;
        }

        const responseParts = data.candidates?.[0]?.content?.parts || [];
        const finishReason = data.candidates?.[0]?.finishReason || "";
        const botReply = responseParts
          .map(part => typeof part.text === "string" ? part.text : "")
          .join("")
          .trim();
        if (botReply) {
          const finishedText = finishReason === "MAX_TOKENS"
            ? `${botReply}\n\n> ⏳ Câu trả lời dài nên bị cắt ở đây. Cậu gõ **"tiếp"** để tớ viết nốt phần còn lại.`
            : botReply;
          renderBotResponse(loadingId, finishedText, engineLabel, "engine-gemini");
          return true;
        }
      } catch (err) {
        console.error(`Lỗi kết nối Gemini lượt ${attempts}:`, err);
      }
    }
    return false;
  }

  // HÀM RENDER ĐÃ ĐƯỢC FIX LỖI LATEX VÀ TRÌNH BÀY
  function renderBotResponse(elemId, replyText, engineName, badgeClass) {
    const botMsgElem = document.getElementById(elemId);
    if (learningMode === "arena") {
      const scoreMatch = replyText.match(/Điểm checkpoint:\s*(\d{1,2})\s*\/\s*10/i);
      if (scoreMatch) {
        arenaSession.scores.push(Math.min(10, Math.max(0, Number(scoreMatch[1]))));
        renderModeRibbon();
      }
    }
    const responseTarget = document.getElementById(`${elemId}-group`)
      || botMsgElem.closest(".response-group")
      || botMsgElem;
    
    const drawMarkerFound = /\[\[DRAW_DIAGRAM\]\]/i.test(replyText);
    const visibleReplyText = stripDiagramCode(replyText.replace(/\s*\[\[DRAW_DIAGRAM\]\]\s*/gi, "\n")).trim();

    // 1. CHUẨN HÓA LATEX VỀ DẠNG $ VÀ $$
    const cleanedText = fixLatexFormat(visibleReplyText);

    // 2. CHUYỂN DỔI MARKDOWN THÀNH HTML
    const renderedContent = renderAnimationInChat(marked.parse(cleanedText));

    // 3. THÊM NÚT FEEDBACK
    const speechButtonMarkup = activeSpace === "english"
      ? `<button class="speech-toggle-btn" onclick="toggleSpeechOutput(this)" aria-label="${speechOutputEnabled ? "Tắt đọc câu trả lời" : "Bật đọc câu trả lời"}">${speechOutputEnabled ? "🔊 Đang đọc" : "🔇 Chỉ chữ"}</button>`
      : "";
    const feedbackButtons = `
      <div class="feedback-actions">
        ${speechButtonMarkup}
        ${activeSpace !== "english" ? `<button class="illustration-btn" onclick="requestIllustration('${elemId}-group')" title="Chỉ tạo hình khi cậu cần hình dung">🖼 Vẽ hình minh họa</button>` : ""}
        <button class="feedback-btn understand" onclick="handleFeedback(this, 'understand')">👍 Đã hiểu</button>
        <button class="feedback-btn confused" onclick="handleFeedback(this, 'confused')">❓ Chưa hiểu lắm</button>
      </div>
    `;

    // GHÉP GIAO DIỆN
    responseTarget.outerHTML = `<div class="response-group" id="${elemId}-group"><div class="msg bot" id="${elemId}"><div class="bot-text">${renderedContent}</div></div><div class="response-meta"><span class="engine-badge ${badgeClass}">Engine: ${engineName}</span>${feedbackButtons}</div></div>`;
    const renderedGroup = document.getElementById(`${elemId}-group`);
    const sourceQuestion = [...chatHistory].reverse().find(message => message.role === "user")?.parts
      ?.find(part => typeof part.text === "string")?.text || "";
    renderedGroup.dataset.illustrationQuestion = sourceQuestion;
    renderedGroup.dataset.illustrationAnswer = visibleReplyText;

    // 4. KÍCH HOẠT MATHJAX VẼ CÔNG THỨC TOÁN
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([document.getElementById(elemId)]).catch(err => console.error("MathJax Error:", err));
    }

    chatHistory.push({ role: "model", parts: [{ text: visibleReplyText }] });
    saveActiveChatHistory();
    const speechControlButton = document.querySelector(`#${elemId}-group .speech-toggle-btn`);
    if (speechControlButton) speechControlButton.dataset.speechText = visibleReplyText;
    if (activeSpace === "english" && speechOutputEnabled) speakEnglishReply(visibleReplyText);
    if (drawMarkerFound || shouldDrawFromText(sourceQuestion)) {
      window.setTimeout(() => requestIllustration(`${elemId}-group`), 120);
    }
  }

  function renderAnimationInChat(rawMessageText) {
    const animationRegex = /<canvas-animation>([\s\S]*?)<\/canvas-animation>/gi;

    return String(rawMessageText || "").replace(animationRegex, (match, code) => {
      const cleanCode = code
        .replace(/```(?:javascript|js|html)?/gi, "")
        .replace(/```/g, "")
        .trim();
      if (!cleanCode) return "";

      const iframeContent = `<!doctype html><html><head><meta charset="utf-8"><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#0f172a}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="animCanvas"></canvas><script>
const canvas = document.getElementById("animCanvas");
const ctx = canvas.getContext("2d");
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.floor(window.innerWidth * dpr));
  canvas.height = Math.max(1, Math.floor(window.innerHeight * dpr));
  canvas.style.width = window.innerWidth + "px";
  canvas.style.height = window.innerHeight + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();
try {
${cleanCode}
} catch (error) {
  ctx.fillStyle = "#fca5a5";
  ctx.font = "14px system-ui, sans-serif";
  ctx.fillText("Animation error: " + error.message, 12, 24);
}
<\/script></body></html>`;

      return `<div class="animation-container"><iframe srcdoc="${escapeAttribute(iframeContent)}" title="Mô phỏng Canvas do AI tạo" sandbox="allow-scripts"></iframe></div>`;
    });
  }

  function stripDiagramCode(text) {
    return String(text || "")
      .replace(/<anim_code>[\s\S]*?<\/anim_code>/gi, "")
      .replace(/<manim_code>[\s\S]*?<\/manim_code>/gi, "")
      .replace(/```(?:python|py)\s*[\s\S]*?```/gi, "")
      .trim();
  }

  function shouldDrawFromText(text) {
    return /vẽ|hình\s+minh\s+họa|sơ\s+đồ|đồ\s+thị/i.test(text || "");
  }

  // ==================== ANIM ENGINE: animation phong cách Manim/3Blue1Brown chạy ngay trong trang ====================
  const ANIM_W = 720;
  const ANIM_H = 405;
  const ANIM_PAD = 48;
  const ANIM_COLORS = ["#5b8cff", "#ff5b6e", "#3ddc97", "#ffb020", "#c084fc", "#38bdf8"];
  const ANIM_MATH_FN = {
    sin: Math.sin, cos: Math.cos, tan: Math.tan, asin: Math.asin, acos: Math.acos, atan: Math.atan,
    atan2: Math.atan2, sinh: Math.sinh, cosh: Math.cosh, tanh: Math.tanh, sqrt: Math.sqrt, cbrt: Math.cbrt,
    abs: Math.abs, exp: Math.exp, ln: Math.log, log: Math.log10, log2: Math.log2, floor: Math.floor,
    ceil: Math.ceil, round: Math.round, sign: Math.sign, min: Math.min, max: Math.max, pow: Math.pow
  };

  // Trình biên dịch biểu thức toán an toàn (không dùng eval): chỉ nhận số, x/t, +-*/^ (), hàm và hằng cho phép.
  function compileMathExpr(expr, allowedVars) {
    const src = String(expr).replace(/\s+/g, "");
    const allowed = new Set(allowedVars);
    if (!src) throw new Error(`Bieu thuc "${expr}" rong`);
    let pos = 0;
    const fail = (msg) => { throw new Error(`Bieu thuc "${expr}" ${msg}`); };

    function parseAddSub() {
      let left = parseMulDiv();
      while (src[pos] === "+" || src[pos] === "-") {
        const op = src[pos++];
        const right = parseMulDiv();
        const first = left;
        left = op === "+" ? (v) => first(v) + right(v) : (v) => first(v) - right(v);
      }
      return left;
    }
    function parseMulDiv() {
      let left = parseUnary();
      for (;;) {
        const ch = src[pos] || "";
        if (ch === "*" || ch === "/") {
          pos += 1;
          const right = parseUnary();
          const first = left;
          left = ch === "*" ? (v) => first(v) * right(v) : (v) => first(v) / right(v);
        } else if (ch === "(" || /^[A-Za-z_]$/.test(ch)) {
          const right = parseUnary();
          const first = left;
          left = (v) => first(v) * right(v);
        } else break;
      }
      return left;
    }
    function parseUnary() {
      if (src[pos] === "-") { pos += 1; const inner = parseUnary(); return (v) => -inner(v); }
      if (src[pos] === "+") { pos += 1; return parseUnary(); }
      return parsePower();
    }
    function parsePower() {
      const base = parseAtom();
      if (src[pos] === "^") {
        pos += 1;
        const exponent = parseUnary();
        return (v) => Math.pow(base(v), exponent(v));
      }
      return base;
    }
    function parseAtom() {
      if (src[pos] === "(") {
        pos += 1;
        const inner = parseAddSub();
        if (src[pos] !== ")") fail("thieu dong ngoac");
        pos += 1;
        return inner;
      }
      const num = /^\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/.exec(src.slice(pos));
      if (num) { pos += num[0].length; const value = Number(num[0]); return () => value; }
      const name = /^[A-Za-z_][A-Za-z_0-9]*/.exec(src.slice(pos));
      if (name) {
        const key = name[0].toLowerCase();
        pos += name[0].length;
        if (key === "pi") return () => Math.PI;
        if (key === "tau") return () => Math.PI * 2;
        if (key === "e") return () => Math.E;
        if (allowed.has(key)) return (v) => v[key];
        const fn = ANIM_MATH_FN[key];
        if (fn) {
          if (src[pos] !== "(") fail(`can "(" sau ${key}`);
          pos += 1;
          const args = [parseAddSub()];
          while (src[pos] === ",") { pos += 1; args.push(parseAddSub()); }
          if (src[pos] !== ")") fail(`thieu ")" cho ${key}`);
          pos += 1;
          return (v) => fn(...args.map((arg) => arg(v)));
        }
        fail(`khong ho tro ky hieu "${name[0]}"`);
      }
      fail("khong doc duoc bieu thuc");
    }

    const tree = parseAddSub();
    if (pos < src.length) fail("con ky tu thua");
    return tree;
  }

  function animNum(value, fallback, min, max) {
    const num = Number(value);
    if (!Number.isFinite(num)) return fallback;
    return Math.min(max, Math.max(min, num));
  }
  function animPair(value) {
    if (!Array.isArray(value) || value.length < 2) return null;
    const a = Number(value[0]);
    const b = Number(value[1]);
    return Number.isFinite(a) && Number.isFinite(b) ? [a, b] : null;
  }
  function animColor(value, fallback) {
    return /^#[0-9a-fA-F]{6}$/.test(String(value || "")) ? String(value) : fallback;
  }
  function animAxisLabel(value, index, key) {
    const raw = String(value ?? "").trim();
    if (!raw) throw new Error(`Buoc ${index + 1}: "axes" bat buoc co "${key}" la ten dai luong that (x, y, t, F, v, E, Q...).`);
    const clean = raw.replace(/[^\x20-\x7E]/g, "").slice(0, 8).trim();
    if (!clean) throw new Error(`Buoc ${index + 1}: "${key}" khong duoc dung tieng Viet co dau; hay dung ky hieu vat ly (t, x, F, v, E).`);
    return clean;
  }

  function compileAnimFn(value, stepIndex, label) {
    const text = String(value ?? "");
    if (!text.trim()) throw new Error(`Buoc ${stepIndex + 1}: thieu "${label}".`);
    if (text.length > 120) throw new Error(`Buoc ${stepIndex + 1}: "${label}" qua dai.`);
    try {
      return compileMathExpr(text, ["x", "t"]);
    } catch (error) {
      throw new Error(`Buoc ${stepIndex + 1}: ${error.message}`);
    }
  }

  function normalizeAnimStep(step, index, ids) {
    if (!step || typeof step !== "object") throw new Error(`Buoc ${index + 1}: khong phai object hop le.`);
    const known = ["axes", "plot", "param", "tangent", "area", "segment", "arrow", "dot", "circle", "orbit", "polygon", "angle", "text", "move", "fade", "pulse", "trace", "wait"];
    if (!known.includes(step.do)) throw new Error(`Buoc ${index + 1}: khong ho tro "do":"${String(step.do).slice(0, 20)}".`);
    const copy = { ...step };
    copy.do = step.do;
    copy.id = typeof step.id === "string" ? step.id.slice(0, 16) : "";
    if (copy.id) ids.add(copy.id);
    copy.axes = typeof step.axes === "string" ? step.axes.slice(0, 16) : "";
    copy.color = animColor(step.color, ANIM_COLORS[index % ANIM_COLORS.length]);

    switch (step.do) {
      case "axes": {
        const x = animPair(step.x) || [-5, 5];
        const y = animPair(step.y) || [-3.2, 3.2];
        if (x[1] <= x[0] || y[1] <= y[0]) throw new Error(`Buoc ${index + 1}: "axes" can x=[min,max] va y=[min,max] voi max > min.`);
        copy.x = [Math.max(-1000, x[0]), Math.min(1000, x[1])];
        copy.y = [Math.max(-1000, y[0]), Math.min(1000, y[1])];
        copy.xlabel = animAxisLabel(step.xlabel, index, "xlabel");
        copy.ylabel = animAxisLabel(step.ylabel, index, "ylabel");
        copy.equal = step.equal === true;
        copy.t = animNum(step.t, 1.3, 0.3, 4);
        break;
      }
      case "plot":
        copy.fn = compileAnimFn(step.fn, index, "fn");
        copy.width = animNum(step.width, 3, 1, 8);
        copy.t = animNum(step.t, 1.8, 0.3, 4);
        break;
      case "param": {
        copy.fx = compileAnimFn(step.fx, index, "fx");
        copy.fy = compileAnimFn(step.fy, index, "fy");
        const span = animPair(step.tspan) || [0, 6.283];
        if (span[1] <= span[0]) throw new Error(`Buoc ${index + 1}: "tspan" can [min,max] voi max > min.`);
        copy.tspan = [Math.max(-100, span[0]), Math.min(100, span[1])];
        copy.width = animNum(step.width, 3, 1, 8);
        copy.t = animNum(step.t, 2, 0.3, 4);
        break;
      }
      case "tangent":
        copy.curve = String(step.curve ?? "").slice(0, 16);
        copy.at = animNum(step.at, 0, -1000, 1000);
        copy.t = animNum(step.t, 1.2, 0.3, 4);
        break;
      case "area": {
        copy.curve = String(step.curve ?? "").slice(0, 16);
        const from = animPair(step.from);
        if (!from || from[1] <= from[0]) throw new Error(`Buoc ${index + 1}: "area" can "from":[x0,x1] voi x1 > x0.`);
        copy.from = [Math.max(-1000, from[0]), Math.min(1000, from[1])];
        copy.t = animNum(step.t, 1.2, 0.3, 4);
        break;
      }
      case "segment":
      case "arrow": {
        const from = animPair(step.from);
        const to = animPair(step.to);
        if (!from || !to) throw new Error(`Buoc ${index + 1}: "${step.do}" can "from":[x,y] va "to":[x,y].`);
        copy.from = from;
        copy.to = to;
        copy.width = animNum(step.width, step.do === "arrow" ? 3.5 : 2.5, 1, 10);
        copy.t = animNum(step.t, 1, 0.3, 4);
        break;
      }
      case "dot": {
        const at = animPair(step.at);
        if (!at) throw new Error(`Buoc ${index + 1}: "dot" can "at":[x,y].`);
        copy.at = at;
        copy.r = animNum(step.r, 6, 2, 16);
        copy.t = animNum(step.t, 0.6, 0.2, 4);
        break;
      }
      case "circle": {
        const center = animPair(step.center);
        const radius = Number(step.radius);
        if (!center || !Number.isFinite(radius) || radius <= 0) throw new Error(`Buoc ${index + 1}: "circle" can "center":[x,y] va "radius">0.`);
        copy.center = center;
        copy.radius = Math.min(radius, 2000);
        copy.t = animNum(step.t, 1.2, 0.3, 4);
        break;
      }
      case "orbit": {
        if (!copy.id) throw new Error(`Buoc ${index + 1}: "orbit" can "id" cua diem da tao bang buoc "dot".`);
        const center = animPair(step.center) || [0, 0];
        const radius = Number(step.radius);
        copy.center = center;
        copy.radius = Number.isFinite(radius) && radius > 0 ? Math.min(radius, 2000) : null;
        copy.omega = animNum(step.omega, 1, -12, 12);
        copy.phase = step.phase === undefined ? null : animNum(step.phase, 0, -100, 100);
        copy.radiusLine = step.radiusLine !== false;
        copy.dropLine = step.dropLine !== false;
        copy.t = animNum(step.t, 6.3, 1, 9);
        break;
      }
      case "polygon": {
        const points = Array.isArray(step.points) ? step.points.map(animPair).filter(Boolean).slice(0, 12) : [];
        if (points.length < 3) throw new Error(`Buoc ${index + 1}: "polygon" can it nhat 3 diem trong "points".`);
        copy.points = points;
        copy.t = animNum(step.t, 1.2, 0.3, 4);
        break;
      }
      case "angle": {
        const vertex = animPair(step.vertex);
        const a = animPair(step.a);
        const b = animPair(step.b);
        if (!vertex || !a || !b) throw new Error(`Buoc ${index + 1}: "angle" can "vertex", "a", "b" la [x,y].`);
        copy.vertex = vertex;
        copy.a = a;
        copy.b = b;
        copy.t = animNum(step.t, 0.8, 0.3, 4);
        break;
      }
      case "text": {
        copy.latex = String(step.latex ?? step.text ?? "").slice(0, 120).trim();
        if (!copy.latex) throw new Error(`Buoc ${index + 1}: "text" can "latex".`);
        if (/[\u00C0-\u024F\u1E00-\u1EFF]/.test(copy.latex)) throw new Error(`Buoc ${index + 1}: nhan "latex" khong duoc co tieng Viet co dau; dung cong thuc LaTeX hoac ky hieu khong dau.`);
        const at = animPair(step.at);
        copy.at = at;
        copy.anchor = at ? "" : (["top", "bottom", "left", "right"].includes(step.anchor) ? step.anchor : "top");
        copy.t = animNum(step.t, 0.9, 0.3, 4);
        break;
      }
      case "move": {
        if (!copy.id) throw new Error(`Buoc ${index + 1}: "move" can "id" cua diem.`);
        copy.along = typeof step.along === "string" ? step.along.slice(0, 16) : "";
        if (copy.along) {
          copy.fromFrac = animNum(step.from, 0, 0, 1);
          copy.toFrac = animNum(step.to, 1, 0, 1);
        } else {
          const to = animPair(step.to);
          if (!to) throw new Error(`Buoc ${index + 1}: "move" can "along":"<id duong cong>" hoac "to":[x,y].`);
          copy.toPoint = to;
        }
        copy.t = animNum(step.t, 2.5, 0.3, 6);
        break;
      }
      case "fade":
        if (!copy.id) throw new Error(`Buoc ${index + 1}: "fade" can "id".`);
        copy.t = animNum(step.t, 0.8, 0.3, 4);
        break;
      case "pulse":
        if (!copy.id) throw new Error(`Buoc ${index + 1}: "pulse" can "id".`);
        copy.t = animNum(step.t, 1, 0.3, 4);
        break;
      case "trace":
        if (!copy.id) throw new Error(`Buoc ${index + 1}: "trace" can "id" cua diem.`);
        copy.on = step.on !== false;
        copy.t = 0.05;
        break;
      default:
        copy.t = animNum(step.t, 1, 0.2, 4);
    }
    return copy;
  }

  const ANIM_FREE_NUMBERS = new Set([0, 1, 2, 3, 0.5, 1.5, 3.1416, 1.571, 0.785, 6.283, 6.28]);
  const ANIM_SEMANTIC_FIELDS = ["fn", "fx", "fy", "radius", "at", "center", "from", "to", "points", "vertex", "a", "b", "omega", "phase"];

  function animCollectNumbers(node, bucket) {
    if (typeof node === "number") {
      if (Number.isFinite(node)) bucket.push(Math.abs(node));
      return bucket;
    }
    if (typeof node === "string") {
      (node.match(/\d+(?:[.,]\d+)?/g) || []).forEach((token) => bucket.push(Math.abs(Number(token.replace(",", ".")))));
      return bucket;
    }
    if (Array.isArray(node)) node.forEach((item) => animCollectNumbers(item, bucket));
    return bucket;
  }

  // Kiem chong gian di: moi con so mang y nghia ly/thi phai co goc trong loi giai, chi so phuc vu khung hinh duoc mien.
  function findUnanchoredNumbers(scene, answerText) {
    const answerNumbers = (String(answerText).match(/\d+(?:[.,]\d+)?/g) || []).map((token) => Math.abs(Number(token.replace(",", "."))));
    const declared = new Set(animCollectNumbers(Object.values(scene?.basis || {}), []));
    const used = [];
    (Array.isArray(scene?.steps) ? scene.steps : []).forEach((step) => {
      if (!step || typeof step !== "object") return;
      ANIM_SEMANTIC_FIELDS.forEach((key) => {
        if (step[key] === undefined) return;
        if ((key === "from" || key === "to") && step.do === "move") return;
        animCollectNumbers(step[key], used);
      });
    });
    const near = (a, b) => Math.abs(a - b) <= Math.max(1e-9, Math.abs(a) * 0.02);
    const unitShift = (a, b) => {
      if (!(a > 0 && b > 0)) return false;
      const ratio = Math.log10(a / b);
      return Math.abs(ratio - Math.round(ratio)) < 1e-6;
    };
    return [...new Set(used)].filter((value) => {
      if (ANIM_FREE_NUMBERS.has(value) || declared.has(value)) return false;
      return !answerNumbers.some((answer) => near(value, answer) || unitShift(value, answer));
    });
  }

  function validateAnimScene(scene, answerText) {
    if (scene?.no_draw === true) {
      return { steps: [], noDraw: true, note: String(scene.reason ?? "").replace(/[^\x20-\x7E]/g, "").slice(0, 180), unanchored: [] };
    }
    const steps = Array.isArray(scene?.steps) ? scene.steps : [];
    if (steps.length < 3 || steps.length > 16) throw new Error("Can tu 3 den 16 buoc trong key \"steps\".");
    const ids = new Set();
    const normalized = steps.map((step, index) => normalizeAnimStep(step, index, ids));
    // Duong tron, goc, da giac, vong tron luong giac phai co ti le 1:1 neu khong se bi bien dang thanh elip.
    if (normalized.some((step) => ["circle", "angle", "polygon", "orbit"].includes(step.do))) {
      normalized.forEach((step) => { if (step.do === "axes") step.equal = true; });
    }
    const spinning = new Set(normalized.filter((step) => step.do === "orbit").map((step) => step.id));
    normalized.forEach((step, index) => {
      if (step.do === "move" && spinning.has(step.id)) {
        throw new Error(`Buoc ${index + 1}: diem "${step.id}" da quay theo "orbit" thi khong duoc dung "move" nua.`);
      }
    });
    return { steps: normalized, noDraw: false, note: "", unanchored: findUnanchoredNumbers(scene, answerText) };
  }

  function extractAnimScene(rawText) {
    const source = String(rawText || "")
      .replace(/&lt;/gi, "<")
      .replace(/&gt;/gi, ">")
      .replace(/&amp;/gi, "&")
      .replace(/\r/g, "")
      .trim();
    const tagged = source.match(/<anim_code\s*>([\s\S]*?)(?:<\/anim_code\s*>|$)/i);
    const fenced = source.match(/```(?:json)?\s*([\s\S]*?)```/i);
    const candidate = (tagged?.[1] || fenced?.[1] || source).trim();
    const start = candidate.indexOf("{");
    const end = candidate.lastIndexOf("}");
    if (start < 0 || end <= start) return null;
    try {
      return JSON.parse(candidate.slice(start, end + 1));
    } catch (error) {
      return null;
    }
  }

  // equal=true: 1 don vi truc ngang = 1 don vi truc dung, tu mo rong truc con lai de khong mat range.
  function animAxesFrame(xRange, yRange, equal) {
    const availW = ANIM_W - 2 * ANIM_PAD;
    const availH = ANIM_H - 2 * ANIM_PAD;
    let x = [xRange[0], xRange[1]];
    let y = [yRange[0], yRange[1]];
    if (equal) {
      const k = Math.min(availW / (x[1] - x[0]), availH / (y[1] - y[0]));
      const midX = (x[0] + x[1]) / 2;
      const midY = (y[0] + y[1]) / 2;
      x = [midX - availW / k / 2, midX + availW / k / 2];
      y = [midY - availH / k / 2, midY + availH / k / 2];
    }
    const kx = availW / (x[1] - x[0]);
    const ky = availH / (y[1] - y[0]);
    return {
      x,
      y,
      k: Math.min(kx, ky),
      sx: (wx) => ANIM_PAD + ((wx - x[0]) / (x[1] - x[0])) * availW,
      sy: (wy) => ANIM_H - ANIM_PAD - ((wy - y[0]) / (y[1] - y[0])) * availH,
    };
  }

  function runAnimScene(stage, scene) {
    const canvas = stage.querySelector(".anim-canvas");
    const labelLayer = stage.querySelector(".anim-labels");
    if (!canvas || !labelLayer) return;
    const ctx = canvas.getContext("2d");
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(ANIM_W * dpr);
    canvas.height = Math.round(ANIM_H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    labelLayer.replaceChildren();

    const objects = new Map();
    const timeline = [];
    let autoIndex = 0;
    let lastAxes = null;

    const register = (obj) => { objects.set(obj.id || `__auto${autoIndex}`, obj); autoIndex += 1; return obj; };
    const needAxes = (step) => {
      const found = step.axes ? objects.get(step.axes) : lastAxes;
      if (!found || found.kind !== "axes") throw new Error(`Buoc "${step.do}" can "axes" hop le; hay tao buoc "axes" truoc.`);
      return found;
    };
    const needKind = (id, step, kind) => {
      const found = id ? objects.get(id) : null;
      if (!found || found.kind !== kind) throw new Error(`Buoc "${step.do}" tham chieu id "${id || ""}" khong ton tai hoac sai loai.`);
      return found;
    };
    const safeCall = (fn, value) => {
      try {
        const out = fn({ x: value, t: value });
        return Number.isFinite(out) ? out : NaN;
      } catch (error) {
        return NaN;
      }
    };
    const clipY = (ax, wy) => {
      const margin = (ax.y[1] - ax.y[0]) * 0.15;
      return Math.max(ax.y[0] - margin, Math.min(ax.y[1] + margin, wy));
    };
    const buildPoints = (ax, raw) => raw.map((pt) => (pt ? [ax.sx(pt[0]), ax.sy(clipY(ax, pt[1]))] : null));
    const pushTrail = (obj) => {
      if (!obj.ax || !obj.pos) return;
      obj.trail.push([obj.ax.sx(obj.pos[0]), obj.ax.sy(clipY(obj.ax, obj.pos[1]))]);
      if (obj.trail.length > 100) obj.trail.shift();
    };

    for (const step of scene.steps) {
      if (step.do === "axes") {
        const frame = animAxesFrame(step.x, step.y, step.equal);
        const obj = register({
          kind: "axes", id: step.id, x: frame.x, y: frame.y, k: frame.k, equal: step.equal, grid: step.grid !== false,
          xlabel: step.xlabel, ylabel: step.ylabel, alpha: 1, progress: 0, visible: true, pulse: 0,
          sx: frame.sx, sy: frame.sy,
        });
        lastAxes = obj;
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "plot") {
        const ax = needAxes(step);
        const raw = [];
        for (let i = 0; i <= 240; i += 1) {
          const wx = ax.x[0] + ((ax.x[1] - ax.x[0]) * i) / 240;
          const wy = safeCall(step.fn, wx);
          raw.push(Number.isFinite(wy) ? [wx, wy] : null);
        }
        const obj = register({ kind: "curve", id: step.id, ax, raw, pts: buildPoints(ax, raw), color: step.color, width: step.width, fn: step.fn, alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "param") {
        const ax = needAxes(step);
        const raw = [];
        for (let i = 0; i <= 240; i += 1) {
          const tv = step.tspan[0] + ((step.tspan[1] - step.tspan[0]) * i) / 240;
          let wx;
          let wy;
          try {
            wx = step.fx({ x: tv, t: tv });
            wy = step.fy({ x: tv, t: tv });
          } catch (error) {
            wx = NaN;
            wy = NaN;
          }
          raw.push(Number.isFinite(wx) && Number.isFinite(wy) ? [wx, wy] : null);
        }
        const obj = register({ kind: "curve", id: step.id, ax, raw, pts: buildPoints(ax, raw), color: step.color, width: step.width, alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "tangent") {
        const curve = needKind(step.curve, step, "curve");
        if (!curve.fn) throw new Error(`Buoc "tangent": duong cong "${step.curve}" khong phai dang y = f(x).`);
        const ax = curve.ax;
        const h = (ax.x[1] - ax.x[0]) / 400;
        const y0 = safeCall(curve.fn, step.at);
        const up = safeCall(curve.fn, step.at + h);
        const down = safeCall(curve.fn, step.at - h);
        const slope = Number.isFinite(y0) && Number.isFinite(up) && Number.isFinite(down) ? (up - down) / (2 * h) : NaN;
        if (!Number.isFinite(y0) || !Number.isFinite(slope)) throw new Error(`Buoc "tangent": khong tinh duoc ham/dao ham tai x = ${step.at}.`);
        const dx = (ax.x[1] - ax.x[0]) * 0.26;
        const obj = register({ kind: "segment", id: step.id, ax, a: [step.at - dx, y0 - slope * dx], b: [step.at + dx, y0 + slope * dx], color: step.color, width: 2.6, head: false, alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "area") {
        const curve = needKind(step.curve, step, "curve");
        if (!curve.fn) throw new Error(`Buoc "area": duong cong "${step.curve}" khong phai dang y = f(x).`);
        const obj = register({ kind: "area", id: step.id, ax: curve.ax, curve, from: step.from, color: step.color, alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "segment" || step.do === "arrow") {
        const ax = needAxes(step);
        const obj = register({ kind: "segment", id: step.id, ax, a: step.from, b: step.to, color: step.color, width: step.width, head: step.do === "arrow", alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "dot") {
        const ax = needAxes(step);
        const obj = register({ kind: "dot", id: step.id, ax, pos: [step.at[0], step.at[1]], r: step.r, color: step.color, alpha: 1, progress: 0, visible: true, pulse: 0, trail: [], trailOn: false });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; obj.alpha = p; } });
      } else if (step.do === "circle") {
        const ax = needAxes(step);
        const obj = register({ kind: "circle", id: step.id, ax, center: step.center, radius: step.radius, color: step.color, alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "orbit") {
        const obj = needKind(step.id, step, "dot");
        const ax = obj.ax;
        const offset = [obj.pos[0] - step.center[0], obj.pos[1] - step.center[1]];
        const radius = step.radius === null ? Math.hypot(offset[0], offset[1]) : step.radius;
        if (!(radius > 0)) throw new Error(`Buoc "orbit": diem "${step.id}" nam ngay tam nen ban kinh = 0.`);
        const startAngle = step.phase === null ? Math.atan2(offset[1], offset[0]) : step.phase;
        obj.orbit = { ax, center: step.center, radius, startAngle, angle: startAngle, swept: 0, pixStart: null, radiusLine: step.radiusLine, dropLine: step.dropLine };
        const entry = { dur: step.t, linear: true, frame: null };
        entry.frame = (p) => {
          const angle = startAngle + step.omega * (p * entry.dur);
          obj.pos = [step.center[0] + radius * Math.cos(angle), step.center[1] + radius * Math.sin(angle)];
          obj.orbit.angle = angle;
          obj.orbit.swept = angle - startAngle;
          if (obj.trailOn) pushTrail(obj);
        };
        timeline.push(entry);
      } else if (step.do === "polygon") {
        const ax = needAxes(step);
        const obj = register({ kind: "polygon", id: step.id, ax, points: step.points, color: step.color, alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "angle") {
        const ax = needAxes(step);
        const obj = register({ kind: "angle", id: step.id, ax, vertex: step.vertex, a: step.a, b: step.b, color: step.color, alpha: 1, progress: 0, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.progress = p; } });
      } else if (step.do === "text") {
        const ax = step.at ? (step.axes ? objects.get(step.axes) : lastAxes) : null;
        if (step.at && (!ax || ax.kind !== "axes")) throw new Error(`Buoc "text" co "at" can "axes" hop le.`);
        const el = document.createElement("div");
        el.className = "anim-label";
        el.textContent = `\\(${step.latex}\\)`;
        labelLayer.appendChild(el);
        if (window.MathJax?.typesetPromise) window.MathJax.typesetPromise([el]).catch(() => {});
        const obj = register({ kind: "label", id: step.id, ax, at: step.at, anchor: step.anchor || "top", el, alpha: 0, progress: 1, visible: true, pulse: 0 });
        timeline.push({ dur: step.t, frame: (p) => { obj.alpha = p; } });
      } else if (step.do === "move") {
        const obj = needKind(step.id, step, "dot");
        if (step.along) {
          const curve = needKind(step.along, step, "curve");
          const valid = curve.raw.filter((pt) => pt);
          if (valid.length < 2) throw new Error(`Buoc "move": duong cong "${step.along}" khong du diem hop le.`);
          timeline.push({
            dur: step.t,
            frame: (p) => {
              const frac = step.fromFrac + (step.toFrac - step.fromFrac) * p;
              const idx = Math.max(0, Math.min(valid.length - 1, Math.round(frac * (valid.length - 1))));
              obj.pos = [valid[idx][0], valid[idx][1]];
              if (obj.trailOn) pushTrail(obj);
            },
          });
        } else {
          const start = [obj.pos[0], obj.pos[1]];
          timeline.push({
            dur: step.t,
            frame: (p) => {
              obj.pos = [start[0] + (step.toPoint[0] - start[0]) * p, start[1] + (step.toPoint[1] - start[1]) * p];
              if (obj.trailOn) pushTrail(obj);
            },
          });
        }
      } else if (step.do === "fade") {
        const obj = objects.get(step.id);
        if (!obj) throw new Error(`Buoc "fade": khong thay id "${step.id}".`);
        const startAlpha = obj.alpha;
        timeline.push({ dur: step.t, frame: (p) => { obj.alpha = startAlpha * (1 - p); }, end: () => { obj.visible = false; } });
      } else if (step.do === "pulse") {
        const obj = objects.get(step.id);
        if (!obj) throw new Error(`Buoc "pulse": khong thay id "${step.id}".`);
        timeline.push({ dur: step.t, frame: (p) => { obj.pulse = Math.sin(Math.PI * p); }, end: () => { obj.pulse = 0; } });
      } else if (step.do === "trace") {
        const obj = needKind(step.id, step, "dot");
        timeline.push({
          dur: step.t,
          frame: () => {
            obj.trailOn = step.on;
            if (obj.trailOn) pushTrail(obj);
            else obj.trail = [];
          },
        });
      } else {
        timeline.push({ dur: step.t, frame: () => {} });
      }
    }

    let total = timeline.reduce((sum, entry) => sum + entry.dur, 0);
    if (total > 12) {
      const scale = 12 / total;
      timeline.forEach((entry) => { entry.dur *= scale; });
      total = 12;
    }
    if (total < 6.5) timeline.push({ dur: 6.5 - total, frame: () => {} });

    const niceStep = (range) => {
      const rough = range / 8;
      const base = Math.pow(10, Math.floor(Math.log10(rough || 1)));
      for (const mult of [1, 2, 2.5, 5, 10]) if (rough <= mult * base) return mult * base;
      return 10 * base;
    };
    const fmtTick = (value) => {
      const rounded = Math.round(value * 100) / 100;
      return Object.is(rounded, -0) ? "0" : String(rounded);
    };

    function drawAxes(obj) {
      const sharedStep = obj.equal ? niceStep(Math.min(obj.x[1] - obj.x[0], obj.y[1] - obj.y[0])) : 0;
      const stepX = sharedStep || niceStep(obj.x[1] - obj.x[0]);
      const stepY = sharedStep || niceStep(obj.y[1] - obj.y[0]);
      const left = obj.sx(obj.x[0]);
      const right = obj.sx(obj.x[1]);
      const bottom = obj.sy(obj.y[0]);
      const top = obj.sy(obj.y[1]);
      const originX = Math.max(left, Math.min(right, obj.sx(0)));
      const originY = Math.max(top, Math.min(bottom, obj.sy(0)));
      ctx.save();
      ctx.globalAlpha = obj.alpha * Math.min(1, 0.35 + obj.progress);
      if (obj.grid) {
        ctx.strokeStyle = "rgba(148,163,184,0.15)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let v = Math.ceil(obj.x[0] / stepX) * stepX; v <= obj.x[1] + 1e-9; v += stepX) {
          ctx.moveTo(obj.sx(v), top);
          ctx.lineTo(obj.sx(v), bottom);
        }
        for (let v = Math.ceil(obj.y[0] / stepY) * stepY; v <= obj.y[1] + 1e-9; v += stepY) {
          ctx.moveTo(left, obj.sy(v));
          ctx.lineTo(right, obj.sy(v));
        }
        ctx.stroke();
      }
      ctx.strokeStyle = "rgba(203,213,225,0.55)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(left, originY);
      ctx.lineTo(right, originY);
      ctx.moveTo(originX, bottom);
      ctx.lineTo(originX, top);
      ctx.stroke();
      ctx.fillStyle = "rgba(203,213,225,0.7)";
      ctx.font = "12px 'Segoe UI', sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      for (let v = Math.ceil(obj.x[0] / stepX) * stepX; v <= obj.x[1] + 1e-9; v += stepX) {
        if (Math.abs(v) < 1e-9) continue;
        ctx.fillText(fmtTick(v), obj.sx(v), originY + 6);
      }
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (let v = Math.ceil(obj.y[0] / stepY) * stepY; v <= obj.y[1] + 1e-9; v += stepY) {
        if (Math.abs(v) < 1e-9) continue;
        ctx.fillText(fmtTick(v), originX - 7, obj.sy(v));
      }
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText(obj.xlabel, right + 4, originY + 4);
      ctx.fillText(obj.ylabel, originX + 6, top - 4);
      ctx.restore();
    }

    function drawCurve(obj) {
      const upto = Math.max(2, Math.ceil(obj.pts.length * obj.progress));
      ctx.save();
      ctx.globalAlpha = obj.alpha;
      ctx.strokeStyle = obj.color;
      ctx.lineWidth = obj.width + obj.pulse * 2.4;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.shadowColor = obj.color;
      ctx.shadowBlur = 10 + obj.pulse * 14;
      ctx.beginPath();
      let pen = false;
      for (let i = 0; i < upto; i += 1) {
        const pt = obj.pts[i];
        if (!pt) { pen = false; continue; }
        if (!pen) { ctx.moveTo(pt[0], pt[1]); pen = true; } else ctx.lineTo(pt[0], pt[1]);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawArea(obj) {
      const ax = obj.ax;
      const steps = 90;
      ctx.save();
      ctx.globalAlpha = obj.alpha * 0.32 * obj.progress;
      ctx.fillStyle = obj.color;
      ctx.beginPath();
      let started = false;
      let lastX = obj.from[0];
      for (let i = 0; i <= steps; i += 1) {
        const wx = obj.from[0] + ((obj.from[1] - obj.from[0]) * i) / steps;
        const wy = safeCall(obj.curve.fn, wx);
        if (!Number.isFinite(wy)) continue;
        const px = ax.sx(wx);
        const py = ax.sy(clipY(ax, wy));
        if (!started) { ctx.moveTo(px, py); started = true; } else ctx.lineTo(px, py);
        lastX = wx;
      }
      if (started) {
        ctx.lineTo(ax.sx(lastX), ax.sy(clipY(ax, 0)));
        ctx.lineTo(ax.sx(obj.from[0]), ax.sy(clipY(ax, 0)));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawSegment(obj) {
      const ax = obj.ax;
      const a = [ax.sx(obj.a[0]), ax.sy(clipY(ax, obj.a[1]))];
      const b = [ax.sx(obj.b[0]), ax.sy(clipY(ax, obj.b[1]))];
      const end = [a[0] + (b[0] - a[0]) * obj.progress, a[1] + (b[1] - a[1]) * obj.progress];
      ctx.save();
      ctx.globalAlpha = obj.alpha;
      ctx.strokeStyle = obj.color;
      ctx.fillStyle = obj.color;
      ctx.lineWidth = obj.width + obj.pulse * 2;
      ctx.lineCap = "round";
      ctx.shadowColor = obj.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(end[0], end[1]);
      ctx.stroke();
      if (obj.head && obj.progress > 0.06) {
        const angle = Math.atan2(end[1] - a[1], end[0] - a[0]);
        const head = 11 + obj.width;
        ctx.beginPath();
        ctx.moveTo(end[0], end[1]);
        ctx.lineTo(end[0] - head * Math.cos(angle - 0.42), end[1] - head * Math.sin(angle - 0.42));
        ctx.lineTo(end[0] - head * Math.cos(angle + 0.42), end[1] - head * Math.sin(angle + 0.42));
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    function drawCircle(obj) {
      const ax = obj.ax;
      const rx = Math.abs(obj.radius) * ax.k;
      const ry = rx;
      ctx.save();
      ctx.globalAlpha = obj.alpha;
      ctx.strokeStyle = obj.color;
      ctx.lineWidth = 2.4 + obj.pulse * 2;
      ctx.shadowColor = obj.color;
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.ellipse(ax.sx(obj.center[0]), ax.sy(clipY(ax, obj.center[1])), rx, ry, 0, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * obj.progress);
      ctx.stroke();
      ctx.restore();
    }

    function drawPolygon(obj) {
      const pts = obj.points.map((pt) => [obj.ax.sx(pt[0]), obj.ax.sy(clipY(obj.ax, pt[1]))]);
      const segs = pts.length;
      const done = obj.progress * segs;
      ctx.save();
      ctx.globalAlpha = obj.alpha;
      ctx.strokeStyle = obj.color;
      ctx.lineWidth = 2.4 + obj.pulse * 2;
      ctx.lineJoin = "round";
      ctx.shadowColor = obj.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.moveTo(pts[0][0], pts[0][1]);
      for (let i = 1; i <= segs; i += 1) {
        const t = Math.max(0, Math.min(1, done - (i - 1)));
        if (t <= 0) break;
        const a = pts[i - 1];
        const b = pts[i % segs];
        ctx.lineTo(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t);
      }
      ctx.stroke();
      ctx.restore();
    }

    function drawAngle(obj) {
      const ax = obj.ax;
      const v = [ax.sx(obj.vertex[0]), ax.sy(clipY(ax, obj.vertex[1]))];
      const a1 = Math.atan2(ax.sy(obj.a[1]) - v[1], ax.sx(obj.a[0]) - v[0]);
      const a2 = Math.atan2(ax.sy(obj.b[1]) - v[1], ax.sx(obj.b[0]) - v[0]);
      let delta = a2 - a1;
      while (delta > Math.PI) delta -= Math.PI * 2;
      while (delta < -Math.PI) delta += Math.PI * 2;
      ctx.save();
      ctx.globalAlpha = obj.alpha;
      ctx.strokeStyle = obj.color;
      ctx.lineWidth = 2 + obj.pulse * 1.5;
      ctx.beginPath();
      ctx.arc(v[0], v[1], 30, a1, a1 + delta * obj.progress, delta < 0);
      ctx.stroke();
      ctx.restore();
    }

    function drawDot(obj) {
      const ax = obj.ax;
      const px = ax.sx(obj.pos[0]);
      const py = ax.sy(clipY(ax, obj.pos[1]));
      if (obj.trailOn && obj.trail.length > 1) {
        ctx.save();
        ctx.globalAlpha = obj.alpha * 0.45;
        ctx.strokeStyle = obj.color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        obj.trail.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt[0], pt[1]); else ctx.lineTo(pt[0], pt[1]); });
        ctx.stroke();
        ctx.restore();
      }
      ctx.save();
      ctx.globalAlpha = obj.alpha;
      ctx.fillStyle = obj.color;
      ctx.shadowColor = obj.color;
      ctx.shadowBlur = 12 + obj.pulse * 12;
      ctx.beginPath();
      ctx.arc(px, py, obj.r * (0.4 + 0.6 * obj.progress) * (1 + obj.pulse * 0.5), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawOrbit(obj) {
      const o = obj.orbit;
      const ax = o.ax;
      const cx = ax.sx(o.center[0]);
      const cy = ax.sy(clipY(ax, o.center[1]));
      const px = ax.sx(obj.pos[0]);
      const py = ax.sy(clipY(ax, obj.pos[1]));
      const rPx = o.radius * ax.k;
      if (o.pixStart === null) o.pixStart = Math.atan2(py - cy, px - cx);
      ctx.save();
      ctx.globalAlpha = obj.alpha * 0.5;
      ctx.strokeStyle = "rgba(148,163,184,0.6)";
      ctx.lineWidth = 1.4;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(cx, cy, rPx, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = obj.alpha;
      ctx.strokeStyle = obj.color;
      ctx.lineWidth = 2.4;
      ctx.shadowColor = obj.color;
      ctx.shadowBlur = 9;
      ctx.beginPath();
      ctx.arc(cx, cy, rPx, o.pixStart, o.pixStart - o.swept, o.swept > 0);
      ctx.stroke();
      if (o.radiusLine) {
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(px, py);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
      if (o.dropLine) {
        ctx.globalAlpha = obj.alpha * 0.75;
        ctx.strokeStyle = "rgba(226,232,240,0.75)";
        ctx.lineWidth = 1.6;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(px, cy);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = "rgba(226,232,240,0.9)";
        ctx.beginPath();
        ctx.arc(px, cy, 3.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function updateLabel(obj) {
      let px = ANIM_W / 2;
      let py = 30;
      if (obj.at && obj.ax) {
        px = obj.ax.sx(obj.at[0]);
        py = obj.ax.sy(clipY(obj.ax, obj.at[1]));
      } else if (obj.anchor === "bottom") py = ANIM_H - 26;
      else if (obj.anchor === "left") { px = 74; py = ANIM_H / 2; }
      else if (obj.anchor === "right") { px = ANIM_W - 74; py = ANIM_H / 2; }
      obj.el.style.left = `${(px / ANIM_W) * 100}%`;
      obj.el.style.top = `${(py / ANIM_H) * 100}%`;
      obj.el.style.opacity = String(Math.max(0, Math.min(1, obj.alpha)));
      obj.el.style.transform = `translate(-50%, -50%) scale(${1 + obj.pulse * 0.16})`;
    }

    function drawFrame() {
      ctx.clearRect(0, 0, ANIM_W, ANIM_H);
      for (const obj of objects.values()) {
        if (!obj.visible || obj.alpha <= 0) continue;
        switch (obj.kind) {
          case "axes": drawAxes(obj); break;
          case "curve": drawCurve(obj); break;
          case "area": drawArea(obj); break;
          case "segment": drawSegment(obj); break;
          case "circle": drawCircle(obj); break;
          case "polygon": drawPolygon(obj); break;
          case "angle": drawAngle(obj); break;
          case "dot": if (obj.orbit) drawOrbit(obj); drawDot(obj); break;
          case "label": updateLabel(obj); break;
        }
      }
    }

    let stepIndex = 0;
    let stepStart = 0;
    const ease = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
    function tick(now) {
      if (!stage.isConnected) return;
      if (stepIndex >= timeline.length) { drawFrame(); return; }
      if (!stepStart) stepStart = now;
      const entry = timeline[stepIndex];
      const p = Math.min(1, (now - stepStart) / (entry.dur * 1000));
      entry.frame(entry.linear ? p : ease(p));
      drawFrame();
      if (p >= 1) {
        if (entry.end) entry.end();
        stepIndex += 1;
        stepStart = 0;
      }
      window.requestAnimationFrame(tick);
    }
    window.requestAnimationFrame(tick);
  }

RÀNG BUỘC KỸ THUẬT (sai là hệ thống từ chối và dựng thất bại):
- "fn" là y theo x; "fx"/"fy" theo t. Chỉ được dùng: số, biến x hoặc t, các phép + - * / ^, ngoặc đơn, hàm sin cos tan asin acos atan sqrt cbrt abs exp ln log floor ceil round sign min max pow, hằng số pi và e. Phải viết rõ phép nhân: "2*x" (không viết "2x").
- Biểu thức chỉ trả ra số: không được gắn đơn vị có chữ (viết "9.8" chứ không "9.8 m").
- "latex" chỉ chứa LaTeX không dấu; tuyệt đối không có tiếng Việt có dấu.
- Màu phải là hex 6 chữ số (#rrggbb).
- Tổng các "t" phải từ 7 đến 11 giây; dùng 6 đến 12 bước; kết thúc bằng "wait" 1 đến 1.5 giây.
- Để một điểm chạy trên đường cong: tạo "dot" rồi dùng "move" với "along" là id của bước "plot" hoặc "param".
- "equal":true nghĩa là 1 đơn vị trục ngang = 1 đơn vị trục dọc. Hệ thống TỰ bật equal khi cảnh có "circle", "orbit", "angle" hoặc "polygon", nên không thể vẽ đường tròn trong hệ trục co giãn.
- "orbit" làm một "dot" đã tạo (khớp "id") quay ĐỀU trên đường tròn thật quanh "center" với "omega" rad/giây không đổi, "phase" là pha đầu; hệ thống tự vẽ bán kính quay và hình chiếu của điểm xuống trục ngang.
- "axes" BẮT BUỘC có "xlabel" và "ylabel" là tên đại lượng thật ("x","y","t","F","v","E","Q","n"), không dấu tiếng Việt. Trục không có tên là trục vô nghĩa.
- Một điểm đã quay bằng "orbit" thì không được dùng "move" cho điểm đó nữa.
- Nếu vẽ hình sẽ dễ gây hiểu nhầm (chủ đề thuần định tính, lời giải thiếu dữ kiện), trả về {"no_draw":true,"reason":"ly do ngan khong dau"} thay vì đoán bừa.
- Nếu buộc phải phóng to/thu nhỏ hoặc đổi đơn vị để hình vừa khung, khai báo trong "basis", ví dụ {"basis":{"A":"A=4cm trong loi giai, ve ban kinh 2 de de nhin"}}.

KHÔNG BỊA ĐẶT THÔNG TIN (hệ thống kiểm tra tự động và bắt làm lại):
- Mọi con số trong "fn", "fx", "fy", "radius", "at", "center", "from", "to", "points", "vertex", "omega", "phase" phải lấy NGUYÊN VĂN từ lời giải, hoặc là giá trị đổi đơn vị thập phân của nó (4 cm → 0.04). Chỉ "x", "y", "tspan", "t" được tự chọn để vừa khung hình.
- Lời giải không cho số thì vẽ ở dạng tổng quát với nhãn ký hiệu ("A", "omega", "F", "v0") rồi khai báo "basis"; tuyệt đối không tự nghĩ ra số liệu.
- Giá trị suy ra được từ lời giải (đỉnh parabol, tầm bay, chu kỳ, tần số góc, tỉ số) vẫn phải ghi rõ trong "basis" kèm công thức tính, ví dụ {"basis":{"H":"H=v0^2/(2g)=5 m suy ra từ du kien"}}. Hệ thống tự so từng con số trong kịch bản với lời giải và bắt làm lại nếu không có gốc.
- Không tự thêm lực, thêm chất, thêm vật, thêm điều kiện biên mà lời giải không nói. Không đổi đơn vị ngầm định.

KHUNG CHUẨN BẢN CHẤT DÙNG CHUNG CHO TOÁN – LÝ – HÓA (đây là quy tắc cấu trúc, áp dụng cho mọi chủ đề):
1. Đồ thị hàm số phải sinh ra từ CHÍNH công thức trong lời giải, không phải "vẽ cho giống": parabol y=ax^2+bx+c có a>0 mở lên, a<0 mở xuống, đỉnh và giao trục tung khớp số liệu; bậc ba đúng số cực trị; sin/cos đúng chu kỳ T=2*pi/omega.
2. Đồ thị chuyển động: (x,t) thẳng đều là đường thẳng xiên, nhanh dần đều là parabol; (v,t) thẳng đều là đường nằm ngang, nhanh dần đều là đường thẳng xiên. Đổi trục là phải đổi công thức.
3. Ném ngang / ném xiên: trục đứng là độ cao, quỹ đạo là parabol LỒI XUỐNG (hệ số bậc hai âm), điểm ném và độ cao khớp dữ kiện. Không vẽ quỹ đạo cong ngược.
4. Chu kỳ / tuần hoàn (dao động, sóng, điện xoay chiều, chuyển động tròn đều): dùng "orbit" (vòng tròn lượng giác) hoặc đồ thị hình sin đúng chu kỳ; không dùng parabol, không dùng elip, không giả chuyển động quay bằng "move".
5. Đường tròn, góc, đa giác: chỉ xuất hiện khi bản chất đúng là hình đó; "equal" được bật tự động nên độ dài và góc hiển thị đúng tỉ lệ thật.
6. Vec-tơ (lực, vận tốc, gia tốc, cường độ trường): "arrow" phải đúng hướng và đúng tỉ lệ độ dài giữa các vec-tơ trong cùng một hình; hợp lực theo quy tắc hình bình hành; vật cân bằng thì các vec-tơ phải khép kín.
7. Quang học: tia tới và tia phản xạ đối nhau QUA PHÁP TUYẾN (không đối qua mặt gương); tia khúc xạ lệch VỀ PHÍA pháp tuyến khi sang môi trường chiết quang hơn.
8. Hóa học: số nguyên tử mỗi nguyên tố hai vế phải bằng nhau; tỉ lệ hệ số chính là tỉ lệ mol; chất tham gia/sản phẩm đúng danh tính trong lời giải, không tự sinh chất mới.
9. Tên đại lượng trong "latex" và "xlabel"/"ylabel" phải trùng tên lời giải đã dùng (F, v, x, A, T...), không đổi tên tùy tiện.

BẢNG CHỌN CẢNH CHUẨN CHO CHỦ ĐỀ HAY GẶP Ở CẤP THPT (chọn đúng dòng rồi mới viết bước; không có dòng nào khớp thì suy ra từ công thức trong lời giải theo 9 quy tắc trên):
- TOÁN Hàm số (bậc hai, trùng phương, bậc ba, phân thức hữu tỉ): trục "x"–"y", "plot" bằng CHÍNH công thức lời giải; đạo hàm thì thêm "tangent"; cực trị là nơi "tangent" nằm ngang; tiệm cận đứng của phân thức là "segment" thẳng đứng, không vẽ đường crosses tại đó.
- TOÁN Mũ – Logarit: "plot" "a^x" (đi qua (0,1)) hoặc "ln(x)" (đi qua (1,0), chỉ vẽ với x>0 và "x" bắt đầu từ giá trị dương); không vẽ loga cho x ≤ 0.
- TOÁN Lượng giác: phương trình lượng giác vẽ "plot" "sin(x)" trên trục "x" là radian, giao với đường ngang là nghiệm; chu kỳ đúng 2*pi (cos) hoặc pi (tan). "tan(x)" có tiệm cận, không nối liền qua chúng.
- TOÁN Hình giải tích: đường tròn "x^2+y^2=R^2" dùng "circle" với đúng R; ELIP THẬT (x^2/a^2 + y^2/b^2 = 1) dùng "param" "a*cos(t)" cùng "b*sin(t)" với a khác b — đây là elip ĐÚNG bản chất, được phép; chỉ bị cấm khi dùng elip để GIẢ đường tròn. Parabol có tiêu điểm, góc, độ dài: bật "equal" và "polygon"/"angle" để giữ tỉ lệ thật.
- TOÁN Tích phân – diện tích: "plot" rồi "area" với "from" đúng cận lời giải; diện tích chỉ tô giữa đường cong và trục hoành.
- TOÁN Dãy số – xác suất: chỉ vẽ khi lời giải có mẫu hữu hạn hoặc bảng tần số; dùng "segment"/"dot" rời từng giá trị, KHÔNG nối thành đường cong liên tục vì dãy số rời rạc.
- LÝ Động học: "x"–"t" hoặc "v"–"t" theo công thức lời giải; thẳng đều trên (v,t) là đường ngang, trên (x,t) là đường xiên; nhanh dần đều trên (x,t) là parabol lồi lên dưới, "area" dưới (v,t) chính là quảng đường.
- LÝ Ném ngang / ném xiên: "param" "v0*cos(alpha)*t" và "h - 0.5*g*t^2"; quỹ đạo parabol mở xuống, tầm bay lấy từ lời giải.
- LÝ Dao động điều hòa: bắt buộc "orbit" (vòng tròn lượng giác) như mẫu bên dưới, hoặc "plot" hình sin trên trục "t". Ba đồ thị x, v, a cùng tần số, v sớm pha pi/2 so với x, a ngược pha x.
- LÝ Sóng cơ: đồ thị theo không gian có "xlabel":"x" và "ylabel":"u", hình sin lặp đúng bước sóng; hai điểm ngược pha cách nhau lambda/2.
- LÝ Điện xoay chiều: "plot" "u" và "i" cùng trục "t", lệch đúng độ lệch pha lời giải; chu kỳ T = 2*pi/omega.
- LÝ Lực – cân bằng: "arrow" gốc tại vật, tỉ lệ độ dài đúng tỉ số độ lớn; cân bằng thì các vec-tơ khép kín.
- LÝ Quang hình: "segment" là gương/mặt phân cách, "segment" nét đứt là pháp tuyến, "arrow" là các tia; góc đo từ pháp tuyến, "angle" đánh dấu góc tới và góc khúc xạ.
- HÓA Phản ứng: chỉ vẽ khi lời giải cho thấy biến đổi theo thời gian — "plot" nồng độ (mol/lit) hoặc khối lượng theo "t"; số nguyên tử hai vế bằng nhau, bảo toàn electron thể hiện bằng "arrow" có cùng tổng.
- HÓA Chuẩn độ axit – bazơ: "plot" pH (trục "y" từ 0 đến 14) theo thể tích dung dịch chuẩn; đường cong có bậc nhảy tại điểm tương đương, không vẽ đường thẳng.
- HÓA Dung dịch – độ tan, cân bằng thuận nghịch: "plot" đơn điệu tiến dần tới giá trị bão hòa/hằng số, không vẽ dao động tuần hoàn.

TRƯỚC KHI TRẢ VỀ, tự kiểm tra 5 điều và sửa lại nếu bất kỳ điều nào sai:
(1) mỗi con số đều có gốc trong lời giải hoặc đã khai trong "basis"; (2) nhãn hai trục là đại lượng thật, không dấu; (3) hình có vòng tròn/góc/đa giác thì đã bật "equal" và tỉ lệ nhìn thấy đúng tỉ lệ thật; (4) hiện tượng tuần hoàn dùng "orbit" hoặc hình sin, không dùng parabol/đường thẳng; (5) nếu không đủ dữ kiện để vẽ đúng, trả "no_draw" thay vì vẽ đại.

ĐÚNG BẢN CHẤT HÌNH HỌC (quan trọng nhất, sai là bài giảng thành sai):
- Đường tròn phải là đường tròn thật: nghiêm cấm dùng "param" với hệ số cos và sin khác nhau (ví dụ "2*cos(t)" đi cùng "1.2*sin(t)") để giả đường tròn — đó là elip.
- DAO ĐỘNG ĐIỀU HÒA / vòng tròn lượng giác: BẮT BUỘC dùng "orbit". Bán kính = A, "omega" = ω, "phase" = φ; li độ của vật chính là hình chiếu của bán kính quay xuống trục ngang. Kịch bản mẫu đúng:
  {"do":"axes","id":"ax","x":[-2.6,2.6],"y":[-2.6,2.6],"grid":true,"xlabel":"x","ylabel":"y","t":1.2}
  {"do":"dot","id":"M","axes":"ax","at":[2,0],"color":"#ffd54a","t":0.5}
  {"do":"orbit","id":"M","center":[0,0],"radius":2,"omega":1,"phase":0,"t":6.3}
  {"do":"text","latex":"x=A\\cos(\\omega t+\\varphi)","anchor":"top","t":1}
  {"do":"wait","t":1.2}
  Không vẽ elip, không vẽ parabol, không dùng "move"/"trace" để giả chuyển động quay.
- Muốn vẽ đồ thị li độ theo thời gian thì dùng hệ trục khác với "xlabel":"t" và "plot" có "fn" dạng "A*cos(omega*x+phi)" (biến x ở đây là thời gian). Đồ thị dao động là hình sin, không phải parabol và không phải đường thẳng.
- Con lắc lò xo / vật dao động trên trục: vẽ "orbit" rồi dùng hình chiếu, hoặc vẽ "plot" hình sin theo "t"; không vẽ quỹ đạo dao động thành đường tròn kín.
- Khi nội dung cần bàn luận là hệ số góc hay độ nghiêng của "tangent" thì đặt "equal":true cho "axes", nếu không góc nhìn thấy sẽ không bằng góc thật.
- Hình học phẳng (góc, tam giác, vec-tơ): chọn "x","y" vừa đủ bao trọn hình vì equal được bật tự động; "xlabel"/"ylabel" phải là đại lượng thật ("x","y","t","F").

ĐÚNG BẢN CHẤT KHOA HỌC:
- Thể hiện đúng khái niệm và công thức của lời giải: parabol mở đúng chiều, đạo hàm là hệ số góc tiếp tuyến, tích phân là diện tích dưới đường cong, vec-tơ lực cùng hướng gia tốc, dao động điều hòa có dạng sin, phương trình hóa học cân bằng đúng số nguyên tử.
- Trung lập, khách quan; chỉ dùng dữ kiện có trong lời giải, không bịa số liệu; nhãn và công thức phải khớp chính xác với lời giải.`;
  }

  async function requestIllustration(groupId) {
    const responseGroup = document.getElementById(groupId);
    const button = responseGroup?.querySelector(".illustration-btn");
    if (!responseGroup || !button || button.disabled) return;

    const existingPanel = responseGroup.querySelector(".illustration-panel");
    if (existingPanel) {
      existingPanel.remove();
      button.textContent = "🖼 Vẽ hình minh họa";
      return;
    }

    button.disabled = true;
    button.textContent = "⏳ Đang dựng animation...";
    const panel = document.createElement("div");
    panel.className = "illustration-panel";
    panel.innerHTML = `<div class="typing-label">AI đang dựng animation ngắn...</div>`;
    responseGroup.querySelector(".msg.bot")?.appendChild(panel);

    const latestAnswer = responseGroup.dataset.illustrationAnswer || responseGroup.querySelector(".bot-text")?.innerText || "";
    const latestQuestion = responseGroup.dataset.illustrationQuestion || "";
    const basePrompt = buildIllustrationPrompt(latestQuestion, latestAnswer);
    let scene = null;
    let usedFallback = false;

    const buildScene = async (promptText) => {
      const raw = await callGeminiIllustration(promptText);
      const parsed = extractAnimScene(raw);
      if (!parsed) throw new Error("AI khong tra ve khoi <anim_code> hop le.");
      return validateAnimScene(parsed, latestAnswer);
    };

    try {
      scene = await buildScene(basePrompt);
    } catch (error) {
      console.warn("Kịch bản animation lỗi, nhờ Gemini sửa một lần:", error);
      try {
        scene = await buildScene(`${basePrompt}\n\nLƯỢT TRƯỚC BỊ TỪ CHỐI: ${error.message}\nHãy sửa đúng lỗi đó, giữ nguyên ý nghĩa khoa học, rồi trả về kịch bản mới.`);
      } catch (repairError) {
        console.warn("Không sửa được kịch bản, dùng animation mẫu:", repairError);
      }
    }
    if (!scene) {
      scene = validateAnimScene(buildSafeAnimFallback(), "");
      usedFallback = true;
    }

    // Số không có trong lời giải = có dấu hiệu bịa dữ liệu: cho AI làm lại đúng một lần.
    let anchored = !scene?.unanchored?.length;
    if (!scene?.noDraw && !anchored) {
      const listed = scene.unanchored.slice(0, 8).join(", ");
      console.warn("Kịch bản dùng số không có trong lời giải:", scene.unanchored);
      try {
        const fixed = await buildScene(`${basePrompt}\n\nLƯỢT TRƯỚC DÙNG CÁC SỐ KHÔNG CÓ TRONG LỜI GIẢI: ${listed}.\nHãy sửa: chỉ dùng số lấy nguyên văn từ lời giải (hoặc đổi đơn vị thập phân của nó), nếu buộc phải phóng/tách để hình vừa khung thì khai báo trong "basis", còn không thì vẽ tổng quát bằng nhãn ký hiệu.`);
        if (fixed.noDraw) {
          scene = fixed;
        } else {
          scene = fixed;
          anchored = !fixed.unanchored.length;
        }
      } catch (error) {
        console.warn("Không sửa được số liệu của kịch bản:", error);
      }
    }

    if (scene?.noDraw) {
      panel.innerHTML = `<div class="illustration-note">${escapeHtml(scene.note || "Chủ đề này vẽ hình dễ gây hiểu nhầm nên tớ giải thích bằng lời cho chắc.")}</div>`;
      button.disabled = false;
      button.textContent = "🖼 Vẽ hình minh họa";
      return;
    }

    const mountScene = () => {
      const caption = usedFallback
        ? "AI chưa tạo được kịch bản phù hợp nên hệ thống dựng animation mẫu."
        : (anchored
          ? "Animation dựng trực tiếp trong trình duyệt — máy nào cũng chạy được, không cần cài đặt."
          : "Hình có chi tiết phóng/tách so với số liệu trong lời giải, cậu đối chiếu lại công thức nhé.");
      panel.innerHTML = `<div class="anim-stage"><canvas class="anim-canvas"></canvas><div class="anim-labels"></div><button class="anim-replay" type="button">▶ Chơi lại</button></div><div class="illustration-note">${caption}</div>`;
      const stage = panel.querySelector(".anim-stage");
      stage.querySelector(".anim-replay").addEventListener("click", () => runAnimScene(stage, scene));
      runAnimScene(stage, scene);
    };

    try {
      mountScene();
    } catch (error) {
      console.warn("Kịch bản AI dựng thất bại, chuyển sang animation mẫu:", error);
      usedFallback = true;
      scene = validateAnimScene(buildSafeAnimFallback(), "");
      try {
        mountScene();
      } catch (fatalError) {
        console.error("Không dựng được animation:", fatalError);
        panel.innerHTML = `<div class="illustration-note">Không dựng được animation: ${escapeHtml(fatalError.message)}</div>`;
        button.disabled = false;
        button.textContent = "🖼 Vẽ hình minh họa";
        return;
      }
    }
    button.disabled = false;
    button.textContent = "Ẩn animation";
  }

  function buildHarmonicMotionPython() {

cx, cy, radius = 360, 226, 132
theta = -math.pi / 4

svg.append(f'<line class="c" x1="{cx}" y1="{cy}" x2="{mx:.2f}" y2="{my:.2f}"/>')

svg.append(f'<circle class="p" cx="{cx}" cy="{cy}" r="5"/><circle class="p" cx="{mx:.2f}" cy="{cy}" r="5"/>')
svg.append(f'<text class="t" x="{cx-12}" y="{cy+24}">O</text><text class="t" x="{mx+10:.2f}" y="{my-10:.2f}">M</text><text class="t" x="{mx+10:.2f}" y="{cy+24}">P</text>')
svg.append(f'<text class="t" x="{cx+radius+18}" y="{cy+24}">A</text><text class="t" x="{cx-radius-34}" y="{cy+24}">-A</text>')
