<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trợ Lý Học Tập AI Socratic - KHKT Edition</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; height: 100vh; }
    .chat-card { width: 100%; max-width: 700px; background: white; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); padding: 20px; display: flex; flex-direction: column; height: 90vh; }
    .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 12px; margin-bottom: 12px; }
    .header h3 { margin: 0; color: #1a73e8; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
    .clear-btn { background: #ff4d4f; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.2s; }
    .clear-btn:hover { background: #d9363e; }
    .chat-box { flex: 1; overflow-y: auto; border: 1px solid #f0f0f0; border-radius: 12px; padding: 16px; margin-bottom: 12px; background: #fafafa; }
    .msg { margin: 12px 0; padding: 12px 16px; border-radius: 18px; max-width: 85%; line-height: 1.5; word-wrap: break-word; font-size: 14.5px; }
    .user { background: #1a73e8; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
    .bot { background: #ffffff; color: #2c3e50; margin-right: auto; border-bottom-left-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #eef0f2; white-space: pre-wrap; }
    .bot mjx-container { overflow-x: auto; overflow-y: hidden; max-width: 100%; padding: 2px 0; }
    .input-group { display: flex; gap: 10px; }
    input { flex: 1; padding: 14px 18px; border: 1px solid #e0e0e0; border-radius: 25px; outline: none; font-size: 14px; transition: border 0.2s; }
    input:focus { border-color: #1a73e8; }
    button.send-btn { padding: 14px 24px; border: none; background: #1a73e8; color: white; border-radius: 25px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    button.send-btn:hover { background: #1557b0; }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)'], ['$','$']],
        displayMath: [['\\[', '\\]'], ['$$','$$']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>

<div class="chat-card">
  <div class="header">
    <h3>🧠 Trợ Lý AI Sư Phạm THPT</h3>
    <button class="clear-btn" onclick="clearChat()">🗑️ Xóa Chat</button>
  </div>
  
  <div class="chat-box" id="chatBox">
    <div class="msg bot">Chào cậu nhé! Tớ là Trợ lý Học tập AI Socratic. Tớ đã sẵn sàng cùng cậu thảo luận và giải quyết các bài tập THPT rồi đây. Cậu có câu hỏi hay bài tập nào cần gợi mở không nào? 😊</div>
  </div>
  
  <div class="input-group">
    <input type="text" id="userInput" placeholder="Nhập bài tập, câu hỏi hoặc trò chuyện..." onkeydown="if(event.key==='Enter') sendMessage()">
    <button class="send-btn" onclick="sendMessage()">Gửi</button>
  </div>
</div>

<script>
  // =========================================================================
  // 1. MẢNG 4 API KEY ĐÃ MÃ HÓA BASE64 (Thay chuỗi Base64 của bạn vào đây)
  // =========================================================================
  const ENCODED_KEYS = [
    "QVEuQWI4Uk42SnlCLWF3M2VwaFZyNUIwaTJETWJXZzkyYXEzQXQtWUJDRWQ0OXFpWEtBeFE",
    "QVEuQWI4Uk42TFF6dzMwRUwtU19aNFFsUG4xWmwwT3pNRlZiMmVnTzhpR2ttdjQ4OUZVSWc=",
    "QVEuQWI4Uk42SS15LWpFT2duZjJlZVdfdnZDMjJ5MzUzOUM3TjdSc2R3bXE1UF9NMGMwa2c=",
    "QVEuQWI4Uk42S2ktcnNMbENRdDJIUHFGenRJdUgzQUJqMUxaVzE1YWdPZVRLVjg5dUF0TVE=",
  ];

  let currentKeyIndex = 0;
  function getNextApiKey() {
    const key = atob(ENCODED_KEYS[currentKeyIndex]);
    currentKeyIndex = (currentKeyIndex + 1) % ENCODED_KEYS.length;
    return key;
  }

  // SYSTEM PROMPT: Văn phong Socratic + Phát hiện cạm bẫy lỗi sai
  const SYSTEM_PROMPT = `
Bạn là một AI đồng hành học tập và người bạn thân của người dùng. Hãy giao tiếp tự nhiên, thân thiện, gần gũi và có chiều sâu, như hai người bạn thân đã quen nhau lâu năm. Bạn có thể vui vẻ, hài hước và dùng cách nói đời thường phù hợp, nhưng luôn giữ sự lịch sự và chuyên nghiệp.
Bạn phải là một người hướng dẫn học tập theo phương pháp Socratic, giúp người dùng tự suy nghĩ, khám phá và tìm ra câu trả lời thông qua các câu hỏi gợi mở. Bạn không chỉ đưa ra đáp án, mà còn khuyến khích người dùng tư duy phản biện, phân tích và hiểu bản chất vấn đề.
Bạn hãy cố gắng nói chuyện với người dùng theo ngữ cảnh, hiểu được tâm trạng và nhu cầu của họ. Khi người dùng hỏi về kiến thức học tập, hãy hướng dẫn họ từng bước, giải thích trực quan và dễ hiểu, thay vì chỉ đưa ra công thức hay đáp án.
Bạn có tư duy sắc bén, ham học hỏi và luôn ưu tiên sự chính xác. Không mù quáng đồng ý với người dùng. Nếu người dùng sai, hãy nhẹ nhàng chỉ ra điểm sai và giải thích lý do.
Khi giải thích kiến thức, đặc biệt là Toán và các môn khoa học, hãy ưu tiên trực giác, hình dung, mô hình hóa và bản chất vấn đề thay vì chỉ đưa công thức hoặc đáp án.
Khi người dùng gặp khó khăn, hãy đồng hành và giúp họ tìm ra hướng giải quyết thay vì chỉ đưa ra câu trả lời.
Khi viết công thức Toán, hãy dùng ký hiệu Unicode dễ đọc trên màn hình: viết căn bậc hai bằng √, ví dụ √81 = 9; dùng ² và ³ cho lũy thừa khi phù hợp. Không viết sprt(), sqrt() hoặc mã LaTeX như \\sqrt{81} trong câu trả lời thông thường.
Với công thức dài hoặc có nhiều ký hiệu, hãy dùng LaTeX chuẩn trong dấu \\( ... \\) cho công thức cùng dòng hoặc \\[ ... \\] cho công thức riêng một dòng. Dùng đúng các lệnh như \\sqrt{}, \\frac{}{}, x^2, x_i, \\sum, \\int, \\lim, \\in, \\subset, \\le, \\ge, \\ne, \\alpha và \\angle khi cần.
Bạn có thể dùng Markdown đơn giản như **in đậm**, nhưng không đặt toàn bộ câu trả lời trong ký hiệu Markdown.
Hãy điều chỉnh cách giao tiếp theo ngữ cảnh:
- Trò chuyện thông thường: tự nhiên, thoải mái và vui vẻ.
- Học tập: rõ ràng, logic và dễ hiểu.
- Vấn đề nghiêm túc: bình tĩnh, sâu sắc và chân thành.
- Ý tưởng mới: tò mò, tích cực và cùng người dùng khám phá.
Không sử dụng ngôn ngữ thô tục, xúc phạm hoặc thiếu chuyên nghiệp.
Quan trọng nhất: Đừng khiến người dùng cảm thấy họ đang nói chuyện với một chatbot máy móc. Hãy trở thành một người bạn đồng hành đáng tin cậy, cùng họ suy nghĩ, học tập và khám phá những điều mới.`;

  // GIỚI HẠN BỘ NHỚ LƯU TRỮ (Tối đa 25 tin nhắn trong lịch sử persistent)
  const MAX_HISTORY = 25;

  // =========================================================================
  // 2. TẢI & QUẢN LÝ BỘ NHỚ LOCALSTORAGE
  // =========================================================================
  let chatHistory = JSON.parse(localStorage.getItem("khkt_socratic_chat_history")) || [];

  window.onload = function() {
    const chatBox = document.getElementById("chatBox");
    if (chatHistory.length > 0) {
      chatHistory.forEach(msg => {
        const roleClass = msg.role === "user" ? "user" : "bot";
        const textContent = msg.parts[0].text;
        const renderedContent = msg.role === "model" ? formatBotReply(textContent) : escapeHtml(textContent);
        chatBox.innerHTML += `<div class="msg ${roleClass}">${renderedContent}</div>`;
        if (msg.role === "model") typesetMath(chatBox.lastElementChild);
      });
      chatBox.scrollTop = chatBox.scrollHeight;
    }
    typesetMath(chatBox);
  };

  function saveHistory() {
    if (chatHistory.length > MAX_HISTORY) {
      chatHistory = chatHistory.slice(-MAX_HISTORY);
    }
    localStorage.setItem("khkt_socratic_chat_history", JSON.stringify(chatHistory));
  }

  function clearChat() {
    if (confirm("Cậu có muốn xóa toàn bộ lịch sử trò chuyện này không?")) {
      chatHistory = [];
      localStorage.removeItem("khkt_socratic_chat_history");
      document.getElementById("chatBox").innerHTML = `
        <div class="msg bot">Đã làm sạch bộ nhớ! Chúng ta bắt đầu cuộc trò chuyện mới nhé 😊</div>
      `;
    }
  }

  // =========================================================================
  // 3. KIẾN TRÚC ROUTER MODEL (PHÂN LOẠI CÂU HỎI TỰ ĐỘNG)
  // =========================================================================
  function isAcademicQuery(text) {
    const academicKeywords = [
      "giải", "tính", "so sánh", "tại sao", "chứng minh", "bài tập", 
      "lý thuyết", "công thức", "vật lý", "hóa học", "toán", "sinh học", 
      "phân tích", "cho phương trình", "tìm x", "vận tốc", "nguyên tố"
    ];
    return academicKeywords.some(keyword => text.toLowerCase().includes(keyword));
  }

  // =========================================================================
  // 4. HÀM GỬI TIN NHẮN VÀ XOAY VÒNG KEY
  // =========================================================================
  async function sendMessage() {
    const inputField = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const text = inputField.value.trim();

    if (!text) return;

    // Hiển thị câu hỏi của học sinh
    chatBox.innerHTML += `<div class="msg user">${escapeHtml(text)}</div>`;
    inputField.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    // Thêm vào bộ nhớ Lịch sử & Lưu localStorage
    chatHistory.push({ role: "user", parts: [{ text: text }] });
    saveHistory();

    // Google Gemini 3.5 Flash-Lite
    const modelName = "gemini-3.5-flash-lite";

    const loadingId = "loading-" + Date.now();
    const loadingText = "⚡ Đang xử lý...";
    chatBox.innerHTML += `<div class="msg bot" id="${loadingId}"><i>${loadingText}</i></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    let success = false;
    let attempts = 0;
    let lastError = "Không nhận được phản hồi từ Google Gemini.";

    // Vòng lặp xoay vòng thử qua cả 4 Key nếu gặp lỗi Quota/Rate Limit
    while (!success && attempts < ENCODED_KEYS.length) {
      attempts++;
      const apiKey = getNextApiKey();

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
            contents: chatHistory
          })
        });

        const data = await response.json();

        if (!response.ok || data.error) {
          lastError = data.error?.message || `Google Gemini trả về lỗi HTTP ${response.status}.`;
          console.warn(`Key #${currentKeyIndex} gặp lỗi: ${lastError}`);
          continue;
        }

        if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
          const botReply = data.candidates[0].content.parts[0].text;
          
          const replyElement = document.getElementById(loadingId);
          replyElement.innerHTML = formatBotReply(botReply);
          typesetMath(replyElement);

          // Lưu câu trả lời của AI vào bộ nhớ
          chatHistory.push({ role: "model", parts: [{ text: botReply }] });
          saveHistory();

          success = true;
        } else {
          lastError = "Google Gemini không trả về nội dung trong candidates.";
        }
      } catch (err) {
        lastError = err.message || "Lỗi kết nối đến Google Gemini.";
        console.error("Lỗi kết nối:", err);
      }
    }

    if (!success) {
      document.getElementById(loadingId).innerText = `⚠️ Không gửi được yêu cầu: ${lastError}`;
      chatHistory.pop();
      saveHistory();
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function formatBotReply(text) {
    let formatted = escapeHtml(text);

    formatted = formatted
      .replace(/\\sqrt\(([^()\n]+)\)/g, "\\sqrt{$1}")
      .replace(/\bsqrt\(([^()\n]+)\)/gi, "√$1")
      .replace(/\bsprt\(([^()\n]+)\)/gi, "√$1")
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/`([^`\n]+)`/g, "<code>$1</code>");

    return formatted;
  }

  function typesetMath(element) {
    if (window.MathJax?.typesetPromise) {
      window.MathJax.typesetPromise([element]).catch(error => console.warn("Không render được công thức:", error));
    }
  }
</script>

</body>
</html>
