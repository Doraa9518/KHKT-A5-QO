<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Trợ Lý AI Giáo Dục THPT - Hybrid Engine Edition</title>

  <!-- 1. MARKED.JS -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- 2. MATHJAX -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: { fontCache: 'global' }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    :root {
      --ui-bg-1: #f4f7fb;
      --ui-bg-2: #e8eef7;
      --ui-card: rgba(255, 255, 255, 0.86);
      --ui-panel: rgba(15, 23, 42, 0.05);
      --ui-line: rgba(15, 23, 42, 0.12);
      --ui-text: #172033;
      --ui-muted: #5b6678;
      --ui-accent: #5b7cff;
      --ui-bot-bg: rgba(255,255,255,0.82);
      --ui-bot-text: #172033;
      --ui-shadow: 0 20px 48px rgba(15, 23, 42, 0.14);
    }

    body.dark-theme {
      --ui-bg-1: #121417;
      --ui-bg-2: #0f172a;
      --ui-card: rgba(24, 29, 36, 0.8);
      --ui-panel: rgba(255,255,255,0.04);
      --ui-line: rgba(255,255,255,0.08);
      --ui-text: #f0f2f5;
      --ui-muted: #b0b3b8;
      --ui-bot-bg: rgba(255,255,255,0.06);
      --ui-bot-text: #f1f5f9;
      --ui-shadow: 0 22px 55px rgba(0, 0, 0, 0.34);
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--ui-accent) 16%, transparent), var(--ui-bg-1) 58%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--ui-text);
      transition: background 0.35s ease, color 0.25s ease;
    }

    .chat-card {
      position: relative;
      width: min(100%, 1400px);
      height: 90vh;
      background: rgba(7, 11, 18, 0.52);
      border: 1px solid var(--ui-line);
      border-radius: 28px;
      box-shadow: var(--ui-shadow);
      display: flex;
      flex-direction: column;
      padding: 14px 18px 18px;
      animation: cardEnter 0.55s cubic-bezier(.2,.8,.2,1) both;
      backdrop-filter: blur(4px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--ui-line);
      padding: 8px 10px 14px;
      margin-bottom: 12px;
      gap: 14px;
    }
    .header-left { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; min-width: 0; flex: 1; }
    .header h3 {
      margin: 0;
      color: var(--ui-text);
      font-size: 1.04rem;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .header h3::first-letter { color: var(--ui-accent); }

    .mode-select, .thinking-select, .detail-select {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid var(--ui-line);
      background: rgba(255,255,255,0.04);
      font-weight: 600;
      color: var(--ui-text);
      outline: none;
      cursor: pointer;
      font-size: 12px;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .mode-select:hover, .thinking-select:hover, .detail-select:hover { border-color: var(--ui-accent); transform: translateY(-1px); }

    .clear-btn {
      background: rgba(91,124,255,0.2);
      color: var(--ui-text);
      border: none;
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .clear-btn:hover { background: rgba(217, 54, 62, 0.9); }

    .ui-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .layout-btn {
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 8px 11px;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .gear-btn {
      width: 38px;
      height: 38px;
      padding: 0;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      cursor: pointer;
      font-size: 18px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .gear-btn:hover {
      transform: rotate(90deg) scale(1.04);
      box-shadow: 0 8px 18px rgba(91, 124, 255, 0.12);
    }

    .settings-panel {
      position: absolute;
      top: 76px;
      right: 18px;
      display: flex;
      gap: 10px;
      flex-direction: column;
      align-items: stretch;
      width: min(360px, calc(100% - 32px));
      padding: 16px;
      border: 1px solid var(--ui-line);
      border-radius: 20px;
      background: color-mix(in srgb, var(--ui-bg-1) 94%, transparent);
      backdrop-filter: blur(10px);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.4);
      opacity: 0;
      transform: translateY(-10px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s ease;
      z-index: 20;
      color: var(--ui-text);
      font-size: 12px;
    }
    .settings-panel.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      animation: panelEnter 0.22s ease both;
    }
    .settings-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .settings-group label {
      font-size: 11px;
      font-weight: 700;
      color: var(--ui-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .theme-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .theme-btn, .accent-btn {
      border: 1px solid var(--ui-line);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      background: rgba(255,255,255,0.03);
      color: var(--ui-text);
      font-size: 12px;
    }
    .accent-btn { width: 22px; height: 22px; padding: 0; border-radius: 50%; }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      border-radius: 22px;
      padding: 18px 18px 20px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--ui-line);
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
    }
    .msg-container { max-width: 1280px; margin: 0 auto; width: 100%; }
    .msg {
      width: fit-content;
      margin: 6px 0;
      padding: 15px 18px;
      border-radius: 20px;
      max-width: 88%;
      line-height: 1.6;
      word-wrap: break-word;
      font-size: 15px;
      animation: messageEnter 0.3s cubic-bezier(.2,.8,.2,1) both;
    }
    .user {
      background: linear-gradient(135deg, var(--ui-accent), color-mix(in srgb, var(--ui-accent) 72%, #172554 28%));
      color: white;
      margin-left: auto;
      margin-right: 0;
      border-bottom-right-radius: 8px;
      box-shadow: 0 7px 18px color-mix(in srgb, var(--ui-accent) 20%, transparent);
    }
    .user img { max-width: 100%; max-height: 250px; border-radius: 12px; margin-bottom: 8px; display: block; }
    .bot {
      background: var(--ui-bot-bg);
      color: var(--ui-bot-text);
      margin-right: auto;
      border-bottom-left-radius: 8px;
      border: 1px solid var(--ui-line);
      box-shadow: 0 5px 16px rgba(15,23,42,0.06);
    }
    .typing-message { display: inline-flex; align-items: center; gap: 9px; min-width: 112px; }
    .typing-dots { display: inline-flex; align-items: center; gap: 4px; height: 14px; }
    .typing-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--ui-accent); animation: typingBounce 1.15s infinite ease-in-out; }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    .typing-label { color: var(--ui-muted); font-size: 12px; font-style: italic; }
    .bot h1, .bot h2, .bot h3, .bot h4 { margin-top: 10px; margin-bottom: 6px; color: #7db6ff; }
    .bot p { margin: 6px 0; }
    .bot ul, .bot ol { margin: 6px 0; padding-left: 20px; }
    .bot hr { border: 0; height: 1px; background: var(--ui-line); margin: 12px 0; }

    .response-group { width: 100%; }
    .response-meta { width: 90%; display: flex; flex-direction: column; gap: 8px; margin: -2px 0 8px; padding: 10px 18px 0; border-top: 1px dashed var(--ui-line); }
    .engine-badge { display: inline-block; width: fit-content; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; }
    .engine-gemini { background: #e8f0fe; color: #1a73e8; }

    .feedback-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .feedback-btn { padding: 5px 12px; border-radius: 14px; border: 1px solid var(--ui-line); background: rgba(255,255,255,0.04); color: var(--ui-text); font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
    .feedback-btn.understand:hover { background: #e6f4ea; color: #137333; border-color: #137333; }
    .feedback-btn.confused:hover { background: #fce8e6; color: #c5221f; border-color: #c5221f; }
    .feedback-status { font-size: 12px; font-weight: 600; }
    .feedback-status.understood { color: #137333; }
    .feedback-status.retrying { color: #c5221f; }
    .speech-toggle-btn { padding: 5px 9px; border-radius: 12px; border: 1px solid var(--ui-line); background: rgba(255,255,255,0.04); color: var(--ui-text); font-size: 12px; cursor: pointer; }
    .learning-tools { display: flex; gap: 8px; flex-wrap: wrap; }
    .learning-tool-btn { border: 1px solid var(--ui-line); border-radius: 12px; padding: 8px 11px; background: rgba(255,255,255,0.04); color: var(--ui-text); cursor: pointer; font-size: 12px; font-weight: 700; }
    .learning-tool-btn.active { background: rgba(91,124,255,0.18); border-color: rgba(91,124,255,0.5); color: #dfe9ff; }
    .english-tools { display: none; gap: 8px; align-items: center; flex-wrap: wrap; }
    body.english-mode .english-tools { display: flex; }
    body.english-mode .learning-tools { display: none; }
    body.english-mode .upload-btn,
    body.english-mode .image-preview-container { display: none !important; }
    .english-level { width: auto; min-width: 150px; padding: 8px 11px; border: 1px solid var(--ui-line); border-radius: 12px; background: var(--ui-panel); color: var(--ui-text); font-size: 12px; font-weight: 700; }
    .voice-status { color: var(--ui-muted); font-size: 12px; font-style: italic; }
    .english-mode-btn, .voice-btn { border: 1px solid var(--ui-line); border-radius: 999px; padding: 9px 13px; background: var(--ui-panel); color: var(--ui-text); cursor: pointer; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .english-mode-btn.active, .voice-btn.active { background: color-mix(in srgb, var(--ui-accent) 20%, transparent); border-color: var(--ui-accent); color: var(--ui-accent); }
    .voice-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 19px; flex: 0 0 44px; }

    .input-wrapper { margin: 0 auto; width: min(100%, 1280px); display: flex; flex-direction: column; gap: 8px; }
    .image-preview-container { display: none; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 12px; width: fit-content; }
    .image-preview-container img { height: 45px; border-radius: 6px; object-fit: cover; }
    .remove-img-btn { background: #ff4d4f; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; cursor: pointer; font-size: 11px; font-weight: bold; }
    .input-row { display: flex; gap: 12px; width: 100%; align-items: center; }
    .upload-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 50%; width: 52px; height: 52px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; color: white; }
    input[type="text"] {
      flex: 1;
      padding: 16px 18px;
      border: 1px solid var(--ui-line);
      border-radius: 26px;
      outline: none;
      font-size: 15px;
      background: rgba(255,255,255,0.04);
      color: var(--ui-text);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      min-height: 56px;
    }
    input[type="text"]:focus { border-color: rgba(91,124,255,0.8); box-shadow: 0 0 0 4px rgba(91,124,255,0.18); }
    button.send-btn { min-height:56px; padding:0 26px; border:none; background: rgba(91,124,255,0.9); color:white; border-radius:26px; cursor:pointer; font-weight:600; font-size:15px; }
    button, .upload-btn, .clear-btn, .layout-btn, .gear-btn { transition: transform 0.2s ease, filter 0.2s ease, background 0.2s ease; }
    button:hover, .upload-btn:hover, .clear-btn:hover, .layout-btn:hover, .gear-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

    body.phone-mode { padding: 14px; }
    body.phone-mode .chat-card { width: min(100%, 430px); height: 92vh; padding: 12px; }
    body.phone-mode .header { align-items: flex-start; flex-direction: column; }
    body.phone-mode .header-left { width: 100%; gap: 6px; }
    body.phone-mode .header h3 { width: 100%; }
    body.phone-mode .ui-tools { width: 100%; justify-content: flex-end; }
    body.phone-mode .chat-box { padding: 11px; }
    body.phone-mode .msg { max-width: 92%; }
    body.phone-mode .response-meta { width: 92%; }
    body.phone-mode .input-row { gap: 7px; }
    body.phone-mode .upload-btn { width: 44px; height: 44px; }
    body.phone-mode button.send-btn { padding: 0 17px; }

    @keyframes cardEnter { from { opacity: 0; transform: translateY(16px) scale(0.985); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes messageEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes panelEnter { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes typingBounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.35; } 30% { transform: translateY(-4px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

    @media (max-width: 600px) {
      body { padding: 14px; }
      .chat-card { height: 92vh; padding: 12px; }
      .header { align-items: flex-start; }
      .header-left { gap: 6px; }
      .header h3 { width: 100%; }
      .msg { max-width: 88%; }
    }

    /* Gemini-inspired spacing layer: keeps the existing controls and behavior intact. */
    body {
      padding: 0;
      align-items: stretch;
      background: var(--ui-bg-1);
    }
    .chat-card {
      width: 100%;
      height: 100vh;
      max-width: none;
      padding: 16px 24px 22px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
    }
    .header {
      width: min(100%, 1180px);
      margin: 0 auto 8px;
      padding: 4px 0 12px;
      border-bottom: 0;
    }
    .chat-box {
      width: min(100%, 980px);
      margin: 0 auto 18px;
      padding: 22px 10px 28px;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .msg-container { max-width: 900px; }
    .msg {
      max-width: min(86%, 760px);
      padding: 14px 18px;
    }
    .bot {
      background: transparent;
      border: 0;
      box-shadow: none;
      padding-left: 0;
    }
    .input-wrapper {
      width: min(100%, 980px);
      gap: 10px;
    }
    .learning-tools { padding-left: 4px; }
    .input-row {
      gap: 8px;
      padding: 7px 8px 7px 10px;
      border: 1px solid var(--ui-line);
      border-radius: 32px;
      background: var(--ui-panel);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.14);
    }
    .upload-btn {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border: 0;
      background: transparent;
    }
    input[type="text"] {
      min-height: 42px;
      padding: 10px 6px;
      border: 0;
      background: transparent;
      box-shadow: none;
    }
    input[type="text"]:focus {
      border-color: transparent;
      box-shadow: none;
    }
    button.send-btn {
      min-height: 42px;
      padding: 0 20px;
      border-radius: 24px;
      font-size: 14px;
    }
    .settings-panel { top: 62px; }

    @media (max-width: 600px) {
      .chat-card { padding: 12px 14px 16px; }
      .header { padding-bottom: 4px; }
      .chat-box { padding: 10px 2px 20px; }
      .msg { max-width: 94%; }
      .input-row { padding-left: 6px; }
      .upload-btn { width: 38px; height: 38px; flex-basis: 38px; }
      button.send-btn { padding: 0 15px; }
    }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="header">
    <div class="header-left">
      <h3>🧠 Trợ Lý AI Giáo Dục THPT</h3>
    </div>

    <div class="ui-tools">
      <button class="layout-btn" id="layoutToggle" onclick="toggleLayoutMode()" title="Chuyển bố cục Phone hoặc PC">📱 Phone</button>
      <button class="english-mode-btn" id="englishModeBtn" onclick="toggleEnglishMode()" title="Chuyển sang không gian luyện tiếng Anh">🇬🇧 Mode English</button>
      <button class="gear-btn" onclick="toggleSettings()" title="Cài đặt giao diện">⚙️</button>
      <button class="clear-btn" onclick="clearChat()">🗑️ Xóa Chat</button>
    </div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="settings-group">
      <label>Chế độ AI</label>
      <select id="aiMode" class="mode-select" onchange="switchMode()">
        <option value="student">🎓 Học Sinh</option>
        <option value="teacher">👨‍🏫 Giáo Viên</option>
        <option value="talkshow">💬 Talkshow</option>
        <option value="english">🇬🇧 Luyện tiếng Anh</option>
      </select>
    </div>

    <div class="settings-group english-settings">
      <label>Trình độ tiếng Anh</label>
      <select id="englishLevel" class="thinking-select">
        <option value="A1">A1 - Beginner</option>
        <option value="A2">A2 - Elementary</option>
        <option value="B1" selected>B1 - Intermediate</option>
        <option value="B2">B2 - Upper-intermediate</option>
      </select>
    </div>

    <div class="settings-group">
      <label>Phong cách trả lời</label>
      <select id="thinkingMode" class="thinking-select">
        <option value="talking">💬 Talking</option>
        <option value="study" selected>📚 Study</option>
      </select>
    </div>

    <div class="settings-group">
      <label>Mức độ giải thích</label>
      <select id="detailMode" class="detail-select">
        <option value="normal">⚡ Tóm Tắt</option>
        <option value="detailed" selected>🔍 Chi Tiết & Bản Chất</option>
      </select>
    </div>

    <div class="settings-group">
      <label>Giao diện</label>
      <div class="theme-row">
        <button class="theme-btn" onclick="setUiTheme('light')">Sáng</button>
        <button class="theme-btn" onclick="setUiTheme('dark')">Tối</button>
      </div>
    </div>

    <div class="settings-group">
      <label>Màu nhấn</label>
      <div class="theme-row">
        <button class="accent-btn" style="background:#5b7cff" onclick="setUiAccent('#5b7cff')" aria-label="Xanh dương"></button>
        <button class="accent-btn" style="background:#22c55e" onclick="setUiAccent('#22c55e')" aria-label="Xanh lá"></button>
        <button class="accent-btn" style="background:#f97316" onclick="setUiAccent('#f97316')" aria-label="Cam"></button>
        <button class="accent-btn" style="background:#ec4899" onclick="setUiAccent('#ec4899')" aria-label="Hồng"></button>
      </div>
    </div>
  </div>

  <div class="chat-box" id="chatBox">
    <div class="msg-container" id="msgContainer">
      <div class="msg bot" id="welcomeMsg">Chào cậu nhé! Tớ là Trợ lý AI. Hãy gửi bài tập để tớ cùng cậu giải mã bản chất nhé! 😊</div>
    </div>
  </div>

  <div class="input-wrapper">
    <div class="learning-tools" aria-label="Công cụ học tập">
      <button class="learning-tool-btn" id="diagnoseBtn" onclick="startErrorDiagnosis()">🩺 Mình sai ở đâu?</button>
      <button class="learning-tool-btn" id="arenaBtn" onclick="toggleArenaMode()">🏆 Luyện thi HSG</button>
    </div>
    <div class="english-tools" aria-label="Công cụ luyện tiếng Anh">
      <span class="voice-status" id="voiceStatus">Nhắn tin hoặc bật voice mode để luyện nói.</span>
    </div>
    <div class="image-preview-container" id="imagePreviewContainer">
      <img id="imagePreview" src="" alt="Ảnh">
      <span id="imageName" style="font-size: 12px; color: #4b5563;"></span>
      <button class="remove-img-btn" onclick="removeSelectedImage()">✕</button>
    </div>

    <div class="input-row">
      <label class="upload-btn" title="Tải ảnh bài tập lên">📷
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelect(event)">
      </label>

  // HÀM CHUYỂN ĐỔI CHUẨN HÓA LATEX
  function fixLatexFormat(text) {
    if (!text) return "";
    let cleaned = text
      .replace(/\\\[/g, "$$")
      .replace(/\\\]/g, "$$")
      .replace(/\\\(/g, "$")
      .replace(/\\\)/g, "$");

    // Chuẩn hóa riêng phần công thức, không đụng vào dấu câu của văn bản thường.
    cleaned = cleaned.replace(/(\$\$[\s\S]*?\$\$|\$(?!\$)[\s\S]*?\$(?!\$))/g, mathBlock => {
      const isDisplayMath = mathBlock.startsWith("$$");
      const delimiter = isDisplayMath ? "$$" : "$";
      const innerMath = mathBlock.slice(delimiter.length, -delimiter.length)
        .replace(/;/g, " ")
        .replace(/(\d+)\.(\d+)/g, "$1{,}$2")
        .replace(/\s+,/g, ",")
        .replace(/[ \t]{2,}/g, " ")
        .trim();
      return delimiter + innerMath + delimiter;
    });

    return cleaned;
  }

  async function sendMessage(overrideText = null) {
    const inputField = document.getElementById("userInput");
    const msgContainer = document.getElementById("msgContainer");
    const chatBox = document.getElementById("chatBox");
    
    const text = overrideText ? overrideText : inputField.value.trim();
    if (!text && !selectedImageBase64) return;

    const userParts = [];
    let userMsgHtml = "";

    if (selectedImageBase64) {
      userParts.push({ inline_data: { mime_type: selectedImageMimeType, data: selectedImageBase64 } });
      userMsgHtml += `<img src="data:${selectedImageMimeType};base64,${selectedImageBase64}">`;
    }

    const textPrompt = text || "Giải bài tập trong ảnh giúp tớ nhé!";
    userParts.push({ text: textPrompt });
    userMsgHtml += `<div>${escapeHtml(textPrompt)}</div>`;

    msgContainer.innerHTML += `<div class="msg user">${userMsgHtml}</div>`;
    const hasImage = selectedImageBase64 !== null;
    inputField.value = "";
    removeSelectedImage();
    chatBox.scrollTop = chatBox.scrollHeight;

    chatHistory.push({ role: "user", parts: userParts });
    saveLearnerProfile("question", textPrompt);

    const mode = document.getElementById("aiMode").value;
    const thinkingLevel = document.getElementById("thinkingMode").value;
    const activePrompt = buildActivePrompt();

    const selectedGeminiModel = thinkingLevel === "talking"
      ? GEMINI_TALKING_MODEL
      : GEMINI_STUDY_MODEL;
    const selectedTemperature = learningMode === "arena"
      ? 0.3
      : mode === "talkshow"
      ? 0.65
      : mode === "english"
        ? 0.45
        : thinkingLevel === "talking" ? 0.25 : 0.2;
    const loadingId = "loading-" + Date.now();

    const engineLabel = thinkingLevel === "talking"
      ? "Gemini Flash-Lite"
      : "Gemini Flash";
    msgContainer.innerHTML += `<div class="msg bot typing-message" id="${loadingId}"><span class="typing-dots" aria-label="AI đang soạn trả lời"><span></span><span></span><span></span></span><span class="typing-label">AI đang suy nghĩ...</span></div>`;
    chatBox.scrollTop = chatBox.scrollHeight;

    let replySuccess;
    if (learningMode === "arena") {
      replySuccess = await callQwenArenaApi(loadingId);
    } else {
      replySuccess = await callGeminiApi(loadingId, activePrompt, selectedGeminiModel, hasImage ? "Gemini Flash (ảnh)" : engineLabel, selectedTemperature);
    }

    if (!replySuccess) {
      document.getElementById(loadingId).innerHTML = learningMode === "arena"
        ? "⚠️ Groq/Qwen đang bận hoặc các API key đều không khả dụng. Cậu thử lại sau vài giây nhé!"
        : "⚠️ Gemini đang bận hoặc các API key đều không khả dụng. Cậu thử lại sau vài giây nhé!";
      chatHistory.pop();
    }

    chatBox.scrollTop = chatBox.scrollHeight;
  }

  async function callQwenArenaApi(loadingId) {
    const qwenHistory = chatHistory.slice(-8).map(message => {
      if (!Array.isArray(message.parts)) return null;
      const text = message.parts
        .filter(part => typeof part.text === "string")
        .map(part => part.text)
        .join("\n");
      const imageParts = message.parts
        .filter(part => part.inline_data?.data && part.inline_data?.mime_type)
        .map(part => ({
          type: "image_url",
          image_url: { url: `data:${part.inline_data.mime_type};base64,${part.inline_data.data}` }
        }));
      const content = imageParts.length > 0
        ? [{ type: "text", text: text || "Hãy phân tích ảnh bài tập này." }, ...imageParts]
        : text;
      return {
        role: message.role === "model" ? "assistant" : "user",
        content
      };
    }).filter(message => message && (typeof message.content === "string" ? message.content.trim() : message.content.length));

    const hasImage = qwenHistory.some(message => Array.isArray(message.content));
    const model = hasImage ? GROQ_VISION_MODEL : GROQ_QWEN_MODEL;
    try {
      const response = await fetch(GROQ_ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model,
          messages: [
            { role: "system", content: QWEN_ARENA_PROMPT },
            ...qwenHistory
          ],
          temperature: 0.25,
          max_tokens: 4096
        })
      });

      const data = await response.json().catch(() => ({}));
      if (!response.ok || data.error) {
        console.warn("Groq proxy error:", data.error);
        return false;
      }

      const replyText = data.choices?.[0]?.message?.content?.trim();
      if (!replyText) return false;
      renderBotResponse(loadingId, replyText, hasImage ? "Groq Vision · HSG" : "Qwen 3.8 27B · HSG", "engine-gemini");
      return true;
    } catch (error) {
      console.error("Groq proxy connection error:", error);
      return false;
    }
  }

  // GỌI GEMINI API - TỰ CHUYỂN ĐỔI CHUẨN GEMINI FORMAT
  async function callGeminiApi(loadingId, activePrompt, modelName, engineLabel, temperature) {
    if (!GEMINI_KEYS || GEMINI_KEYS.length === 0) return false;

    let attempts = 0;
    while (attempts < GEMINI_KEYS.length) {
      attempts++;
      const apiKey = getNextGeminiKey();
      if (!apiKey) continue;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;

        // TẠO MẢNG CONTENTS RIÊNG CHUẨN GEMINI
        const geminiContents = chatHistory.map(msg => {
          const role = (msg.role === "user") ? "user" : "model";
          let parts = [];

          if (Array.isArray(msg.parts)) {
            parts = msg.parts;
          } else if (typeof msg.content === "string") {
            parts = [{ text: msg.content }];
          } else {
            parts = [{ text: "" }];
          }

          return { role: role, parts: parts };
        });

        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            system_instruction: { parts: [{ text: activePrompt }] },
            contents: geminiContents,
            generationConfig: {
              temperature: temperature,
              maxOutputTokens: 8192
            }
          })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.error) {
          console.warn(`Gemini Key ${attempts} bị lỗi:`, data.error);
          continue;
        }

        const responseParts = data.candidates?.[0]?.content?.parts || [];
        const botReply = responseParts
          .map(part => typeof part.text === "string" ? part.text : "")
          .join("")
          .trim();
        if (botReply) {
          renderBotResponse(loadingId, botReply, engineLabel, "engine-gemini");
          return true;
        }
      } catch (err) {
        console.error(`Lỗi kết nối Gemini lượt ${attempts}:`, err);
      }
    }
    return false;
  }

  // HÀM RENDER ĐÃ ĐƯỢC FIX LỖI LATEX VÀ TRÌNH BÀY
  function renderBotResponse(elemId, replyText, engineName, badgeClass) {
    const botMsgElem = document.getElementById(elemId);
    const responseTarget = document.getElementById(`${elemId}-group`)
      || botMsgElem.closest(".response-group")
      || botMsgElem;
    
    // 1. CHUẨN HÓA LATEX VỀ DẠNG $ VÀ $$
    const cleanedText = fixLatexFormat(replyText);

    // 2. CHUYỂN DỔI MARKDOWN THÀNH HTML
    const renderedContent = marked.parse(cleanedText);

    // 3. THÊM NÚT FEEDBACK
    const speechButtonMarkup = activeSpace === "english"
      ? `<button class="speech-toggle-btn" onclick="toggleSpeechOutput(this)" aria-label="${speechOutputEnabled ? "Tắt đọc câu trả lời" : "Bật đọc câu trả lời"}">${speechOutputEnabled ? "🔊 Đang đọc" : "🔇 Chỉ chữ"}</button>`
      : "";
    const feedbackButtons = `
      <div class="feedback-actions">
        ${speechButtonMarkup}
        <button class="feedback-btn understand" onclick="handleFeedback(this, 'understand')">👍 Đã hiểu</button>
        <button class="feedback-btn confused" onclick="handleFeedback(this, 'confused')">❓ Chưa hiểu lắm</button>
      </div>
    `;

    // GHÉP GIAO DIỆN
    responseTarget.outerHTML = `<div class="response-group" id="${elemId}-group"><div class="msg bot" id="${elemId}"><div class="bot-text">${renderedContent}</div></div><div class="response-meta"><span class="engine-badge ${badgeClass}">Engine: ${engineName}</span>${feedbackButtons}</div></div>`;

    // 4. KÍCH HOẠT MATHJAX VẼ CÔNG THỨC TOÁN
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise([document.getElementById(elemId)]).catch(err => console.error("MathJax Error:", err));
    }

    chatHistory.push({ role: "model", parts: [{ text: replyText }] });
    saveActiveChatHistory();
    const speechControlButton = document.querySelector(`#${elemId}-group .speech-toggle-btn`);
    if (speechControlButton) speechControlButton.dataset.speechText = replyText;
    if (activeSpace === "english" && speechOutputEnabled) speakEnglishReply(replyText);
  }

  async function requestMicrophoneAndListen() {
    // Chỉ SpeechRecognition xin quyền mic; không gọi getUserMedia thêm lần nữa.
    startVoiceInput();
  }

  function startVoiceInput() {
    if (!voiceModeEnabled) return;
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      document.getElementById("voiceStatus").textContent = "Trình duyệt này chưa hỗ trợ nhận giọng nói. Hãy dùng Chrome hoặc Edge.";
      return;
    }

    if (speechRecognition) {
      try { speechRecognition.stop(); } catch (error) {}
    }

    speechRecognition = new Recognition();
    speechRecognition.lang = "en-US";
    speechRecognition.interimResults = false;
    // Một lần bấm chỉ nhận một lượt nói; quyền đã cấp vẫn được trình duyệt giữ.
    speechRecognition.continuous = false;
    speechRecognition.maxAlternatives = 3;
    speechRecognition.onstart = () => {
      document.getElementById("voiceStatus").textContent = "Đang nghe... Hãy nói bằng tiếng Anh.";
    };
    speechRecognition.onresult = event => {
      const transcript = Array.from(event.results)
        .slice(event.resultIndex)
        .map(result => result[0]?.transcript || "")
        .join(" ")
        .trim();
      if (transcript) {
        voiceModeEnabled = false;
        document.getElementById("voiceModeBtn").classList.remove("active");
        try { speechRecognition.stop(); } catch (error) {}
        document.getElementById("userInput").value = transcript;
        sendMessage();
      }
    };
    speechRecognition.onerror = event => {
      speechRecognition.__hasError = true;
      const errorMessages = {
        "not-allowed": "Micro bị chặn. Hãy cấp quyền microphone cho trang này.",
        "service-not-allowed": "Dịch vụ nhận giọng nói bị trình duyệt chặn. Hãy thử Edge hoặc Chrome.",
        "audio-capture": "Không tìm thấy microphone. Hãy kiểm tra tai nghe hoặc thiết bị âm thanh.",
        "network": "Nhận giọng nói cần kết nối mạng ổn định.",
        "no-speech": "Mình chưa nghe thấy tiếng nói. Hãy bấm micro và nói rõ bằng tiếng Anh."
      };
      document.getElementById("voiceStatus").textContent = errorMessages[event.error] || "Micro chưa hoạt động. Hãy thử lại nhé.";
      if (["not-allowed", "service-not-allowed", "audio-capture"].includes(event.error)) {
        voiceModeEnabled = false;
        document.getElementById("voiceModeBtn").classList.remove("active");
      }
    };
    speechRecognition.onend = () => {
      if (voiceModeEnabled && !speechRecognition?.__hasError) {
        document.getElementById("voiceStatus").textContent = "Micro đã dừng. Bấm mic để nói tiếp.";
      }
      speechRecognition = null;
    };
    try {
      speechRecognition.__hasError = false;
      speechRecognition.start();
    } catch (error) {
      document.getElementById("voiceStatus").textContent = "Micro đang bận. Hãy chờ một chút rồi thử lại.";
      voiceModeEnabled = false;
      document.getElementById("voiceModeBtn").classList.remove("active");
    }
  }

  function speakEnglishReply(text) {
    if (!("speechSynthesis" in window)) return;
    if (!speechOutputEnabled || activeSpace !== "english") return;
    window.speechSynthesis.cancel();
    const currentSpeechToken = ++speechOutputToken;
    const spokenText = text
      .replace(/```[\s\S]*?```/g, "")
      .replace(/[*_#`$]/g, "")
      .replace(/\[(.*?)\]\(.*?\)/g, "$1")
      .replace(/\n+/g, ". ")
      .replace(/\s{2,}/g, " ")
      .trim();
    if (!spokenText) return;

    const chunks = spokenText.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [spokenText];
    chunks.reduce((promise, chunk) => promise.then(() => queueSpeechChunk(chunk.trim(), currentSpeechToken)), Promise.resolve());
  }

  function loadEnglishVoices() {
    if (!("speechSynthesis" in window)) return;
    const updateVoices = () => {
      availableEnglishVoices = window.speechSynthesis.getVoices()
        .filter(voice => /^en(-|_)/i.test(voice.lang))
        .sort((first, second) => {
          const firstPreferred = /Google|Microsoft|Samantha|Daniel/i.test(first.name);
          const secondPreferred = /Google|Microsoft|Samantha|Daniel/i.test(second.name);
          return Number(secondPreferred) - Number(firstPreferred);
        });
    };
    updateVoices();
    window.speechSynthesis.addEventListener("voiceschanged", updateVoices);
  }

  function queueSpeechChunk(text, currentSpeechToken) {
    return new Promise(resolve => {
      if (!text || activeSpace !== "english" || !speechOutputEnabled || currentSpeechToken !== speechOutputToken) {
        resolve();
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      const femaleVoice = availableEnglishVoices.find(voice => /female|samantha|zira|aria|jenny|eva|susan|karen|moira|google us english/i.test(voice.name))
        || availableEnglishVoices.find(voice => /en-US/i.test(voice.lang) && /google|microsoft/i.test(voice.name));
      const selectedVoice = femaleVoice
        || availableEnglishVoices.find(voice => /en-US/i.test(voice.lang))
        || availableEnglishVoices[0];
      if (selectedVoice) {
        utterance.voice = selectedVoice;
        utterance.lang = selectedVoice.lang;
      } else {
        utterance.lang = "en-US";
      }
      utterance.rate = 0.9;
      utterance.pitch = 1;
      utterance.volume = 1;
      utterance.onend = resolve;
      utterance.onerror = resolve;
      window.speechSynthesis.speak(utterance);
    });
  }

  async function handleFeedback(btnElement, type) {
    const parentContainer = btnElement.parentElement;
    const responseGroup = parentContainer.closest(".response-group");
    const responseElement = responseGroup ? responseGroup.querySelector(".msg.bot") : null;
    if (type === 'understand') {
      const detailLevel = document.getElementById("detailMode").value;
      learningPreferences.detail = detailLevel === "detailed"
        ? "Hãy tiếp tục ưu tiên cách giải từng bước, giải thích bản chất và lý do của mỗi bước."
        : "Hãy ưu tiên cách giải ngắn gọn, rõ ý và đi thẳng vào trọng tâm.";
      localStorage.setItem("ai-learning-preferences", JSON.stringify(learningPreferences));
      saveLearnerProfile("understood", learningPreferences.detail);
      parentContainer.innerHTML = `<span class="feedback-status understood">Đã ghi nhận cách giải này cho các câu hỏi sau.</span>`;
    } else if (type === 'confused') {
      if (!responseElement || !responseGroup) return;
      saveLearnerProfile("confused", "Người học chưa nắm được cách giải ở lượt gần nhất.");
      const lastModelIndex = chatHistory.map(item => item.role).lastIndexOf("model");
      if (lastModelIndex >= 0) chatHistory.splice(lastModelIndex, 1);
      responseElement.innerHTML = `<span class="typing-dots" aria-label="AI đang viết lại"><span></span><span></span><span></span></span><span class="typing-label">AI đang viết lại...</span>`;
      const retryPrompt = buildActivePrompt() + `
    [PHẢN HỒI ÂM THẦM]: Câu trả lời vừa rồi chưa giúp người dùng hiểu. Hãy viết lại từ đầu bằng một cách giải thích khác hẳn, không lặp lại cấu trúc và câu chữ cũ. Bắt buộc dùng ít nhất một ví dụ thực tế, phép so sánh trực quan hoặc phản ví dụ phù hợp; sau đó kiểm tra lại bằng một câu hỏi ngắn để biết người học đã nắm ý chưa. Không nhắc đến phản hồi nội bộ này.`;
      let success;
      if (learningMode === "arena") {
        success = await callQwenArenaApi(responseElement.id);
      } else {
        const thinkingLevel = document.getElementById("thinkingMode").value;
        const modelName = thinkingLevel === "talking" ? GEMINI_TALKING_MODEL : GEMINI_STUDY_MODEL;
        const currentMode = document.getElementById("aiMode").value;
        const temperature = currentMode === "talkshow"
          ? 0.65
          : currentMode === "english"
            ? 0.45
            : thinkingLevel === "talking" ? 0.25 : 0.2;
        success = await callGeminiApi(responseElement.id, retryPrompt, modelName, thinkingLevel === "talking" ? "Gemini Flash-Lite" : "Gemini Flash", temperature);
      }
      if (!success) responseElement.innerHTML = "⚠️ Chưa thể viết lại lúc này. Cậu thử bấm gửi lại câu hỏi sau nhé!";
    }
  }

  function handleImageSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    selectedImageMimeType = file.type;
    const reader = new FileReader();
    reader.onload = function(evt) {
      selectedImageBase64 = evt.target.result.split(",")[1];
      document.getElementById("imagePreview").src = evt.target.result;
      document.getElementById("imageName").innerText = file.name;
      document.getElementById("imagePreviewContainer").style.display = "flex";
    };
    reader.readAsDataURL(file);
  }

  function removeSelectedImage() {
    selectedImageBase64 = null;
    selectedImageMimeType = null;
    document.getElementById("imageInput").value = "";
    document.getElementById("imagePreviewContainer").style.display = "none";
  }

  function clearChat() {
    if (confirm("Xóa toàn bộ lịch sử trò chuyện?")) {
      chatHistory = [];
      localStorage.removeItem(getHistoryKey());
      const welcomeText = activeSpace === "english"
        ? "Your English practice history is clear. Ready for a new conversation? 😊"
        : "Lịch sử trò chuyện đã được làm sạch! 😊";
      document.getElementById("msgContainer").innerHTML = `<div class="msg bot" id="welcomeMsg">${welcomeText}</div>`;
    }
  }

  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
</script>
